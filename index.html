<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ludo Twist</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 10px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #1e3c72,
            #2a5298
        );

    color: white;
    min-height: 100vh;

    overflow-x: hidden;
}

.header-row {
    width: 100%;
    max-width: 420px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 10px 0;
}

h2 {
    margin: 0;
}

.header-buttons {
    display: flex;
    gap: 7px;
}

.action-btn {
    border: none;
    border-radius: 20px;

    padding: 8px 12px;

    color: white;
    background: #f39c12;

    font-weight: bold;
    cursor: pointer;
}

.settings-btn {
    background: #34495e;
}

.action-btn:active {
    transform: scale(.95);
}

#identity-badge {
    display: none;

    background: #2ecc71;

    padding: 5px 12px;
    border-radius: 15px;

    font-weight: bold;
    font-size: 13px;
}

.modal-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.86);

    display: flex;

    justify-content: center;
    align-items: center;

    z-index: 1000;
}

#local-menu,
#online-menu,
#private-menu,
#help-screen,
#settings-screen {
    display: none;
}

.modal-box {
    width: 84%;
    max-width: 330px;

    padding: 24px;

    border-radius: 15px;

    background: white;
    color: #333;

    text-align: center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.5);
}

.setup-btn {
    width: 100%;

    padding: 12px;

    margin: 7px 0;

    border: none;
    border-radius: 8px;

    color: white;

    background: #1e90ff;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.secondary-btn {
    background: #2ecc71;
}

.purple-btn {
    background: #9b59b6;
}

.back-btn {
    background: #7f8c8d;
}

.game-container {

    display: none;

    width: 100%;
    max-width: 420px;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-top: 10px;
}

.board {

    grid-column: 1 / 3;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    grid-template-rows:
        repeat(5,1fr);

    gap: 4px;

    aspect-ratio: 1 / 1;

    padding: 6px;

    background: #2c3e50;

    border-radius: 12px;

    position: relative;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.4);
}

.cell {

    background: #ecf0f1;

    border-radius: 6px;

    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;

    box-shadow:
        inset 0 -3px 0
        rgba(0,0,0,.1);
}

.start-blue {
    background:
        linear-gradient(
            135deg,
            #74b9ff,
            #0984e3
        );
}

.start-red {
    background:
        linear-gradient(
            135deg,
            #ff7675,
            #d63031
        );
}

.start-green {
    background:
        linear-gradient(
            135deg,
            #55efc4,
            #00b894
        );
}

.start-yellow {
    background:
        linear-gradient(
            135deg,
            #ffeaa7,
            #fdcb6e
        );
}

.home-zone {

    background:
        linear-gradient(
            135deg,
            #9b59b6,
            #8e44ad
        );

    color: white;

    font-size: 13px;

    font-weight: bold;
}

.board-arrow {

    position: absolute;

    font-size: 26px;

    color:
        rgba(0,0,0,.25);

    pointer-events: none;
}

.pawn-layer {

    position: absolute;

    inset: 6px;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    grid-template-rows:
        repeat(5,1fr);

    pointer-events: none;

    z-index: 20;
}

.pawn-slot {

    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    gap: 3px;

    pointer-events: none;
}

.player-pawn {

    width: 19px;
    height: 19px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,.9);

    box-shadow:
        2px 3px 5px
        rgba(0,0,0,.45);

    transition:
        transform .12s ease;
}

.clickable-pawn {

    pointer-events: auto;

    cursor: pointer;

    box-shadow:
        0 0 9px 4px
        rgba(255,255,255,.9);

    animation:
        pawnPulse .8s infinite;
}

@keyframes pawnPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }

    100% {
        transform: scale(1);
    }
}

.player-panel {

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: .55;

    border:
        3px solid transparent;

    border-radius: 7px;

    transition:
        .2s;

    width: fit-content;

    margin: auto;
}

.active-turn {

    opacity: 1;

    border-color: #ffd700;

    transform: scale(1.04);
}

.panel-pawn-side {

    width: 44px;
    height: 44px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius:
        4px 0 0 4px;
}

#panel-0 .panel-pawn-side {
    background: #0984e3;
}

#panel-1 .panel-pawn-side {
    background: #d63031;
}

#panel-2 .panel-pawn-side {
    background: #00b894;
}

#panel-3 .panel-pawn-side {
    background: #fdcb6e;
}

.panel-pawn-icon {

    width: 24px;
    height: 24px;

    border-radius: 50%;

    border:
        2px solid white;
}

#panel-0 .panel-pawn-icon {
    background: #0984e3;
}

#panel-1 .panel-pawn-icon {
    background: #d63031;
}

#panel-2 .panel-pawn-icon {
    background: #00b894;
}

#panel-3 .panel-pawn-icon {
    background: #ffa502;
}

.ludo-dice {

    width: 48px;
    height: 44px;

    display: flex;

    justify-content: center;
    align-items: center;

    background: white;

    color: #111;

    border-radius:
        0 4px 4px 0;

    font-size: 26px;

    font-weight: 900;

    cursor: pointer;

    user-select: none;
}

.dice-disabled {

    pointer-events: none;

    opacity: .55;
}

#status {

    display: none;

    width: 100%;
    max-width: 390px;

    min-height: 22px;

    padding: 7px 12px;

    margin: 8px 0;

    border-radius: 20px;

    background:
        rgba(255,255,255,.94);

    color: #333;

    text-align: center;

    font-size: 14px;

    font-weight: bold;
}

.comm-dock {

    display: none;

    width: 100%;
    max-width: 420px;

    margin-top: 10px;

    padding: 8px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.3);
}

.chat-box {

    height: 75px;

    overflow-y: auto;

    padding: 6px;

    border-radius: 6px;

    background:
        rgba(255,255,255,.12);

    font-size: 12px;

    margin-bottom: 6px;
}

.chat-input-row {

    display: flex;

    gap: 5px;
}

.chat-input-row input {

    flex: 1;

    padding: 7px;

    border: none;

    border-radius: 5px;
}

.chat-input-row button {

    padding: 7px 10px;

    border: none;

    border-radius: 5px;

    background: #e67e22;

    color: white;

    font-weight: bold;
}

.mic-btn-active {

    background:
        #c0392b !important;

    animation:
        micPulse 1s infinite;
}

@keyframes micPulse {

    50% {
        transform: scale(1.05);
    }
}

</style>

</head>

<body>

<div id="setup-screen"
     class="modal-overlay">

    <div class="modal-box"
         id="main-menu">

        <h1>Ludo Twist</h1>

        <button
            class="setup-btn"
            onclick="showLocalMenu()">
            Play Local (Offline)
        </button>

        <button
            class="setup-btn secondary-btn"
            onclick="showOnlineMenu()">
            Play Online Multiplayer
        </button>

    </div>

    <div class="modal-box"
         id="local-menu">

        <h2>Local Mode</h2>

        <button class="setup-btn"
                onclick="startLocalGame(1)">
            1 Player (vs Bot)
        </button>

        <button class="setup-btn"
                onclick="startLocalGame(2)">
            2 Players
        </button>

        <button class="setup-btn"
                onclick="startLocalGame(3)">
            3 Players
        </button>

        <button class="setup-btn"
                onclick="startLocalGame(4)">
            4 Players
        </button>

        <button class="setup-btn back-btn"
                onclick="backToMain()">
            Back
        </button>

    </div>

    <div class="modal-box"
         id="online-menu">

        <h2>Online Multiplayer</h2>

        <button
            class="setup-btn secondary-btn"
            onclick="startOnlineGame(2)">
            Public 2 Player
        </button>

        <button
            class="setup-btn secondary-btn"
            onclick="startOnlineGame(3)">
            Public 3 Player
        </button>

        <button
            class="setup-btn secondary-btn"
            onclick="startOnlineGame(4)">
            Public 4 Player
        </button>

        <button
            class="setup-btn purple-btn"
            onclick="showPrivateMenu()">
            Private Room
        </button>

        <button
            class="setup-btn back-btn"
            onclick="backToMain()">
            Back
        </button>

    </div>

    <div class="modal-box"
         id="private-menu">

        <h2>Private Room</h2>

        <button
            class="setup-btn secondary-btn"
            onclick="createPrivateGame(2)">
            Create 2 Player
        </button>

        <button
            class="setup-btn secondary-btn"
            onclick="createPrivateGame(3)">
            Create 3 Player
        </button>

        <button
            class="setup-btn secondary-btn"
            onclick="createPrivateGame(4)">
            Create 4 Player
        </button>

        <p>
            <b>OR</b>
        </p>

        <input
            id="room-code-input"
            placeholder="Enter Room Code"
            style="
                width:100%;
                padding:10px;
                text-align:center;
                text-transform:uppercase;
                font-weight:bold;
            ">

        <button
            class="setup-btn purple-btn"
            onclick="joinPrivateGame()">
            Join Room
        </button>

        <button
            class="setup-btn back-btn"
            onclick="showOnlineMenu()">
            Back
        </button>

    </div>

</div>


<!-- SETTINGS -->

<div id="settings-screen"
     class="modal-overlay">

    <div class="modal-box">

        <h2>Settings</h2>

        <button
            id="sound-toggle-btn"
            class="setup-btn"
            onclick="toggleSound()">
            🔊 Sound: ON
        </button>

        <button
            class="setup-btn"
            style="background:#e74c3c"
            onclick="toggleSettings()">
            Close
        </button>

    </div>

</div>


<!-- HELP -->

<div id="help-screen"
     class="modal-overlay">

    <div class="modal-box">

        <h2>How to Play</h2>

        <p>
            Roll 1, 2, 3, 4 or 8.
        </p>

        <p>
            A roll of 4 or 8 gives an
            extra roll.
        </p>

        <p>
            Capture an opponent to
            get an extra turn.
        </p>

        <p>
            Reach HOME with all four
            pawns to finish.
        </p>

        <button
            class="setup-btn"
            style="background:#e74c3c"
            onclick="toggleHelp()">
            Close
        </button>

    </div>

</div>


<div class="header-row">

    <h2>Ludo Twist</h2>

    <div id="identity-badge">
        You are Blue
    </div>

    <div class="header-buttons">

        <button
            class="action-btn settings-btn"
            onclick="toggleSettings()">
            ⚙️
        </button>

        <button
            class="action-btn"
            onclick="toggleHelp()">
            ❓
        </button>

    </div>

</div>


<div id="status">
    Waiting...
</div>


<div class="game-container"
     id="game-container">

    <div class="player-panel"
         id="panel-0">

        <div class="panel-pawn-side">
            <div class="panel-pawn-icon"></div>
        </div>

        <div
            class="ludo-dice dice-disabled"
            id="dice-0"
            onclick="requestRoll(0)">
            🎲
        </div>

    </div>


    <div class="player-panel"
         id="panel-1">

        <div class="panel-pawn-side">
            <div class="panel-pawn-icon"></div>
        </div>

        <div
            class="ludo-dice dice-disabled"
            id="dice-1"
            onclick="requestRoll(1)">
            🎲
        </div>

    </div>


    <div class="board"
         id="board">

        <div id="pawn-layer"
             class="pawn-layer"></div>

    </div>


    <div class="player-panel"
         id="panel-2">

        <div class="panel-pawn-side">
            <div class="panel-pawn-icon"></div>
        </div>

        <div
            class="ludo-dice dice-disabled"
            id="dice-2"
            onclick="requestRoll(2)">
            🎲
        </div>

    </div>


    <div class="player-panel"
         id="panel-3">

        <div class="panel-pawn-side">
            <div class="panel-pawn-icon"></div>
        </div>

        <div
            class="ludo-dice dice-disabled"
            id="dice-3"
            onclick="requestRoll(3)">
            🎲
        </div>

    </div>

</div>


<div class="comm-dock"
     id="comm-dock">

    <div class="chat-box"
         id="chat-messages">
    </div>

    <div class="chat-input-row">

        <input
            id="chat-input"
            placeholder="Type message..."
            onkeydown="
                if(event.key==='Enter')
                    sendChatMessage()
            ">

        <button
            onclick="sendChatMessage()">
            Send
        </button>

        <button
            id="mic-btn"
            onclick="toggleMicrophone()">
            🎤 Mic
        </button>

    </div>

</div>


<script>

const socket = io();

let isOnlineMode = false;

let myPlayerId = null;

let activePlayers = [];

let activePlayerIndex = 0;

let activeRolls = [];

let canRoll = true;

let isAnimating = false;

let currentRank = 1;

let isSoundEnabled = true;

let audioCtx = null;

let mediaRecorder = null;

let micStream = null;

let micAudioCtx = null;

let localBotTimer = null;


const TOTAL_SPACES = 25;

const CENTER_SPACE = 12;


const PLAYER_DATA = [

    {
        id: 0,
        name: "Blue",
        color: "#1e90ff",

        path: [
            10,15,20,21,22,23,24,
            19,14,9,4,3,2,1,0,
            5,6,7,8,13,18,17,16,11,12
        ]
    },

    {
        id: 1,
        name: "Red",
        color: "#ff4757",

        path: [
            2,1,0,5,10,15,20,21,22,
            23,24,19,14,9,4,3,8,
            13,18,17,16,11,6,7,12
        ]
    },

    {
        id: 2,
        name: "Green",
        color: "#2ed573",

        path: [
            14,9,4,3,2,1,0,5,10,
            15,20,21,22,23,24,19,
            18,17,16,11,6,7,8,13,12
        ]
    },

    {
        id: 3,
        name: "Yellow",
        color: "#ffa502",

        path: [
            22,23,24,19,14,9,4,3,
            2,1,0,5,10,15,20,21,
            16,11,6,7,8,13,18,17,12
        ]
    }

];


const ARROWS = {

    10: "↓",
    22: "→",
    14: "↑",
    2: "←",
    11: "→",
    17: "↑",
    13: "←",
    7: "↓"

};


/* =========================
   MENUS
========================= */

function showLocalMenu() {

    document.getElementById(
        "main-menu"
    ).style.display = "none";

    document.getElementById(
        "local-menu"
    ).style.display = "block";
}


function showOnlineMenu() {

    document.getElementById(
        "main-menu"
    ).style.display = "none";

    document.getElementById(
        "private-menu"
    ).style.display = "none";

    document.getElementById(
        "online-menu"
    ).style.display = "block";
}


function showPrivateMenu() {

    document.getElementById(
        "online-menu"
    ).style.display = "none";

    document.getElementById(
        "private-menu"
    ).style.display = "block";
}


function backToMain() {

    document.getElementById(
        "local-menu"
    ).style.display = "none";

    document.getElementById(
        "online-menu"
    ).style.display = "none";

    document.getElementById(
        "private-menu"
    ).style.display = "none";

    document.getElementById(
        "main-menu"
    ).style.display = "block";
}


/* =========================
   SOCKET EVENTS
========================= */

socket.on(
    "assignPlayer",
    id => {

        myPlayerId = id;

        const player =
            PLAYER_DATA.find(
                p => p.id === id
            );

        if (player) {

            const badge =
                document.getElementById(
                    "identity-badge"
                );

            badge.innerText =
                `You are ${player.name}`;

            badge.style.display =
                "block";
        }

        document.getElementById(
            "status"
        ).style.display = "block";

        document.getElementById(
            "comm-dock"
        ).style.display = "block";
    }
);


socket.on(
    "systemMessage",
    msg => {

        document.getElementById(
            "status"
        ).innerText = msg;
    }
);


socket.on(
    "privateRoomCreated",
    code => {

        document.getElementById(
            "status"
        ).innerText =
            `Room Code: ${code}`;
    }
);


socket.on(
    "roomError",
    msg => {

        alert(msg);

        document.getElementById(
            "setup-screen"
        ).style.display = "flex";
    }
);


socket.on(
    "gameStart",
    ids => {

        activePlayers =
            ids.map(
                id => {

                    const base =
                        PLAYER_DATA.find(
                            p => p.id === id
                        );

                    return {
                        id: base.id,
                        name: base.name,
                        color: base.color,
                        path: base.path,

                        pawns: [0,0,0,0],

                        hasKilled: false,
                        hasWon: false,
                        winRank: 0,

                        isBot: false
                    };
                }
            );

        activePlayerIndex = 0;

        activeRolls = [];

        canRoll = true;

        isAnimating = false;

        currentRank = 1;

        document.getElementById(
            "game-container"
        ).style.display = "grid";

        document.getElementById(
            "comm-dock"
        ).style.display = "block";

        initBoard();

        renderBoard();

        updateUI();
    }
);


/*
    SERVER AUTHORITATIVE STATE
*/

socket.on(
    "forceSync",
    state => {

        if (!isOnlineMode) return;

        activePlayerIndex =
            state.activeIndex;

        activeRolls =
            Array.isArray(state.activeRolls)
                ? [...state.activeRolls]
                : [];

        canRoll =
            !!state.canRoll;

        isAnimating =
            !!state.processing;

        currentRank =
            state.rank || 1;

        state.players.forEach(
            serverPlayer => {

                const local =
                    activePlayers.find(
                        p => p.id === serverPlayer.id
                    );

                if (!local) return;

                local.pawns =
                    [...serverPlayer.pawns];

                local.hasKilled =
                    serverPlayer.hasKilled;

                local.hasWon =
                    serverPlayer.hasWon;

                local.winRank =
                    serverPlayer.winRank;
            }
        );

        renderBoard();

        updateUI();
    }
);


/*
    SERVER ROLL EVENT
*/

socket.on(
    "executeRoll",
    data => {

        const player =
            activePlayers.find(
                p => p.id === data.playerId
            );

        if (!player) return;

        const dice =
            document.getElementById(
                `dice-${data.playerId}`
            );

        if (dice) {

            dice.innerText =
                data.rollValue;
        }

        playDiceSound();
    }
);


/*
    SERVER MOVE EVENT
*/

socket.on(
    "executeMove",
    data => {

        animateServerMove(
            data.playerId,
            data.pawnIndex,
            data.rollValue
        );
    }
);


/* =========================
   ONLINE START
========================= */

function startOnlineGame(
    numberOfPlayers
) {

    initializeAudio();

    isOnlineMode = true;

    document.getElementById(
        "setup-screen"
    ).style.display = "none";

    document.getElementById(
        "status"
    ).style.display = "block";

    socket.emit(
        "joinGame",
        numberOfPlayers
    );
}


function createPrivateGame(
    numberOfPlayers
) {

    initializeAudio();

    isOnlineMode = true;

    document.getElementById(
        "setup-screen"
    ).style.display = "none";

    document.getElementById(
        "status"
    ).style.display = "block";

    socket.emit(
        "createPrivateGame",
        numberOfPlayers
    );
}


function joinPrivateGame() {

    const code =
        document.getElementById(
            "room-code-input"
        ).value
        .trim()
        .toUpperCase();

    if (!code) {

        alert(
            "Enter room code!"
        );

        return;
    }

    initializeAudio();

    isOnlineMode = true;

    document.getElementById(
        "setup-screen"
    ).style.display = "none";

    document.getElementById(
        "status"
    ).style.display = "block";

    socket.emit(
        "joinPrivateGame",
        code
    );
}


/* =========================
   LOCAL GAME
========================= */

function startLocalGame(
    numberOfPlayers
) {

    initializeAudio();

    isOnlineMode = false;

    document.getElementById(
        "setup-screen"
    ).style.display = "none";

    document.getElementById(
        "game-container"
    ).style.display = "grid";

    document.getElementById(
        "status"
    ).style.display = "block";

    document.getElementById(
        "comm-dock"
    ).style.display = "block";

    activePlayers = [];

    for (
        let i = 0;
        i < numberOfPlayers;
        i++
    ) {

        const data =
            PLAYER_DATA[i];

        activePlayers.push({

            id: data.id,

            name: data.name,

            color: data.color,

            path: data.path,

            pawns: [0,0,0,0],

            hasKilled: false,

            hasWon: false,

            winRank: 0,

            isBot:
                numberOfPlayers === 1
                ? i === 1
                : false
        });
    }

    /*
        For 1 player:
        Blue vs Green Bot
    */

    if (
        numberOfPlayers === 1
    ) {

        const bot =
            PLAYER_DATA[2];

        activePlayers = [

            {
                id: 0,
                name: "Blue",
                color: bot.color === "#2ed573"
                    ? "#1e90ff"
                    : "#1e90ff",

                path:
                    PLAYER_DATA[0].path,

                pawns: [0,0,0,0],

                hasKilled: false,
                hasWon: false,
                winRank: 0,

                isBot: false
            },

            {
                id: 2,
                name: "Green (Bot)",
                color: "#2ed573",

                path:
                    PLAYER_DATA[2].path,

                pawns: [0,0,0,0],

                hasKilled: false,
                hasWon: false,
                winRank: 0,

                isBot: true
            }

        ];
    }

    activePlayerIndex = 0;

    activeRolls = [];

    canRoll = true;

    isAnimating = false;

    currentRank = 1;

    myPlayerId = 0;

    document.getElementById(
        "identity-badge"
    ).style.display = "block";

    document.getElementById(
        "identity-badge"
    ).innerText =
        "You are Blue";

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const panel =
            document.getElementById(
                `panel-${i}`
            );

        const exists =
            activePlayers.some(
                p => p.id === i
            );

        panel.style.visibility =
            exists
                ? "visible"
                : "hidden";
    }

    initBoard();

    renderBoard();

    updateUI();
}


/* =========================
   BOARD
========================= */

function initBoard() {

    const board =
        document.getElementById(
            "board"
        );

    board.querySelectorAll(
        ".cell"
    ).forEach(
        cell => cell.remove()
    );

    for (
        let i = 0;
        i < TOTAL_SPACES;
        i++
    ) {

        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "cell";

        if (i === CENTER_SPACE) {

            cell.classList.add(
                "home-zone"
            );

            cell.innerText =
                "HOME";

        } else if (i === 10) {

            cell.classList.add(
                "start-blue"
            );

        } else if (i === 2) {

            cell.classList.add(
                "start-red"
            );

        } else if (i === 14) {

            cell.classList.add(
                "start-green"
            );

        } else if (i === 22) {

            cell.classList.add(
                "start-yellow"
            );
        }

        if (
            ARROWS[i] &&
            i !== CENTER_SPACE
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "board-arrow";

            arrow.innerText =
                ARROWS[i];

            cell.appendChild(
                arrow
            );
        }

        board.insertBefore(
            cell,
            document.getElementById(
                "pawn-layer"
            )
        );
    }

    const layer =
        document.getElementById(
            "pawn-layer"
        );

    layer.innerHTML = "";

    for (
        let i = 0;
        i < TOTAL_SPACES;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );

        slot.className =
            "pawn-slot";

        slot.id =
            `pawn-slot-${i}`;

        layer.appendChild(
            slot
        );
    }
}


/* =========================
   RENDER
========================= */

function renderBoard() {

    for (
        let i = 0;
        i < TOTAL_SPACES;
        i++
    ) {

        const slot =
            document.getElementById(
                `pawn-slot-${i}`
            );

        if (slot) {
            slot.innerHTML = "";
        }
    }

    if (
        !activePlayers.length
    ) return;

    const current =
        activePlayers[
            activePlayerIndex
        ];

    if (!current) return;

    activePlayers.forEach(
        player => {

            player.pawns.forEach(
                (step, pawnIndex) => {

                    const cell =
                        player.path[step];

                    const slot =
                        document.getElementById(
                            `pawn-slot-${cell}`
                        );

                    if (!slot) return;

                    const pawn =
                        document.createElement(
                            "div"
                        );

                    pawn.className =
                        "player-pawn";

                    pawn.style.backgroundColor =
                        player.color;

                    /*
                        Only allow the current
                        player to click a pawn.
                    */

                    const isCurrent =
                        player.id === current.id;

                    const myTurn =
                        isOnlineMode
                            ? player.id === myPlayerId
                            : player.id === myPlayerId;

                    const roll =
                        activeRolls.length
                            ? activeRolls[0]
                            : null;

                    const maximum =
                        player.hasKilled
                            ? 24
                            : 15;

                    const valid =
                        roll !== null &&
                        step + roll <= maximum;

                    if (
                        isCurrent &&
                        myTurn &&
                        valid &&
                        !isAnimating
                    ) {

                        pawn.classList.add(
                            "clickable-pawn"
                        );

                        pawn.onclick =
                            () => {

                                requestMove(
                                    player.id,
                                    pawnIndex
                                );
                            };
                    }

                    slot.appendChild(
                        pawn
                    );
                }
            );
        }
    );
}


/* =========================
   UI
========================= */

function updateUI() {

    if (
        !activePlayers.length
    ) return;

    const current =
        activePlayers[
            activePlayerIndex
        ];

    if (!current) return;

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const panel =
            document.getElementById(
                `panel-${i}`
            );

        const dice =
            document.getElementById(
                `dice-${i}`
            );

        const player =
            activePlayers.find(
                p => p.id === i
            );

        if (!player) {

            panel.style.visibility =
                "hidden";

            continue;
        }

        panel.style.visibility =
            "visible";

        if (player.hasWon) {

            dice.innerText =
                player.winRank === 1
                    ? "🥇"
                    : "👑";

            dice.classList.add(
                "dice-disabled"
            );

            continue;
        }

        if (
            current.id === player.id
        ) {

            panel.classList.add(
                "active-turn"
            );

            const mine =
                player.id === myPlayerId;

            if (
                mine &&
                canRoll &&
                !isAnimating
            ) {

                dice.classList.remove(
                    "dice-disabled"
                );

            } else {

                dice.classList.add(
                    "dice-disabled"
                );
            }

        } else {

            panel.classList.remove(
                "active-turn"
            );

            dice.classList.add(
                "dice-disabled"
            );
        }
    }
}


/* =========================
   ROLL
========================= */

function requestRoll(
    playerId
) {

    if (
        playerId !== myPlayerId
    ) return;

    if (
        !activePlayers[
            activePlayerIndex
        ]
    ) return;

    if (
        activePlayers[
            activePlayerIndex
        ].id !== playerId
    ) return;

    if (
        isAnimating ||
        !canRoll
    ) return;

    if (isOnlineMode) {

        /*
            IMPORTANT:
            Do NOT generate the dice
            result here.

            The server generates it.
        */

        canRoll = false;

        updateUI();

        socket.emit(
            "requestRoll"
        );

        return;
    }

    localRoll(
        playerId
    );
}


/* =========================
   LOCAL ROLL
========================= */

function localRoll(
    playerId
) {

    canRoll = false;

    updateUI();

    const rolls =
        [1,1,2,2,3,3,4,8];

    const roll =
        rolls[
            Math.floor(
                Math.random() *
                rolls.length
            )
        ];

    showRoll(
        playerId,
        roll
    );

    activeRolls.push(
        roll
    );

    if (
        roll === 4 ||
        roll === 8
    ) {

        canRoll = true;
    }

    processLocalTurn();
}


function showRoll(
    playerId,
    roll
) {

    const dice =
        document.getElementById(
            `dice-${playerId}`
        );

    if (dice) {
        dice.innerText = roll;
    }

    playDiceSound();
}


/* =========================
   LOCAL TURN
========================= */

function processLocalTurn(
    message = ""
) {

    const player =
        activePlayers[
            activePlayerIndex
        ];

    if (!player) return;

    while (
        activeRolls.length &&
        !hasLocalMove(
            player,
            activeRolls[0]
        )
    ) {

        const blocked =
            activeRolls.shift();

        message +=
            ` ${blocked} blocked.`;
    }

    if (
        activeRolls.length === 0 &&
        !canRoll
    ) {

        document.getElementById(
            "status"
        ).innerText =
            message ||
            "Turn over.";

        setTimeout(
            advanceLocalTurn,
            800
        );

        return;
    }

    renderBoard();

    updateUI();

    let status =
        message;

    if (
        activeRolls.length
    ) {

        status +=
            ` Rolls: ${
                activeRolls.join(", ")
            }`;

        status +=
            canRoll
                ? " — Roll again or move."
                : " — Choose a pawn.";
    } else if (canRoll) {

        status =
            player.isBot
                ? `${player.name}'s turn...`
                : "Your Turn! Roll.";
    }

    document.getElementById(
        "status"
    ).innerText =
        status;

    if (
        player.isBot &&
        !isAnimating
    ) {

        clearTimeout(
            localBotTimer
        );

        localBotTimer =
            setTimeout(
                botAction,
                700
            );
    }
}


function hasLocalMove(
    player,
    roll
) {

    const max =
        player.hasKilled
            ? 24
            : 15;

    return player.pawns.some(
        step =>
            step + roll <= max
    );
}


/* =========================
   LOCAL BOT
========================= */

function botAction() {

    const player =
        activePlayers[
            activePlayerIndex
        ];

    if (
        !player ||
        !player.isBot
    ) return;

    if (canRoll) {

        localRoll(
            player.id
        );

        return;
    }

    if (
        activeRolls.length
    ) {

        const roll =
            activeRolls[0];

        const max =
            player.hasKilled
                ? 24
                : 15;

        const possible = [];

        player.pawns.forEach(
            (step, index) => {

                if (
                    step + roll <= max
                ) {

                    possible.push(
                        index
                    );
                }
            }
        );

        if (
            possible.length
        ) {

            const pawnIndex =
                possible[
                    Math.floor(
                        Math.random() *
                        possible.length
                    )
                ];

            handleLocalMove(
                player.id,
                pawnIndex
            );
        }
    }
}


/* =========================
   MOVE REQUEST
========================= */

function requestMove(
    playerId,
    pawnIndex
) {

    if (
        playerId !== myPlayerId
    ) return;

    if (isAnimating) return;

    if (
        activeRolls.length === 0
    ) return;

    if (isOnlineMode) {

        /*
            Server validates
            everything.
        */

        isAnimating = true;

        renderBoard();

        updateUI();

        socket.emit(
            "requestMove",
            {
                pawnIndex
            }
        );

        return;
    }

    handleLocalMove(
        playerId,
        pawnIndex
    );
}


/* =========================
   ONLINE ANIMATION
========================= */

function animateServerMove(
    playerId,
    pawnIndex,
    roll
) {

    const player =
        activePlayers.find(
            p => p.id === playerId
        );

    if (!player) return;

    isAnimating = true;

    updateUI();

    let hops = 0;

    function hop() {

        if (
            hops < roll
        ) {

            playMoveSound();

            hops++;

            /*
                Visual-only animation.

                The server already owns
                the actual state.
            */

            setTimeout(
                hop,
                140
            );

        } else {

            isAnimating = false;

            renderBoard();

            updateUI();
        }
    }

    hop();
}


/* =========================
   LOCAL MOVE
========================= */

function handleLocalMove(
    playerId,
    pawnIndex
) {

    const player =
        activePlayers.find(
            p => p.id === playerId
        );

    if (!player) return;

    if (
        activeRolls.length === 0
    ) return;

    const roll =
        activeRolls.shift();

    isAnimating = true;

    updateUI();

    let hops = 0;

    function hop() {

        if (
            hops < roll
        ) {

            player.pawns[
                pawnIndex
            ]++;

            hops++;

            playMoveSound();

            renderBoard();

            setTimeout(
                hop,
                140
            );

        } else {

            finishLocalMove(
                player,
                pawnIndex
            );
        }
    }

    hop();
}


function finishLocalMove(
    player,
    pawnIndex
) {

    const step =
        player.pawns[
            pawnIndex
        ];

    const cell =
        player.path[step];

    let extraTurn = false;

    if (step === 24) {

        if (
            player.pawns.every(
                p => p === 24
            )
        ) {

            player.hasWon = true;

            player.winRank =
                currentRank++;

            isAnimating = false;

            renderBoard();

            updateUI();

            setTimeout(
                advanceLocalTurn,
                900
            );

            return;

        } else {

            extraTurn = true;
        }
    }

    let captured = false;

    if (
        ![
            2,
            10,
            14,
            22,
            12
        ].includes(cell)
    ) {

        activePlayers.forEach(
            opponent => {

                if (
                    opponent.id ===
                    player.id
                ) return;

                opponent.pawns.forEach(
                    (opStep, index) => {

                        if (
                            opStep < 24 &&
                            opponent.path[
                                opStep
                            ] === cell
                        ) {

                            opponent.pawns[
                                index
                            ] = 0;

                            captured = true;

                            player.hasKilled =
                                true;
                        }
                    }
                );
            }
        );
    }

    if (captured) {
        extraTurn = true;
    }

    isAnimating = false;

    if (
        activeRolls.length
    ) {

        canRoll = false;

        processLocalTurn();

        return;
    }

    if (extraTurn) {

        canRoll = true;

        processLocalTurn(
            captured
                ? "Captured! Extra turn!"
                : "Extra turn!"
        );

        return;
    }

    advanceLocalTurn();
}


/* =========================
   LOCAL NEXT TURN
========================= */

function advanceLocalTurn() {

    activeRolls = [];

    canRoll = true;

    isAnimating = false;

    let tries = 0;

    do {

        activePlayerIndex =
            (
                activePlayerIndex + 1
            ) %
            activePlayers.length;

        tries++;

    } while (
        activePlayers[
            activePlayerIndex
        ].hasWon &&
        tries <
            activePlayers.length + 1
    );

    activePlayers.forEach(
        player => {

            const dice =
                document.getElementById(
                    `dice-${player.id}`
                );

            if (
                dice &&
                !player.hasWon
            ) {

                dice.innerText =
                    "🎲";
            }
        }
    );

    processLocalTurn();
}


/* =========================
   SOUND
========================= */

function initializeAudio() {

    if (!audioCtx) {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioCtx.state ===
        "suspended"
    ) {

        audioCtx.resume();
    }
}


function playDiceSound() {

    if (!isSoundEnabled) return;

    initializeAudio();

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(
        180,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        420,
        audioCtx.currentTime + .08
    );

    gain.gain.setValueAtTime(
        .08,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        audioCtx.currentTime + .12
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime + .12
    );
}


function playMoveSound() {

    if (!isSoundEnabled) return;

    initializeAudio();

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(
        300,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        620,
        audioCtx.currentTime + .06
    );

    gain.gain.setValueAtTime(
        .12,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        audioCtx.currentTime + .1
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime + .1
    );
}


/* =========================
   SETTINGS / HELP
========================= */

function toggleSettings() {

    const screen =
        document.getElementById(
            "settings-screen"
        );

    screen.style.display =
        screen.style.display === "flex"
            ? "none"
            : "flex";
}


function toggleHelp() {

    const screen =
        document.getElementById(
            "help-screen"
        );

    screen.style.display =
        screen.style.display === "flex"
            ? "none"
            : "flex";
}


function toggleSound() {

    isSoundEnabled =
        !isSoundEnabled;

    document.getElementById(
        "sound-toggle-btn"
    ).innerText =
        isSoundEnabled
            ? "🔊 Sound: ON"
            : "🔇 Sound: OFF";
}


/* =========================
   CHAT
========================= */

function sendChatMessage() {

    const input =
        document.getElementById(
            "chat-input"
        );

    const text =
        input.value.trim();

    if (!text) return;

    const player =
        PLAYER_DATA.find(
            p => p.id === myPlayerId
        );

    const name =
        player
            ? player.name
            : "Player";

    if (isOnlineMode) {

        socket.emit(
            "sendChatMessage",
            {
                name,
                text
            }
        );

    } else {

        appendChat(
            name,
            text
        );
    }

    input.value = "";
}


socket.on(
    "receiveChatMessage",
    data => {

        appendChat(
            data.name,
            data.text
        );
    }
);


function appendChat(
    name,
    text
) {

    const box =
        document.getElementById(
            "chat-messages"
        );

    const div =
        document.createElement(
            "div"
        );

    div.innerHTML =
        `<b>${escapeHTML(name)}:</b>
         ${escapeHTML(text)}`;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;
}


function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   MICROPHONE
========================= */

async function toggleMicrophone() {

    const button =
        document.getElementById(
            "mic-btn"
        );

    if (!mediaRecorder) {

        try {

            micStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });

            mediaRecorder =
                new MediaRecorder(
                    micStream
                );

            mediaRecorder.ondataavailable =
                async event => {

                    if (
                        event.data.size === 0
                    ) return;

                    if (!isOnlineMode)
                        return;

                    const buffer =
                        await event.data.arrayBuffer();

                    socket.emit(
                        "voiceData",
                        buffer
                    );
                };

            mediaRecorder.start(100);

            button.classList.add(
                "mic-btn-active"
            );

            button.innerText =
                "🔴 Live";

        } catch (error) {

            alert(
                "Microphone permission was not allowed."
            );
        }

    } else {

        mediaRecorder.stop();

        if (micStream) {

            micStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

        mediaRecorder = null;

        button.classList.remove(
            "mic-btn-active"
        );

        button.innerText =
            "🎤 Mic";
    }
}


socket.on(
    "voiceData",
    async data => {

        try {

            if (!micAudioCtx) {

                micAudioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }

            if (
                micAudioCtx.state ===
                "suspended"
            ) {

                await micAudioCtx.resume();
            }

            const decoded =
                await micAudioCtx
                    .decodeAudioData(
                        data
                    );

            const source =
                micAudioCtx
                    .createBufferSource();

            source.buffer =
                decoded;

            source.connect(
                micAudioCtx.destination
            );

            source.start();

        } catch (error) {

            console.log(
                "Voice playback error",
                error
            );
        }
    }
);
