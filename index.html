<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ludo Twist</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    margin: 0;
    padding: 10px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #1e3c72 0%,
            #2a5298 100%
        );

    color: white;

    min-height: 100vh;

    overflow-x: hidden;
}


/* ---------------- HEADER ---------------- */

.header-row {

    display: flex;
    justify-content: space-between;
    align-items: center;

    width: 100%;
    max-width: 420px;

    margin: 10px 0;
}

h2 {
    margin: 0;

    text-shadow:
        2px 2px 4px rgba(0,0,0,.5);
}

.header-buttons {

    display: flex;
    gap: 8px;
}

.action-btn {

    background: #f39c12;

    color: white;

    border: none;

    padding: 8px 12px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 2px 4px rgba(0,0,0,.3);
}

.action-btn:active {
    transform: scale(.95);
}

.settings-btn {
    background: #34495e;
}


/* ---------------- BUTTONS ---------------- */

.setup-btn {

    display: block;

    width: 100%;

    margin: 10px 0;

    padding: 12px;

    background: #1e90ff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    box-shadow:
        0 4px 6px rgba(0,0,0,.2);
}

.secondary-btn {
    background: #2ecc71;
}

.purple-btn {
    background: #9b59b6;
}

.back-btn {
    background: #7f8c8d;
}


/* ---------------- MODALS ---------------- */

.modal-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.85);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 100;
}

#local-menu,
#online-menu,
#private-menu,
#help-screen,
#settings-screen {

    display: none;
}

.modal-box {

    background: white;

    color: #333;

    padding: 25px;

    border-radius: 15px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);

    width: 80%;

    max-width: 320px;
}

.modal-box p {
    text-align: left;
}


/* ---------------- IDENTITY ---------------- */

#identity-badge {

    background: #2ecc71;

    padding: 5px 15px;

    border-radius: 15px;

    font-weight: bold;

    font-size: 14px;

    display: none;

    box-shadow:
        0 2px 4px rgba(0,0,0,.3);
}


/* ---------------- GAME ---------------- */

.game-container {

    display: none;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    width: 100%;

    max-width: 420px;

    margin-top: 10px;
}


/* ---------------- BOARD ---------------- */

.board {

    grid-column: 1 / 3;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    grid-template-rows:
        repeat(5,1fr);

    aspect-ratio: 1 / 1;

    gap: 4px;

    background: #2c3e50;

    padding: 6px;

    border-radius: 12px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.4);

    position: relative;
}

.cell {

    background: #ecf0f1;

    border-radius: 6px;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    align-content: center;

    gap: 4px;

    position: relative;

    box-shadow:
        inset 0 -3px 0 rgba(0,0,0,.1);
}

.start-blue {
    background:
        linear-gradient(
            135deg,
            #74b9ff,
            #0984e3
        );
}

.start-red {
    background:
        linear-gradient(
            135deg,
            #ff7675,
            #d63031
        );
}

.start-green {
    background:
        linear-gradient(
            135deg,
            #55efc4,
            #00b894
        );
}

.start-yellow {
    background:
        linear-gradient(
            135deg,
            #ffeaa7,
            #fdcb6e
        );
}

.home-zone {

    background:
        linear-gradient(
            135deg,
            #9b59b6,
            #8e44ad
        );

    color: white;

    font-size: 14px;

    font-weight: bold;
}


/* ---------------- ARROWS ---------------- */

.board-arrow {

    position: absolute;

    font-size: 28px;

    color:
        rgba(0,0,0,.25);

    font-weight: bold;

    pointer-events: none;
}


/* ---------------- PAWN LAYER ---------------- */

.pawn-layer {

    position: absolute;

    inset: 6px;

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    grid-template-rows:
        repeat(5,1fr);

    pointer-events: none;

    z-index: 20;
}

.pawn-slot {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    align-content: center;

    gap: 3px;

    pointer-events: auto;
}


/* ---------------- PAWNS ---------------- */

.player-pawn {

    width: 18px;

    height: 18px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,.9);

    box-shadow:
        2px 3px 6px
        rgba(0,0,0,.45);

    transition:
        transform .12s ease,
        filter .12s ease;

    position: relative;
}


/*
   This animation plays every time
   renderBoard creates a pawn.
*/

.pawn-appear {

    animation:
        pawnStep .18s ease-out;
}

@keyframes pawnStep {

    0% {
        transform:
            translateY(-12px)
            scale(.75);

        filter:
            brightness(1.8);
    }

    60% {
        transform:
            translateY(3px)
            scale(1.15);
    }

    100% {
        transform:
            translateY(0)
            scale(1);
    }
}


/* ---------------- CLICKABLE PAWN ---------------- */

.clickable-pawn {

    cursor: pointer;

    box-shadow:
        0 0 10px 4px
        rgba(255,255,255,.9);

    animation:
        pawnPulse 1s infinite;
}

@keyframes pawnPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }

    100% {
        transform: scale(1);
    }
}


/* ---------------- PLAYER PANELS ---------------- */

.player-panel {

    display: flex;

    flex-direction: row;

    align-items: center;

    border-radius: 6px;

    opacity: .6;

    transition:
        opacity .2s,
        transform .2s;

    margin: 0 auto;

    width: fit-content;

    border:
        3px solid transparent;
}

.active-turn {

    opacity: 1;

    border-color: #ffd700;

    transform: scale(1.05);

    z-index: 5;
}

.panel-pawn-side {

    width: 44px;

    height: 44px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius:
        3px 0 0 3px;
}

#panel-0 .panel-pawn-side {
    background: #0984e3;
}

#panel-1 .panel-pawn-side {
    background: #d63031;
}

#panel-2 .panel-pawn-side {
    background: #00b894;
}

#panel-3 .panel-pawn-side {
    background: #fdcb6e;
}

.panel-pawn-icon {

    width: 24px;

    height: 24px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,.9);
}

#panel-0 .panel-pawn-icon {
    background: #0984e3;
}

#panel-1 .panel-pawn-icon {
    background: #d63031;
}

#panel-2 .panel-pawn-icon {
    background: #00b894;
}

#panel-3 .panel-pawn-icon {
    background: #ffa502;
}


/* ---------------- DICE ---------------- */

.ludo-dice {

    width: 44px;

    height: 44px;

    background: white;

    color: #111;

    border-radius:
        0 3px 3px 0;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 28px;

    font-weight: 900;

    cursor: pointer;

    user-select: none;
}

.dice-disabled {

    cursor: not-allowed;

    pointer-events: none;

    opacity: .7;
}


/* ---------------- STATUS ---------------- */

#status {

    font-size: 15px;

    font-weight: bold;

    margin: 8px 0;

    text-align: center;

    min-height: 22px;

    background:
        rgba(255,255,255,.9);

    padding: 6px 12px;

    border-radius: 20px;

    color: #333;

    display: none;

    width: 100%;

    max-width: 390px;
}


/* ---------------- CHAT ---------------- */

.comm-dock {

    display: none;

    width: 100%;

    max-width: 420px;

    margin-top: 10px;

    background:
        rgba(0,0,0,.3);

    border-radius: 10px;

    padding: 8px;
}

.chat-box {

    height: 70px;

    overflow-y: auto;

    background:
        rgba(255,255,255,.1);

    border-radius: 6px;

    padding: 5px;

    font-size: 12px;

    margin-bottom: 6px;

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.chat-input-row {

    display: flex;

    gap: 5px;
}

.chat-input-row input {

    flex: 1;

    padding: 6px;

    border-radius: 4px;

    border: none;

    font-size: 12px;
}

.chat-input-row button {

    padding: 6px 10px;

    border: none;

    background: #e67e22;

    color: white;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;
}

.mic-btn-active {

    background:
        #c0392b !important;

    animation:
        pawnPulse 1s infinite;
}

</style>

</head>

<!-- ==================================================

const totalSpaces = 25;

/* ==================================================
   MENU
================================================== */

function showLocalMenu() {

    document.getElementById("main-menu").style.display = "none";

    document.getElementById("local-menu").style.display = "block";
}


function showOnlineMenu() {

    document.getElementById("main-menu").style.display = "none";

    document.getElementById("local-menu").style.display = "none";

    document.getElementById("private-menu").style.display = "none";

    document.getElementById("online-menu").style.display = "block";
}


function showPrivateMenu() {

    document.getElementById("private-menu").style.display = "block";
}


function backToMain() {

    document.getElementById("local-menu").style.display = "none";

    document.getElementById("online-menu").style.display = "none";

    document.getElementById("private-menu").style.display = "none";

    document.getElementById("main-menu").style.display = "block";
}


/* ==================================================
   AUDIO ENGINE
================================================== */

function initAudio() {

    try {

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

    } catch(e) {

        console.log("Audio unavailable", e);

    }
}


/*
   Small mechanical pawn step sound.
   This is generated locally, so no sound file
   is required.
*/

function playPawnStepSound() {

    if (!isSoundEnabled) return;

    initAudio();

    if (!audioCtx) return;

    try {

        const now = audioCtx.currentTime;

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type = "triangle";

        osc.frequency.setValueAtTime(
            420,
            now
        );

        osc.frequency.exponentialRampToValueAtTime(
            680,
            now + 0.055
        );

        gain.gain.setValueAtTime(
            0.001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.16,
            now + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.11
        );

        osc.connect(gain);

        gain.connect(audioCtx.destination);

        osc.start(now);

        osc.stop(now + 0.12);


        /*
           Very short noise click.
        */

        const buffer =
            audioCtx.createBuffer(
                1,
                audioCtx.sampleRate * 0.025,
                audioCtx.sampleRate
            );

        const data =
            buffer.getChannelData(0);

        for (
            let i = 0;
            i < data.length;
            i++
        ) {

            data[i] =
                (Math.random() * 2 - 1) *
                Math.exp(-i / 70);

        }

        const noise =
            audioCtx.createBufferSource();

        const noiseGain =
            audioCtx.createGain();

        noise.buffer = buffer;

        noiseGain.gain.value = 0.07;

        noise.connect(noiseGain);

        noiseGain.connect(
            audioCtx.destination
        );

        noise.start(now);

    } catch(e) {

        console.log("Step sound error", e);

    }
}


function playCaptureSound() {

    if (!isSoundEnabled) return;

    initAudio();

    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(
        180,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        90,
        now + 0.25
    );

    gain.gain.setValueAtTime(
        0.15,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.25
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start(now);

    osc.stop(now + 0.25);
}


function playHomeSound() {

    if (!isSoundEnabled) return;

    initAudio();

    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    [523,659,784].forEach(
        (frequency,index) => {

            const osc =
                audioCtx.createOscillator();

            const gain =
                audioCtx.createGain();

            osc.type = "sine";

            osc.frequency.value =
                frequency;

            gain.gain.setValueAtTime(
                0.001,
                now + index * 0.08
            );

            gain.gain.exponentialRampToValueAtTime(
                0.18,
                now + index * 0.08 + 0.02
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + index * 0.08 + 0.25
            );

            osc.connect(gain);

            gain.connect(
                audioCtx.destination
            );

            osc.start(
                now + index * 0.08
            );

            osc.stop(
                now + index * 0.08 + 0.27
            );

        }
    );
}

/* ==================================================
   SYNC
================================================== */

socket.on(
    "forceSync",
    state => {

        if (!isOnlineMode) return;

        if (!state) return;

        activePlayerIndex =
            state.activeIndex;

        activeRolls =
            state.activeRolls || [];

        canRoll =
            state.canRoll;

        if (state.players) {

            state.players.forEach(
                serverPlayer => {

                    const localPlayer =
                        activePlayers.find(
                            p =>
                                p.id ===
                                serverPlayer.id
                        );

                    if (!localPlayer) return;

                    localPlayer.pawns =
                        serverPlayer.pawns;

                    localPlayer.hasKilled =
                        serverPlayer.hasKilled;

                    localPlayer.hasWon =
                        serverPlayer.hasWon;

                }
            );
        }

        isAnimating = false;

        renderBoard();

        processTurnState();

    }
);


/* ==================================================
   BOARD
================================================== */

function initBoardStaticStructure() {

    const board =
        document.getElementById(
            "board"
        );

    board
        .querySelectorAll(".cell")
        .forEach(
            cell => cell.remove()
        );


    for (
        let i = 0;
        i < totalSpaces;
        i++
    ) {

        const cell =
            document.createElement(
                "div"
            );

        cell.className = "cell";


        if (i === centerSpace) {

            cell.classList.add(
                "home-zone"
            );

            cell.appendChild(
                document.createTextNode(
                    "HOME"
                )
            );

        } else if (i === 10) {

            cell.classList.add(
                "start-blue"
            );

        } else if (i === 2) {

            cell.classList.add(
                "start-red"
            );

        } else if (i === 14) {

            cell.classList.add(
                "start-green"
            );

        } else if (i === 22) {

            cell.classList.add(
                "start-yellow"
            );
        }


        if (
            boardArrows[i] &&
            i !== centerSpace
        ) {

            const arrow =
                document.createElement(
                    "div"
                );

            arrow.className =
                "board-arrow";

            arrow.innerText =
                boardArrows[i];

            cell.appendChild(arrow);
        }


        board.insertBefore(
            cell,
            document.getElementById(
                "pawn-layer"
            )
        );

    }


    const layer =
        document.getElementById(
            "pawn-layer"
        );

    layer.innerHTML = "";


    for (
        let i = 0;
        i < totalSpaces;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );

        slot.className =
            "pawn-slot";

        slot.id =
            `pawn-slot-${i}`;

        layer.appendChild(slot);

    }

}


/* ==================================================
   RENDER BOARD
================================================== */

function renderBoard() {

    if (
        !document.getElementById(
            "pawn-slot-0"
        )
    ) {

        initBoardStaticStructure();
    }


    for (
        let i = 0;
        i < totalSpaces;
        i++
    ) {

        const slot =
            document.getElementById(
                `pawn-slot-${i}`
            );

        if (slot) {
            slot.innerHTML = "";
        }
    }


    if (!activePlayers.length) return;


    const currentPlayer =
        activePlayers[
            activePlayerIndex
        ];


    activePlayers.forEach(
        player => {

            player.pawns.forEach(
                (pawnStep,pawnIndex) => {

                    const gridIndex =
                        player.path[pawnStep];

                    const slot =
                        document.getElementById(
                            `pawn-slot-${gridIndex}`
                        );

                    if (!slot) return;


                    const pawn =
                        document.createElement(
                            "div"
                        );

                    pawn.className =
                        "player-pawn pawn-appear";

                    pawn.style.backgroundColor =
                        player.color;


                    const isMyTurn =
                        (
                            isOnlineMode &&
                            player.id ===
                            currentPlayer.id &&
                            myPlayerId ===
                            currentPlayer.id
                        )
                        ||
                        (
                            !isOnlineMode &&
                            player.id ===
                            currentPlayer.id &&
                            !player.isBot
                        );


                    if (
                        isMyTurn &&
                        activeRolls.length > 0 &&
                        !isAnimating
                    ) {

                        const roll =
                            activeRolls[0];

                        const future =
                            pawnStep + roll;


                        if (
                            future <=
                            (player.hasKilled
                                ? 24
                                : 15)
                        ) {

                            pawn.classList.add(
                                "clickable-pawn"
                            );


                            pawn.onclick =
                                () => {

                                    if (
                                        isAnimating
                                    ) return;

                                    isAnimating =
                                        true;

                                    updateUI();


                                    if (
                                        isOnlineMode
                                    ) {

                                        requestMove(
                                            player.id,
                                            pawnIndex
                                        );

                                    } else {

                                        handleIncomingMove(
                                            player.id,
                                            pawnIndex
                                        );

                                    }

                                };
                        }
                    }


                    slot.appendChild(
                        pawn
                    );

                }
            );

        }
    );


    updateUI();
}


/* ==================================================
   UI
================================================== */

function updateUI() {

    if (!activePlayers.length) return;

    const currentPlayer =
        activePlayers[
            activePlayerIndex
        ];

    if (!currentPlayer) return;


    const status =
        document.getElementById(
            "status"
        );


    if (!isAnimating) {

        status.style.color =
            currentPlayer.color;
    }


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const dice =
            document.getElementById(
                `dice-${i}`
            );

        const panel =
            document.getElementById(
                `panel-${i}`
            );

        const player =
            activePlayers.find(
                p => p.id === i
            );

        if (!player) continue;


        if (player.hasWon) {

            panel.classList.remove(
                "active-turn"
            );

            dice.classList.add(
                "dice-disabled"
            );

            dice.innerText =
                player.winRank === 1
                    ? "🥇"
                    : "👑";

            continue;
        }


        if (
            currentPlayer.id === i
        ) {

            panel.classList.add(
                "active-turn"
            );


            const myTurn =
                isOnlineMode
                    ? currentPlayer.id === myPlayerId
                    : !currentPlayer.isBot;


            if (
                isAnimating ||
                !canRoll ||
                !myTurn
            ) {

                dice.classList.add(
                    "dice-disabled"
                );

            } else {

                dice.classList.remove(
                    "dice-disabled"
                );

            }

        } else {

            panel.classList.remove(
                "active-turn"
            );

            dice.classList.add(
                "dice-disabled"
            );
        }

    }
}


/* ==================================================
   ROLL
================================================== */

function getRandomRoll() {

    return [
        1,1,
        2,2,
        3,3,
        4,8
    ][
        Math.floor(
            Math.random() * 8
        )
    ];
}


function requestRoll(playerId) {

    if (!activePlayers.length) return;

    const currentPlayer =
        activePlayers[
            activePlayerIndex
        ];


    if (
        !currentPlayer ||
        currentPlayer.id !== playerId ||
        isAnimating ||
        !canRoll
    ) {
        return;
    }


    const allowed =
        isOnlineMode
            ? playerId === myPlayerId
            : !currentPlayer.isBot;


    if (!allowed) return;


    canRoll = false;

    updateUI();


    const roll =
        getRandomRoll();


    if (isOnlineMode) {

        socket.emit(
            "requestRoll",
            {
                playerId,
                rollValue: roll
            }
        );

    } else {

        /*
           Small delay makes local dice feel
           more natural.
        */

        setTimeout(
            () => {

                handleIncomingRoll(
                    playerId,
                    roll
                );

            },
            100
        );
    }
}


/* ==================================================
   HANDLE ROLL
================================================== */

function handleIncomingRoll(
    playerId,
    rollValue
) {

    if (!activePlayers.length) return;


    const currentPlayer =
        activePlayers[
            activePlayerIndex
        ];


    /*
       Critical protection:
       Ignore rolls from players who aren't
       currently allowed to roll.
    */

    if (
        !currentPlayer ||
        currentPlayer.id !== playerId ||
        isAnimating
    ) {
        return;
    }


    /*
       Don't allow duplicate roll
       packets to create duplicate chances.
    */

    if (
        !canRoll &&
        activeRolls.length === 0
    ) {

        /*
           The first roll after clicking
           is allowed because requestRoll()
           already changed canRoll.
        */

    }


    initAudio();


    const dice =
        document.getElementById(
            `dice-${playerId}`
        );

    dice.innerText =
        rollValue;


    activeRolls.push(
        rollValue
    );


    /*
       ONLY 4 or 8 gives another roll.
    */

    canRoll =
        rollValue === 4 ||
        rollValue === 8;


    processTurnState();

    broadcastSyncState();
}


/* ==================================================
   TURN PROCESSOR
================================================== */

function processTurnState(
    customMessage = null
) {

    if (!activePlayers.length) return;


    const player =
        activePlayers[
            activePlayerIndex
        ];

    if (!player) return;


    /*
       Remove impossible rolls.
    */

    while (
        activeRolls.length > 0
    ) {

        const roll =
            activeRolls[0];

        const valid =
            player.pawns.some(
                pawn =>
                    pawn + roll <=
                    (
                        player.hasKilled
                            ? 24
                            : 15
                    )
            );


        if (valid) break;


        activeRolls.shift();


        customMessage =
            (
                customMessage
                    ? customMessage + " "
                    : ""
            )
            +
            `${roll} blocked.`;
    }


    /*
       No roll and no moves.
    */

    if (
        activeRolls.length === 0 &&
        !canRoll
    ) {

        isAnimating = true;

        document.getElementById(
            "status"
        ).innerText =
            customMessage ||
            "No moves left. Turn over!";


        const thisTurn =
            turnVersion;


        clearBotTimer();


        setTimeout(
            () => {

                if (
                    thisTurn !==
                    turnVersion
                ) return;

                advanceToNextPlayer();

            },
            900
        );


        updateUI();

        return;
    }


    renderBoard();


    let message =
        customMessage
            ? customMessage + " "
            : "";


    if (
        activeRolls.length > 0
    ) {

        message +=
            `[Rolls: ${activeRolls.join(", ")}] `;


        const myTurn =
            isOnlineMode
                ? player.id === myPlayerId
                : !player.isBot;


        if (canRoll) {

            message +=
                myTurn
                    ? "Roll again or move!"
                    : "Waiting...";

        } else {

            message +=
                myTurn
                    ? "Tap a glowing pawn."
                    : "Moving...";
        }

    } else if (canRoll) {

        const myTurn =
            isOnlineMode
                ? player.id === myPlayerId
                : !player.isBot;


        message +=
            myTurn
                ? "Your Turn! Roll."
                : `${player.name}'s turn...`;
    }


    document.getElementById(
        "status"
    ).innerText = message;


    /*
       BOT
    */

    if (
        !isOnlineMode &&
        player.isBot &&
        !isAnimating
    ) {

        scheduleBotAction();

    }

}


/* ==================================================
   BOT SCHEDULER
================================================== */

function clearBotTimer() {

    if (botTimer) {

        clearTimeout(botTimer);

        botTimer = null;
    }
}


function scheduleBotAction() {

    clearBotTimer();


    if (isOnlineMode) return;

    if (isAnimating) return;

    const player =
        activePlayers[
            activePlayerIndex
        ];

    if (!player) return;

    if (!player.isBot) return;

    const version =
        turnVersion;


    botTimer =
        setTimeout(
            () => {

                botTimer = null;


                /*
                   If turn changed while
                   timer was waiting, cancel.
                */

                if (
                    version !==
                    turnVersion
                ) return;


                if (isAnimating) return;


                const current =
                    activePlayers[
                        activePlayerIndex
                    ];


                if (
                    !current ||
                    !current.isBot
                ) return;


                /*
                   Bot needs a roll.
                */

                if (
                    canRoll &&
                    activeRolls.length === 0
                ) {

                    const roll =
                        getRandomRoll();


                    canRoll = false;

                    handleIncomingRoll(
                        current.id,
                        roll
                    );

                    return;
                }


                /*
                   Bot needs to move.
                */

                if (
                    activeRolls.length > 0 &&
                    !canRoll
                ) {

                    const roll =
                        activeRolls[0];


                    const validPawns = [];


                    current.pawns.forEach(
                        (step,index) => {

                            if (
                                step + roll <=
                                (
                                    current.hasKilled
                                        ? 24
                                        : 15
                                )
                            ) {

                                validPawns.push(
                                    index
                                );
                            }

                        }
                    );


                    if (
                        validPawns.length > 0
                    ) {

                        /*
                           Prefer a pawn closer
                           to home.
                        */

                        validPawns.sort(
                            (a,b) =>
                                current.pawns[b] -
                                current.pawns[a]
                        );


                        const pawnIndex =
                            validPawns[
                                Math.floor(
                                    Math.random() *
                                    Math.min(
                                        validPawns.length,
                                        2
                                    )
                                )
                            ];


                        handleIncomingMove(
                            current.id,
                            pawnIndex
                        );

                    }

                }

            },
            650
        );
}


/* ==================================================
   MOVE
================================================== */

function requestMove(
    playerId,
    pawnIndex
) {

    if (!isOnlineMode) return;

    socket.emit(
        "requestMove",
        {
            playerId,
            pawnIndex
        }
    );
}


/* ==================================================
   HANDLE MOVE
================================================== */

function handleIncomingMove(
    playerId,
    pawnIndex
) {

    if (!activePlayers.length) return;

    if (isAnimating) return;


    const player =
        activePlayers.find(
            p => p.id === playerId
        );


    if (!player) return;


    const currentPlayer =
        activePlayers[
            activePlayerIndex
        ];


    /*
       Critical turn protection.
    */

    if (
        currentPlayer.id !==
        playerId
    ) {
        return;
    }


    if (
        pawnIndex < 0 ||
        pawnIndex >= player.pawns.length
    ) {
        return;
    }


    if (
        activeRolls.length === 0
    ) {
        return;
    }


    const targetSteps =
        activeRolls.shift();


    if (
        player.pawns[pawnIndex] +
        targetSteps >
        (
            player.hasKilled
                ? 24
                : 15
        )
    ) {

        activeRolls.unshift(
            targetSteps
        );

        return;
    }


    isAnimating = true;

    updateUI();


    let stepsTaken = 0;


    function hop() {

        if (
            stepsTaken <
            targetSteps &&
            player.pawns[pawnIndex] <
            24
        ) {

            player.pawns[pawnIndex]++;

            stepsTaken++;


            /*
               SOUND ON EVERY STEP
            */

            playPawnStepSound();


            /*
               Re-render creates the
               small pawn-hop animation.
            */

            renderBoard();


            setTimeout(
                hop,
                180
            );

            return;
        }


        finishMove();

    }


    function finishMove() {

        const finalStep =
            player.pawns[pawnIndex];

        const finalGridCell =
            player.path[finalStep];


        let earnedExtraTurn = false;

        let customMessage = null;


        /*
           Pawn reached HOME.
        */

        if (
            finalStep === 24
        ) {

            playHomeSound();


            if (
                player.pawns.every(
                    p => p === 24
                )
            ) {

                player.hasWon = true;

                player.winRank =
                    currentRank++;


                isAnimating = false;

                renderBoard();


                setTimeout(
                    () => {

                        advanceToNextPlayer();

                    },
                    1000
                );

                return;

            } else {

                earnedExtraTurn = true;

                customMessage =
                    "Pawn Home! Extra Turn!";

            }
        }


        /*
           Capture opponents.
        */

        const captured = [];


        if (
            ![
                2,
                10,
                14,
                22,
                12
            ].includes(
                finalGridCell
            )
        ) {

            activePlayers.forEach(
                opponent => {

                    if (
                        opponent.id ===
                        playerId ||
                        opponent.hasWon
                    ) return;


                    opponent.pawns.forEach(
                        (step,index) => {

                            if (
                                opponent.path[step] ===
                                finalGridCell &&
                                step < 24
                            ) {

                                captured.push({
                                    player:
                                        opponent,

                                    pawnIdx:
                                        index
                                });

                            }

                        }
                    );

                }
            );
        }


        if (
            captured.length > 0
        ) {

            earnedExtraTurn = true;

            player.hasKilled = true;

            playCaptureSound();


            /*
               Send captured pawn
               backwards one step at
               a time.
            */

            let captureIndex = 0;


            function captureNext() {

                if (
                    captureIndex >=
                    captured.length
                ) {

                    finishAfterCapture();

                    return;
                }


                const target =
                    captured[
                        captureIndex
                    ];


                function stepBack() {

                    if (
                        target.player
                            .pawns[
                                target.pawnIdx
                            ] > 0
                    ) {

                        target.player
                            .pawns[
                                target.pawnIdx
                            ]--;


                        playPawnStepSound();

                        renderBoard();


                        setTimeout(
                            stepBack,
                            80
                        );

                    } else {

                        captureIndex++;

                        setTimeout(
                            captureNext,
                            100
                        );

                    }

                }


                stepBack();

            }


            captureNext();

            return;

        }


        finishAfterCapture();


        function finishAfterCapture() {

            isAnimating = false;


            if (
                earnedExtraTurn &&
                activeRolls.length === 0
            ) {

                canRoll = true;

            }


            processTurnState(
                customMessage
            );


            broadcastSyncState();
        }

    }


    hop();

}


/* ==================================================
   NEXT PLAYER
================================================== */

function advanceToNextPlayer() {

    clearBotTimer();


    activeRolls = [];

    canRoll = true;

    isAnimating = false;


    turnVersion++;


    if (!activePlayers.length) return;


    let safety = 0;


    do {

        activePlayerIndex =
            (
                activePlayerIndex + 1
            )
            %
            activePlayers.length;

        safety++;

    } while (
        activePlayers[
            activePlayerIndex
        ].hasWon &&
        safety < 10
    );


    /*
       Reset dice.
    */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const dice =
            document.getElementById(
                `dice-${i}`
            );

        const player =
            activePlayers.find(
                p => p.id === i
            );


        if (
            dice &&
            player &&
            !player.hasWon
        ) {

            dice.innerText = "🎲";
        }
    }


    processTurnState();

    broadcastSyncState();
}


/* ==================================================
   SYNC
================================================== */

function broadcastSyncState() {

    if (!isOnlineMode) return;

    socket.emit(
        "syncState",
        {

            activeIndex:
                activePlayerIndex,

            activeRolls:
                [...activeRolls],

            canRoll:
                canRoll,

            players:
                activePlayers.map(
                    p => ({
                        id: p.id,
                        pawns:
                            [...p.pawns],
                        hasKilled:
                            p.hasKilled,
                        hasWon:
                            p.hasWon,
                        winRank:
                            p.winRank
                    })
                )

        }
    );
}


/* ==================================================
   CHAT
================================================== */

function sendChatMessage() {

    const input =
        document.getElementById(
            "chat-input"
        );

    const text =
        input.value.trim();

    if (!text) return;


    const player =
        allPlayers.find(
            p => p.id === myPlayerId
        );


    const name =
        player
            ? player.name
            : "Player";


    if (isOnlineMode) {

        socket.emit(
            "sendChatMessage",
            {
                name,
                text
            }
        );

    } else {

        appendChatMsg(
            name,
            text
        );
    }


    input.value = "";
}


socket.on(
    "receiveChatMessage",
    data => {

        appendChatMsg(
            data.name,
            data.text
        );
    }
);


function appendChatMsg(
    name,
    text
) {

    const box =
        document.getElementById(
            "chat-messages"
        );


    const div =
        document.createElement(
            "div"
        );


    /*
       textContent prevents HTML
       from being injected into chat.
    */

    const bold =
        document.createElement(
            "b"
        );

    bold.textContent =
        `${name}: `;

    div.appendChild(
        bold
    );

    div.appendChild(
        document.createTextNode(
            text
        )
    );


    box.appendChild(
        div
    );


    box.scrollTop =
        box.scrollHeight;
}


/* ==================================================
   MICROPHONE
================================================== */

async function toggleMicrophone() {

    const btn =
        document.getElementById(
            "mic-btn"
        );


    if (!isOnlineMode) {

        alert(
            "Microphone voice chat is available in Online Multiplayer."
        );

        return;
    }


    if (!isMicActive) {

        try {

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });


            mediaRecorder =
                new MediaRecorder(
                    stream
                );


            mediaRecorder.ondataavailable =
                async event => {

                    if (
                        event.data.size === 0
                    ) return;


                    const buffer =
                        await event.data.arrayBuffer();


                    socket.emit(
                        "voiceData",
                        buffer
                    );
                };


            mediaRecorder.onstop =
                () => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );
                };


            mediaRecorder.start(
                250
            );


            isMicActive = true;

            btn.classList.add(
                "mic-btn-active"
            );

            btn.innerText =
                "🔴";


        } catch(error) {

            console.error(
                error
            );

            alert(
                "Microphone permission was denied or microphone is unavailable."
            );

        }

    } else {

        if (mediaRecorder) {

            mediaRecorder.stop();

            mediaRecorder = null;
        }


        isMicActive = false;

        btn.classList.remove(
            "mic-btn-active"
        );

        btn.innerText =
            "🎤";
    }
}


/* ==================================================
   RECEIVE VOICE
================================================== */

socket.on(
    "voiceData",
    async audioData => {

        try {

            if (!micAudioCtx) {

                micAudioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }


            if (
                micAudioCtx.state ===
                "suspended"
            ) {

                await micAudioCtx.resume();
            }


            /*
               Convert Socket.IO data
               into ArrayBuffer.
            */

            let buffer;


            if (
                audioData instanceof ArrayBuffer
            ) {

                buffer =
                    audioData;

            } else if (
                audioData &&
                audioData.buffer
            ) {

                buffer =
                    audioData.buffer;

            } else {

                return;
            }


            const decoded =
                await micAudioCtx
                    .decodeAudioData(
                        buffer.slice(0)
                    );


            const source =
                micAudioCtx
                    .createBufferSource();


            source.buffer =
                decoded;


            source.connect(
                micAudioCtx.destination
            );


            source.start();

        } catch(error) {

            console.log(
                "Voice decode error:",
                error
            );

        }

    }
);
