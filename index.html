<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Ludo Twist</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    font-family: Arial, "Segoe UI", sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    color: white;
    min-height: 100vh;
}

button {
    font-family: inherit;
}

.header {
    width: 100%;
    max-width: 430px;
    margin: 8px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header h2 {
    margin: 0;
}

.header-buttons {
    display: flex;
    gap: 6px;
}

.action-btn {
    border: none;
    border-radius: 20px;
    padding: 8px 12px;
    color: white;
    background: #34495e;
    font-weight: bold;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.86);
}

.modal-box {
    width: 88%;
    max-width: 340px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    color: #222;
    padding: 22px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

.modal-box h1,
.modal-box h2 {
    margin-top: 0;
}

.menu-btn {
    width: 100%;
    border: none;
    margin: 7px 0;
    padding: 13px;
    border-radius: 9px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    background: #1e90ff;
}

.green {
    background: #2ecc71;
}

.purple {
    background: #9b59b6;
}

.gray {
    background: #7f8c8d;
}

.red {
    background: #e74c3c;
}

.orange {
    background: #e67e22;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid #ccc;
    font-size: 16px;
    text-align: center;
    text-transform: uppercase;
}

#status {
    width: 100%;
    max-width: 430px;
    min-height: 30px;
    margin: 8px auto;
    padding: 7px 12px;
    background: rgba(255,255,255,.95);
    color: #222;
    border-radius: 20px;
    text-align: center;
    font-weight: bold;
    transition: .2s;
}

.status-pop {
    animation: statusPop .35s ease;
}

@keyframes statusPop {
    0% { transform: scale(.9); }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

#identity {
    display: none;
    width: fit-content;
    margin: 5px auto;
    padding: 5px 15px;
    border-radius: 20px;
    background: #2ecc71;
    font-weight: bold;
}

/* GAME */

#game {
    display: none;
    width: 100%;
    max-width: 430px;
    margin: auto;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
}

.player-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid transparent;
    border-radius: 9px;
    opacity: .45;
    transition: .25s;
    min-height: 58px;
}

.player-panel.active {
    opacity: 1;
    border-color: #ffd700;
    transform: scale(1.03);
    animation: turnGlow 1.2s infinite alternate;
}

@keyframes turnGlow {
    from {
        box-shadow: 0 0 4px rgba(255,215,0,.3);
    }

    to {
        box-shadow: 0 0 18px rgba(255,215,0,.9);
    }
}

.player-name {
    padding: 8px;
    font-weight: bold;
    font-size: 13px;
}

.dice {
    width: 48px;
    height: 44px;
    border: none;
    border-radius: 7px;
    background: white;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

.dice.disabled {
    opacity: .4;
    pointer-events: none;
}

.dice.rolling {
    animation: diceRoll .55s ease-in-out;
}

@keyframes diceRoll {
    0% {
        transform: rotate(0deg) scale(1);
    }

    25% {
        transform: rotate(90deg) scale(1.15);
    }

    50% {
        transform: rotate(180deg) scale(.9);
    }

    75% {
        transform: rotate(270deg) scale(1.15);
    }

    100% {
        transform: rotate(360deg) scale(1);
    }
}

/* BOARD */

.board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);
    gap: 4px;
    width: 100%;
    aspect-ratio: 1;
    padding: 6px;
    background: #263746;
    border-radius: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
}

.cell {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
    background: #ecf0f1;
    color: #333;
    font-size: 10px;
    font-weight: bold;
    overflow: hidden;
}

.blue-cell {
    background: linear-gradient(135deg,#74b9ff,#0984e3);
}

.red-cell {
    background: linear-gradient(135deg,#ff7675,#d63031);
}

.green-cell {
    background: linear-gradient(135deg,#55efc4,#00b894);
}

.yellow-cell {
    background: linear-gradient(135deg,#ffeaa7,#fdcb6e);
}

.home-cell {
    background: linear-gradient(135deg,#9b59b6,#8e44ad);
    color: white;
}

.start-marker {
    position: absolute;
    bottom: 2px;
    right: 3px;
    font-size: 9px;
    opacity: .65;
}

.pawn-layer {
    position: absolute;
    inset: 6px;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);
    pointer-events: none;
    z-index: 20;
}

.pawn-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px;
    pointer-events: none;
    min-width: 0;
    min-height: 0;
}

.pawn {
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 2px 3px 5px rgba(0,0,0,.5);
    pointer-events: auto;
    transition: transform .15s;
    position: relative;
    z-index: 30;
}

.pawn.clickable {
    cursor: pointer;
    animation: pawnPulse 1s infinite;
    box-shadow: 0 0 10px 4px white;
}

@keyframes pawnPulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.35);
    }

    100% {
        transform: scale(1);
    }
}

.pawn.moving {
    animation: pawnMove .25s ease-in-out;
}

@keyframes pawnMove {
    0% {
        transform: scale(.8);
    }

    50% {
        transform: scale(1.4);
    }

    100% {
        transform: scale(1);
    }
}

.pawn.capture {
    animation: capturePawn .65s ease;
}

@keyframes capturePawn {
    0% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.6) rotate(15deg);
    }

    60% {
        transform: scale(.7) rotate(-15deg);
    }

    100% {
        transform: scale(1);
    }
}

.pawn.home-animation {
    animation: homePawn 1s ease;
}

@keyframes homePawn {
    0% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.7) rotate(15deg);
    }

    60% {
        transform: scale(1.25) rotate(-15deg);
    }

    100% {
        transform: scale(1);
    }
}

/* EFFECTS */

.effect {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    left: 50%;
    top: 42%;
    transform: translate(-50%,-50%);
    font-size: 32px;
    font-weight: bold;
    text-shadow: 2px 2px 5px #000;
}

.capture-effect {
    animation: captureText .8s ease forwards;
}

@keyframes captureText {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.5);
    }

    30% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.3);
    }

    100% {
        opacity: 0;
        transform: translate(-50%,-80%) scale(1.8);
    }
}

.home-effect {
    animation: homeText 1s ease forwards;
}

@keyframes homeText {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.5);
    }

    25% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.3);
    }

    100% {
        opacity: 0;
        transform: translate(-50%,-90%) scale(1.5);
    }
}

.win-effect {
    animation: winText 1.5s ease forwards;
}

@keyframes winText {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.4);
    }

    25% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.4);
    }

    70% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(1.5);
    }
}

/* CHAT */

#communication {
    display: none;
    width: 100%;
    max-width: 430px;
    margin: 10px auto;
    padding: 8px;
    border-radius: 10px;
    background: rgba(0,0,0,.3);
}

#chat {
    height: 90px;
    overflow-y: auto;
    padding: 6px;
    margin-bottom: 6px;
    background: rgba(255,255,255,.1);
    border-radius: 6px;
    font-size: 12px;
}

.chat-message {
    margin-bottom: 4px;
}

.chat-name {
    font-weight: bold;
}

.chat-row {
    display: flex;
    gap: 5px;
}

.chat-row input {
    flex: 1;
    text-align: left;
    text-transform: none;
    padding: 8px;
    font-size: 13px;
}

.chat-row button {
    border: none;
    border-radius: 5px;
    padding: 7px 10px;
    color: white;
    background: #e67e22;
    font-weight: bold;
}

#micBtn {
    background: #34495e;
}

#micBtn.active {
    background: #c0392b;
    animation: micPulse 1s infinite;
}

@keyframes micPulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1);
    }
}

.hidden {
    display: none !important;
}

#roomInfo {
    display: none;
    text-align: center;
    margin: 5px auto;
    font-size: 13px;
}

#roomInfo span {
    background: rgba(0,0,0,.3);
    padding: 4px 9px;
    border-radius: 12px;
    font-weight: bold;
}

#rollHint {
    text-align: center;
    font-size: 12px;
    margin: 5px;
    opacity: .85;
}
</style>
</head>

<body>

<!-- SETUP -->

<div id="setup" class="modal">

    <div id="mainMenu" class="modal-box">

        <h1>🎲 Ludo Twist</h1>

        <button class="menu-btn"
                onclick="showLocalMenu()">
            Play Local
        </button>

        <button class="menu-btn green"
                onclick="showOnlineMenu()">
            Play Online
        </button>

    </div>

    <div id="localMenu"
         class="modal-box hidden">

        <h2>Local Game</h2>

        <button class="menu-btn"
                onclick="startLocal(1)">
            1 Player vs Bot
        </button>

        <button class="menu-btn"
                onclick="startLocal(2)">
            2 Players
        </button>

        <button class="menu-btn"
                onclick="startLocal(3)">
            3 Players
        </button>

        <button class="menu-btn"
                onclick="startLocal(4)">
            4 Players
        </button>

        <button class="menu-btn gray"
                onclick="backMain()">
            Back
        </button>

    </div>

    <div id="onlineMenu"
         class="modal-box hidden">

        <h2>Online Multiplayer</h2>

        <button class="menu-btn green"
                onclick="startOnline(2)">
            Public 2 Players
        </button>

        <button class="menu-btn green"
                onclick="startOnline(3)">
            Public 3 Players
        </button>

        <button class="menu-btn green"
                onclick="startOnline(4)">
            Public 4 Players
        </button>

        <hr>

        <button class="menu-btn purple"
                onclick="showPrivate()">
            Private Room

        <button class="menu-btn gray"
                onclick="backMain()">
            Back
        </button>

    </div>

    <div id="privateMenu"
         class="modal-box hidden">

        <h2>Private Room</h2>

        <button class="menu-btn green"
                onclick="createPrivate(2)">
            Create 2 Player Room
        </button>

        <button class="menu-btn green"
                onclick="createPrivate(3)">
            Create 3 Player Room
        </button>

        <button class="menu-btn green"
                onclick="createPrivate(4)">
            Create 4 Player Room
        </button>

        <p>OR</p>

        <input id="roomCode"
               placeholder="ROOM CODE">

        <button class="menu-btn purple"

        <button class="menu-btn gray"
                onclick="showOnlineMenu()">
            Back
        </button>

    </div>

</div>


<!-- SETTINGS -->

<div id="settings"
     class="modal hidden">

    <div class="modal-box">

        <h2>Settings</h2>

        <button id="soundBtn"
                class="menu-btn"
                onclick="toggleSound()">
            🔊 Sound: ON
        </button>

        <button class="menu-btn red"
                onclick="closeSettings()">
            Close
        </button>

    </div>

</div>


<!-- HELP -->

<div id="help"
     class="modal hidden">

    <div class="modal-box">

        <h2>How to Play</h2>

        <p>🎲 Roll when it is your turn.</p>

        <p>4 or 8 gives an extra roll.</p>

        <p>Capture an opponent for an extra turn.</p>

        <p>Reach HOME with all four pawns to finish.</p>

        <button class="menu-btn red"
                onclick="closeHelp()">
            Close
        </button>

    </div>

</div>


<div class="header">

    <h2>🎲 Ludo Twist</h2>

    <div class="header-buttons">

        <button class="action-btn"
                onclick="openSettings()">
            ⚙️
        </button>

        <button class="action-btn"
                onclick="openHelp()">
            ❓
        </button>

    </div>

</div>


<div id="identity"></div>

<div id="roomInfo">
    Room: <span id="roomCodeDisplay"></span>
</div>

<div id="status">
    Waiting to start...
</div>


<div id="game">

    <div class="players">

        <div class="player-panel"
             id="panel-0">

            <div class="player-name"
                 id="name-0"
                 style="color:#0984e3">
                Blue
            </div>

            <button class="dice disabled"
                    id="dice-0"
                    onclick="roll(0)">
                🎲
            </button>

        </div>

        <div class="player-panel"
             id="panel-1">

            <div class="player-name"
                 id="name-1"
                 style="color:#d63031">
                Red
            </div>

            <button class="dice disabled"
                    id="dice-1"
                    onclick="roll(1)">
                🎲
            </button>

        </div>

        <div class="player-panel"
             id="panel-2">

            <div class="player-name"
                 id="name-2"
                 style="color:#00b894">
                Green
            </div>

            <button class="dice disabled"
                    id="dice-2"
                    onclick="roll(2)">
                🎲
            </button>

        </div>

        <div class="player-panel"
             id="panel-3">

            <div class="player-name"
                 id="name-3"
                 style="color:#ffa502">
                Yellow
            </div>

            <button class="dice disabled"
                    id="dice-3"
                    onclick="roll(3)">
                🎲
            </button>

        </div>

    </div>

    <div id="rollHint"></div>

    <div id="board"
         class="board">

        <div id="pawnLayer"
             class="pawn-layer">
        </div>

    </div>

</div>


<div id="communication">

    <div id="chat"></div>

    <div class="chat-row">

        <input id="chatInput"
               placeholder="Type message..."
               onkeydown="
               if(event.key==='Enter')sendChat()">

        <button onclick="sendChat()">
            Send
        </button>

        <button id="micBtn"
                onclick="toggleMic()">
            🎤
        </button>

    </div>

</div>


<script>

/* =========================================================
   SOCKET
========================================================= */

const socket = io();


/* =========================================================
   GAME CONSTANTS
========================================================= */

const TOTAL = 25;
const HOME = 24;

const playerInfo = [

    {
        id: 0,
        name: "Blue",
        color: "#1e90ff",
        path: [
            10,15,20,21,22,
            23,24,19,14,9,
            4,3,2,1,0,
            5,6,7,8,13,
            18,17,16,11,12
        ]
    },

    {
        id: 1,
        name: "Red",
        color: "#ff4757",
        path: [
            2,1,0,5,10,
            15,20,21,22,23,
            24,19,14,9,4,
            3,8,13,18,17,
            16,11,6,7,12
        ]
    },

    {
        id: 2,
        name: "Green",
        color: "#2ed573",
        path: [
            14,9,4,3,2,
            1,0,5,10,15,
            20,21,22,23,24,
            19,18,17,16,11,
            6,7,8,13,12
        ]
    },

    {
        id: 3,
        name: "Yellow",
        color: "#ffa502",
        path: [
            22,23,24,19,14,
            9,4,3,2,1,
            0,5,10,15,20,
            21,16,11,6,7,
            8,13,18,17,12
        ]
    }

];

const boardArrows = {
    10:"↓",
    22:"→",
    14:"↑",
    2:"←",
    11:"→",
    17:"↑",
    13:"←",
    7:"↓"
};

const safeCells = [
    2,
    10,
    14,
    22,
    12
];


/* =========================================================
   STATE
========================================================= */

let online = false;

let myPlayerId = null;

let players = [];

let activeIndex = 0;

let activeRolls = [];

let canRoll = false;

let soundEnabled = true;

let localBotTimer = null;

let localCurrentRoll = null;

let localRank = 1;

let gameEnded = false;

let voiceStream = null;

let peerConnections = {};


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function initAudio() {

    if (!audioContext) {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioCtx) {
            audioContext = new AudioCtx();
        }
    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {
        audioContext.resume();
    }
}

function playTone(
    frequency,
    duration = .12,
    type = "sine",
    volume = .05
) {

    if (!soundEnabled) return;

    initAudio();

    if (!audioContext) return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + duration
    );
}

function playDiceSound() {

    playTone(220,.08,"square",.04);

    setTimeout(() =>
        playTone(330,.08,"square",.04),
        80
    );

    setTimeout(() =>
        playTone(440,.12,"square",.05),
        160
    );
}

function playMoveSound() {

    playTone(
        500,
        .07,
        "triangle",
        .045
    );
}

function playCaptureSound() {

    playTone(
        180,
        .12,
        "sawtooth",
        .05
    );

    setTimeout(() =>
        playTone(
            90,
            .18,
            "square",
            .04
        ),
        100
    );
}

function playHomeSound() {

    playTone(
        523,
        .12,
        "triangle",
        .05
    );

    setTimeout(() =>
        playTone(
            659,
            .12,
            "triangle",
            .05
        ),
        120
    );

    setTimeout(() =>
        playTone(
            784,
            .2,
            "triangle",
            .06
        ),
        240
    );
}

function playTurnSound() {

    playTone(
        660,
        .12,
        "sine",
        .04
    );

    setTimeout(() =>
        playTone(
            880,
            .15,
            "sine",
            .04
        ),
        120
    );
}

function playWinSound() {

    [
        523,
        659,
        784,
        1046
    ].forEach(
        (note,index) => {

            setTimeout(() => {

                playTone(
                    note,
                    .18,
                    "triangle",
                    .06
                );

            },index*150);
        }
    );
}


/* =========================================================
   EFFECTS
========================================================= */

function showEffect(
    text,
    className
) {

    const effect =
        document.createElement("div");

    effect.className =
        "effect " + className;

    effect.textContent =
        text;

    document.body.appendChild(
        effect
    );

    setTimeout(() => {
        effect.remove();
    },1500);
}


/* =========================================================
   MENU
========================================================= */

function hideMenus() {

    document
        .querySelectorAll(".modal-box")
        .forEach(
            box =>
            box.classList.add("hidden")
        );
}

function showLocalMenu() {

    hideMenus();

    document
        .getElementById("localMenu")
        .classList.remove("hidden");
}

function showOnlineMenu() {

    hideMenus();

    document
        .getElementById("onlineMenu")
        .classList.remove("hidden");
}

function showPrivate() {

    hideMenus();

    document
        .getElementById("privateMenu")
        .classList.remove("hidden");
}

function backMain() {

    hideMenus();

    document
        .getElementById("mainMenu")
        .classList.remove("hidden");
}


/* =========================================================
   SETTINGS / HELP
========================================================= */

function openSettings() {

    document
        .getElementById("settings")
        .classList.remove("hidden");
}

function closeSettings() {

    document
        .getElementById("settings")
        .classList.add("hidden");
}

function toggleSound() {

    soundEnabled =
        !soundEnabled;

    document
        .getElementById("soundBtn")
        .innerText =
        soundEnabled

        playTone(600,.1);

}

function closeHelp() {

        .getElementById("help")

/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    const status =
        document.getElementById("status");

    status.textContent =
        text;

    status.classList.remove(
        "status-pop"
    );

    void status.offsetWidth;

    status.classList.add(
        "status-pop"
    );
}


/* =========================================================
   BOARD
========================================================= */

function createBoard() {

    const board =
        document.getElementById("board");

    board
        .querySelectorAll(".cell")
        .forEach(
            cell => cell.remove()
        );

    for (
        let i=0;
        i<TOTAL;
        i++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "cell";

        if (i === HOME) {

            cell.classList.add(
                "home-cell"
            );

            cell.innerText =
                "HOME";

        } else if (i === 10) {

            cell.classList.add(
                "blue-cell"
            );

        } else if (i === 2) {

            cell.classList.add(
                "red-cell"
            );

        } else if (i === 14) {

            cell.classList.add(
                "green-cell"
            );

        } else if (i === 22) {

            cell.classList.add(
                "yellow-cell"
            );
        }

        if (
            boardArrows[i] &&
            i !== HOME
        ) {

            const arrow =
                document.createElement(
                    "span"
                );

            arrow.textContent =
                boardArrows[i];

            arrow.style.opacity =
                ".3";

            arrow.style.fontSize =
                "24px";

            cell.appendChild(
                arrow
            );
        }

        if (
            i === 10 ||
            i === 2 ||
            i === 14 ||
            i === 22
        ) {

            const marker =
                document.createElement(
                    "span"
                );

            marker.className =
                "start-marker";

            marker.textContent =
                "START";

            cell.appendChild(
                marker
            );
        }

        board.insertBefore(
            cell,
            document.getElementById(
                "pawnLayer"
            )
        );
    }

    const layer =
        document.getElementById(
            "pawnLayer"
        );

    layer.innerHTML = "";

    for (
        let i=0;
        i<TOTAL;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );

        slot.className =
            "pawn-slot";

        slot.id =
            "slot-" + i;

        layer.appendChild(
            slot
        );
    }
}


/* =========================================================
   PLAYER HELPERS
========================================================= */

function getPlayer(
    playerId
) {

    return players.find(
        p => p.id === playerId
    );
}

function getPlayerPath(
    playerId
) {

    return playerInfo[
        playerId
    ].path;
}

function getCell(
    playerId,
    step
) {

    return getPlayerPath(
        playerId
    )[step];
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const layer =
        document.getElementById(
            "pawnLayer"
        );

    if (!layer) return;

    layer
        .querySelectorAll(".pawn")
        .forEach(
            pawn => pawn.remove()
        );

    players.forEach(
        player => {

            player.pawns.forEach(
                (
                    step,
                    pawnIndex
                ) => {

                    const cell =
                        getCell(
                            player.id,
                            step
                        );

                    const slot =
                        document.getElementById(
                            `slot-${cell}`
                        );

                    if (!slot) return;

                    const pawn =
                        document.createElement(
                            "div"
                        );

                    pawn.className =
                        "pawn";

                    pawn.id =
                        `pawn-${player.id}-${pawnIndex}`;

                    pawn.style.background =
                        player.color;

                    pawn.title =
                        `${player.name} Pawn ${pawnIndex+1}`;

                    const isMyTurn =
                        player.id === myPlayerId &&
                        player.id ===
                        players[
                            activeIndex
                        ]?.id;

                    const roll =
                        online
                        ? activeRolls[0]
                        : localCurrentRoll;

                    if (
                        isMyTurn &&
                        canRoll === false &&
                        roll &&
                        isValidPawnMove(
                            player,
                            pawnIndex,
                            roll
                        )
                    ) {

                        pawn.classList.add(
                            "clickable"
                        );

                        pawn.onclick =
                            () =>
                            requestPawnMove(
                                player.id,
                                pawnIndex
                            );
                    }

                    slot.appendChild(
                        pawn
                    );
                }
            );
        }
    );

    updatePanels();
    updateVisibility();
}


/* =========================================================
   PANELS
========================================================= */

function updatePanels() {

    for (
        let i=0;
        i<4;
        i++
    ) {

        const panel =
            document.getElementById(
                `panel-${i}`
            );

        const dice =
            document.getElementById(
                `dice-${i}`
            );

        const name =
            document.getElementById(
                `name-${i}`
            );

        if (!panel) continue;

        panel.classList.remove(
            "active"
        );

        if (dice) {

            dice.classList.add(
                "disabled"
            );
        }

        const player =
            getPlayer(i);

        if (player) {

            if (name) {
                name.textContent =
                    player.name;
            }

            panel.style.display =
                "flex";

        } else {

            panel.style.display =
                "none";
        }
    }

    const current =
        players[activeIndex];

    if (!current) return;

    const panel =
        document.getElementById(
            `panel-${current.id}`
        );

    if (panel) {
        panel.classList.add(
            "active"
        );
    }

    const dice =
        document.getElementById(
            `dice-${current.id}`
        );

    if (
        dice &&
        current.id === myPlayerId &&
        canRoll &&
        !gameEnded
    ) {

        dice.classList.remove(
            "disabled"
        );
    }

    document.getElementById(
        "rollHint"
    ).textContent =
        current.id === myPlayerId
        ? (
            canRoll
            ? "🎲 Your turn — roll the dice"
            : activeRolls.length
                ? "👆 Choose a pawn"
                : ""
        )
        : `${current.name}'s turn`;
}


/* =========================================================
   VISIBILITY
========================================================= */

function updateVisibility() {

    document.getElementById(
        "game"
    ).style.display =
        players.length
        ? "block"
        : "none";

    document.getElementById(
        "communication"
    ).style.display =
        online
        ? "block"
        : "block";
}


/* =========================================================
   MOVE VALIDATION
========================================================= */

function isValidPawnMove(
    player,
    pawnIndex,
    roll
) {

    if (!Number.isFinite(roll)) {
        return false;
    }

    const oldStep =
        player.pawns[pawnIndex];

    const maxStep =
        player.hasKilled
        ? 24
        : 15;

    return (
        oldStep + roll <=
        maxStep
    );
}

function hasValidLocalMove(
    player,
    roll
) {

    return player.pawns.some(
        (
            step
        ) => {

            const maxStep =
                player.hasKilled
                ? 24
                : 15;

            return (
                step + roll <=
                maxStep
            );
        }
    );
}


/* =========================================================
   DICE
========================================================= */

function animateDice(
    playerId,
    value
) {

    const dice =
        document.getElementById(
            `dice-${playerId}`
        );

    if (!dice) return;

    dice.classList.remove(
        "rolling"
    );

    void dice.offsetWidth;

    dice.classList.add(
        "rolling"
    );

    setTimeout(() => {

        dice.textContent =
            diceFace(value);

    },250);

    setTimeout(() => {

        dice.classList.remove(
            "rolling"
        );

    },600);
}

function diceFace(value) {

    const faces = {
        1:"⚀",
        2:"⚁",
        3:"⚂",
        4:"⚃",
        5:"⚄",
        6:"⚅",
        8:"8️⃣"
    };

    return faces[value] || "🎲";
}


/* =========================================================
   ROLL
========================================================= */

function roll(
    playerId
) {

    if (gameEnded) return;

    if (
        playerId !== myPlayerId
    ) {
        setStatus(
            "It is not your turn."
        );
        return;
    }

    if (!canRoll) {
        return;
    }

    initAudio();

    if (online) {

        const dice =
            document.getElementById(
                `dice-${playerId}`
            );

        if (dice) {

            dice.classList.remove(
                "rolling"
            );

            void dice.offsetWidth;

            dice.classList.add(
                "rolling"
            );
        }

        playDiceSound();

        socket.emit(
            "requestRoll"
        );

    } else {

        localRoll(
            playerId
        );
    }
}

   LOCAL GAME
========================================================= */

function startLocal(
    count
) {

    online = false;

    clearTimeout(

    );

            0,

        .map(

                ...p,

            })

            ...playerInfo[2],

        });

/* =========================================================
   LOCAL ROLL
========================================================= */

function localRoll(
    playerId
) {

    const player =
        getPlayer(playerId);

    if (!player) return;

    canRoll = false;

    const values = [
        1,1,
        2,2,
        3,3,
        4,
        8
    ];

    const rollValue =
        values[
            Math.floor(
                Math.random() *
                values.length
            )
        ];

    localCurrentRoll =
        rollValue;

    activeRolls =
        [rollValue];

    animateDice(
        playerId,
        rollValue
    );

    playDiceSound();

    setStatus(
        `${player.name} rolled ${rollValue}.`
    );

    setTimeout(
        () => {

            if (
                !hasValidLocalMove(
                    player,
                    rollValue
                )
            ) {

                localCurrentRoll =
                    null;

                activeRolls = [];

                if (
                    rollValue === 4 ||
                    rollValue === 8
                ) {

                    canRoll = true;

                    setStatus(
                        `${player.name} has no valid move. Extra roll!`
                    );

                    render();

                } else {

                    advanceLocalTurn();
                }

                return;
            }

            render();

            if (
                player.isBot
            ) {

                botChooseMove();

            } else {

                setStatus(
                    `${player.name}: choose a pawn.`
                );
            }

        },
        650
    );
}


/* =========================================================
   LOCAL PAWN MOVE
========================================================= */

function requestPawnMove(
    playerId,
    pawnIndex
) {

    if (gameEnded) return;

    if (
        playerId !== myPlayerId
    ) {
        return;
    }

    if (online) {

        socket.emit(
            "requestMove",
            {
                playerId,
                pawnIndex
            }
        );

        return;
    }

    localMove(
        playerId,
        pawnIndex
    );
}

function localMove(
    playerId,
    pawnIndex
) {

    const player =
        getPlayer(playerId);

    if (!player) return;

    const rollValue =
        localCurrentRoll;

    if (!rollValue) return;

    if (
        !isValidPawnMove(
            player,
            pawnIndex,
            rollValue
        )
    ) {

        setStatus(
            "That pawn cannot move."
        );

        return;
    }

    const oldStep =
        player.pawns[pawnIndex];

    const newStep =
        oldStep + rollValue;

    activeRolls = [];

    localCurrentRoll =
        null;

    player.pawns[pawnIndex] =
        newStep;

    let captured = false;

    let earnedExtra = false;

    const targetCell =
        getCell(
            player.id,
            newStep
        );

    if (
        newStep === HOME
    ) {

        playHomeSound();

        showEffect(
            "🏠 HOME!",
            "home-effect"
        );

        if (
            player.pawns.every(
                p => p === HOME
            )
        ) {

            player.hasWon =
                true;

            player.winRank =
                localRank++;

            earnedExtra = false;

            showEffect(
                `🏆 ${player.name} FINISHED!`,
                "win-effect"
            );

            playWinSound();

            if (
                players.filter(
                    p => !p.hasWon
                ).length <= 1
            ) {

                gameEnded = true;

                render();

                setStatus(
                    "🏆 Game finished!"
                );

                return;
            }

        } else {

            earnedExtra = true;
        }
    }

    if (
        !safeCells.includes(
            targetCell
        )
    ) {

        players.forEach(
            opponent => {

                if (
                    opponent.id ===
                    player.id ||
                    opponent.hasWon
                ) {
                    return;
                }

                opponent.pawns.forEach(
                    (
                        opponentStep,
                        index
                    ) => {

                        if (
                            opponentStep < HOME &&
                            getCell(
                                opponent.id,
                                opponentStep
                            ) === targetCell
                        ) {

                            opponent.pawns[index] =
                                0;

                            player.hasKilled =
                                true;

                            captured = true;

                            earnedExtra =
                                true;
                        }
                    }
                );
            }
        );
    }

    render();

    playMoveSound();

    animatePawnAfterMove(
        player.id,
        pawnIndex,
        newStep,
        captured
    );

    if (captured) {

        playCaptureSound();

        showEffect(
            "💥 CAPTURE!",
            "capture-effect"
        );
    }

    setTimeout(
        () => {

            if (gameEnded) return;

            if (
                player.hasWon
            ) {

                advanceLocalTurn();

            } else if (
                earnedExtra
            ) {

                canRoll = true;

                setStatus(
                    `${player.name} gets another roll!`
                );

                render();

                if (player.isBot) {
                    botRollLater();
                }

            } else {

                advanceLocalTurn();
            }

        },
        450
    );
}


/* =========================================================
   PAWN ANIMATION
========================================================= */

function animatePawnAfterMove(
    playerId,
    pawnIndex,
    newStep,
    captured
) {

    const pawn =
        document.getElementById(
            `pawn-${playerId}-${pawnIndex}`
        );

    if (!pawn) return;

    pawn.classList.remove(
        "moving",
        "capture",
        "home-animation"
    );

    void pawn.offsetWidth;

    if (newStep === HOME) {

        pawn.classList.add(
            "home-animation"
        );

    } else if (captured) {

        pawn.classList.add(
            "capture"
        );

    } else {

        pawn.classList.add(
            "moving"
        );
    }
}


/* =========================================================
   LOCAL TURN
========================================================= */

function advanceLocalTurn() {

    activeRolls = [];

    localCurrentRoll =
        null;

    canRoll = true;

    for (
        let i=1;
        i<=players.length;
        i++
    ) {

        const next =
            (
                activeIndex + i
            ) % players.length;

        if (
            !players[next].hasWon
        ) {

            activeIndex =
                next;

            break;
        }
    }

    const player =
        players[activeIndex];

    if (!player) return;

    setStatus(
        `${player.name}'s turn.`
    );

    render();

    playTurnSound();

    if (
        player.isBot
    ) {

        botRollLater();
    }
}


/* =========================================================
   BOT
========================================================= */

function botRollLater() {

    clearTimeout(
        localBotTimer
    );

    localBotTimer =
        setTimeout(
            () => {

                if (
                    gameEnded ||
                    !players[
                        activeIndex
                    ]?.isBot
                ) {
                    return;
                }

                roll(
                    players[
                        activeIndex
                    ].id
                );

            },
            900
        );
}

function botChooseMove() {

    clearTimeout(
        localBotTimer
    );

    localBotTimer =
        setTimeout(
            () => {

                const bot =
                    players[
                        activeIndex
                    ];

                if (
                    !bot ||
                    !bot.isBot ||
                    !localCurrentRoll
                ) {
                    return;
                }

                const possible = [];

                bot.pawns.forEach(
                    (
                        step,
                        index
                    ) => {

                        if (
                            isValidPawnMove(
                                bot,
                                index,
                                localCurrentRoll
                            )
                        ) {

                            possible.push(
                                index
                            );
                        }
                    }
                );

                if (
                    !possible.length
                ) {
                    advanceLocalTurn();
                    return;
                }

                let selected =
                    possible[0];

                for (
                    const index
                    of possible
                ) {

                    if (
                        bot.pawns[index] +
                        localCurrentRoll ===
                        HOME
                    ) {

                        selected =
                            index;

                        break;
                    }
                }

                localMove(
                    bot.id,
                    selected
                );

            },
            800
        );
}

/* =========================================================
   SERVER STATE
========================================================= */

socket.on(
    "gameState",
    state => {

        if (!online) return;

        const previousActive =
            activeIndex;

        players =
            state.players || [];

        activeIndex =
            Number(
                state.activeIndex || 0
            );

        activeRolls =
            state.activeRolls || [];

        canRoll =
            Boolean(
                state.canRoll
            );

        players.forEach(
            p => {

                p.pawns =
                    Array.isArray(
                        p.pawns
                    )
                    ? p.pawns
                    : [0,0,0,0];

                p.isBot = false;
            }
        );

        if (
            previousActive !==
            activeIndex
        ) {

            playTurnSound();
        }

        render();

        const current =
            players[
                activeIndex
            ];

        if (current) {

            if (
                current.id ===
                myPlayerId
            ) {

                if (canRoll) {

                    setStatus(
                        "🎲 Your turn — roll the dice."
                    );

                } else if (
                    activeRolls.length
                ) {

                    setStatus(
                        `${current.name}: choose a pawn.`
                    );
                }

            } else {

                setStatus(
                    `${current.name}'s turn.`
                );
            }
        }
    }
);

        const pawn =
            document.getElementById(

            void pawn.offsetWidth;

        if (
            data.captured &&
            data.captured.length
        ) {

            playCaptureSound();

            showEffect(
                "💥 CAPTURE!",
                "capture-effect"
            );
        }

        setTimeout(
            () => render(),
            350
        );
    }
);


/* =========================================================
   GAME FINISHED
========================================================= */

socket.on(
    "gameFinished",
    () => {

        gameEnded = true;

        playWinSound();

        showEffect(
            "🏆 GAME FINISHED!",
            "win-effect"
        );

        setStatus(
            "🏆 Game finished!"
        );

        render();
    }
);

/* =========================================================
   CHAT
========================================================= */

function sendChat() {

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    if (online) {

        socket.emit(
            "sendChatMessage",
            {
                text
            }
        );

    } else {

        addChatMessage(
            "You",
            text
        );
    }

    input.value = "";
}

function addChatMessage(
    name,
    text
) {

    const chat =
        document.getElementById(
            "chat"
        );

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "chat-message";

    const nameSpan =
        document.createElement(
            "span"
        );

    nameSpan.className =
        "chat-name";

    nameSpan.textContent =
        name + ": ";

    const textSpan =
        document.createElement(
            "span"
        );

    textSpan.textContent =
        text;

    message.appendChild(
        nameSpan
    );

    message.appendChild(
        textSpan
    );

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}

socket.on(
    "receiveChatMessage",
    data => {

        addChatMessage(
            data.name,
            data.text
        );
    }
);


/* =========================================================
   MICROPHONE / WEBRTC
========================================================= */

async function toggleMic() {

    initAudio();

    const button =
        document.getElementById(
            "micBtn"
        );

    if (
        voiceStream
    ) {

        voiceStream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        voiceStream = null;

        button.classList.remove(
            "active"
        );

        button.textContent =
            "🎤";

        Object.values(
            peerConnections
        ).forEach(
            pc => pc.close()
        );

        peerConnections = {};

        return;
    }

    try {

        voiceStream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });

        button.classList.add(
            "active"
        );

        button.textContent =
            "🔴";

        await startVoiceConnections();

    } catch (error) {

        console.error(error);

        alert(
            "Microphone permission was not granted."
        );
    }
}

async function startVoiceConnections() {

    if (!online) return;

    const otherPlayers =
        players.filter(
            p =>
            p.id !==
            myPlayerId
        );

    for (
        const player
        of otherPlayers
    ) {

        if (
            peerConnections[
                player.id
            ]
        ) {
            continue;
        }

        const pc =
            createPeerConnection(
                player.id
            );

        voiceStream
            .getTracks()
            .forEach(
                track =>
                pc.addTrack(
                    track,
                    voiceStream
                )
            );

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        socket.emit(
            "voiceOffer",
            {
                offer
            }
        );
    }
}

function createPeerConnection(
    remoteId
) {

    const pc =
        new RTCPeerConnection({
            iceServers:[
                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }
            ]
        });

    peerConnections[
        remoteId
    ] = pc;

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                socket.emit(
                    "iceCandidate",
                    {
                        candidate:
                        event.candidate
                    }
                );
            }
        };

    pc.ontrack =
        event => {

            let audio =
                document.getElementById(
                    `remoteAudio-${remoteId}`
                );

            if (!audio) {

                audio =
                    document.createElement(
                        "audio"
                    );

                audio.id =
                    `remoteAudio-${remoteId}`;

                audio.autoplay =
                    true;

                document.body.appendChild(
                    audio
                );
            }

            audio.srcObject =
                event.streams[0];
        };

    return pc;
}

socket.on(
    "voiceOffer",
    async data => {

        if (!voiceStream) {

            try {

                voiceStream =
                    await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio:true
                    });

                document
                    .getElementById(
                        "micBtn"
                    )
                    .classList.add(
                        "active"
                    );

            } catch {

                return;
            }
        }

        const remoteId =
            Number(
                data.from
            );

        let pc =
            peerConnections[
                remoteId
            ];

        if (!pc) {

            pc =
                createPeerConnection(
                    remoteId
                );

            voiceStream
                .getTracks()
                .forEach(
                    track =>
                    pc.addTrack(
                        track,
                        voiceStream
                    )
                );
        }

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.offer
            )
        );

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        socket.emit(
            "voiceAnswer",
            {
                answer
            }
        );
    }
);

socket.on(
    "voiceAnswer",
    async data => {

        const remoteId =
            Number(
                data.from
            );

        const pc =
            peerConnections[
                remoteId
            ];

        if (!pc) return;

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );
    }
);

socket.on(
    "iceCandidate",
    async data => {

        const remoteId =
            Number(
                data.from
            );

        const pc =
            peerConnections[
                remoteId
            ];

        if (!pc) return;

        try {

            await pc.addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

        } catch(error) {

            console.error(
                error
            );
        }
    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (voiceStream) {

            voiceStream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );
        }
    }
);

createBoard();
