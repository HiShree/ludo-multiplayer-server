<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Twist - Enhanced</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  margin:0;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  max-width:420px;
  margin:10px 0;
}

h2{margin:0;text-shadow:2px 2px 4px #0008}

.header-buttons{
  display:flex;
  gap:8px;
}

.action-btn{
  background:#f39c12;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 4px #0005;
}

.settings-btn{background:#34495e}

.setup-btn{
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  background:#1e90ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.secondary-btn{background:#2ecc71}
.purple-btn{background:#9b59b6}
.back-btn{background:#7f8c8d}

.modal-overlay{
  position:fixed;
  inset:0;
  background:#000d;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:100;
}

#local-menu,
#online-menu,
#private-menu,
#help-screen,
#settings-screen{
  display:none;
}

.modal-box{
  background:white;
  color:#333;
  padding:25px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 10px 30px #0008;
  width:80%;
  max-width:340px;
}

.modal-box p{
  text-align:left;
  font-size:14px;
}

#identity-badge{
  background:#2ecc71;
  padding:5px 15px;
  border-radius:15px;
  font-weight:bold;
  font-size:14px;
  display:none;
}

.game-container{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:15px;
  width:100%;
  max-width:420px;
  margin-top:10px;
}

.board{
  grid-column:1/3;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-auto-rows:1fr;
  aspect-ratio:1;
  gap:4px;
  background:#2c3e50;
  padding:6px;
  border-radius:12px;
  box-shadow:0 10px 25px #0007;
  position:relative;
}

.cell{
  background:#ecf0f1;
  border-radius:6px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  box-shadow:inset 0 -3px 0 #0002;
}

.start-blue{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.start-red{background:linear-gradient(135deg,#ff7675,#d63031)}
.start-green{background:linear-gradient(135deg,#55efc4,#00b894)}
.start-yellow{background:linear-gradient(135deg,#ffeaa7,#fdcb6e)}

.home-zone{
  background:linear-gradient(135deg,#9b59b6,#8e44ad);
  color:white;
  font-size:14px;
  font-weight:bold;
}

.board-arrow{
  position:absolute;
  font-size:28px;
  color:#0004;
  font-weight:bold;
  pointer-events:none;
}

.pawn-layer{
  position:absolute;
  inset:6px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  pointer-events:none;
  z-index:20;
}

.pawn-slot{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  align-content:center;
  gap:3px;
  pointer-events:auto;
}

.player-pawn{
  width:18px;
  height:18px;
  border-radius:50%;
  box-shadow:2px 3px 5px #0007;
  border:2px solid white;
  transition:transform .12s ease;
}

.clickable-pawn{
  cursor:pointer;
  box-shadow:0 0 10px 4px #fff;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}

.player-panel{
  display:flex;
  flex-direction:row;
  align-items:center;
  border-radius:6px;
  opacity:.6;
  transition:.2s;
  margin:auto;
  width:fit-content;
  border:3px solid transparent;
}

.active-turn{
  opacity:1;
  border-color:#ffd700;
  transform:scale(1.05);
}

.panel-pawn-side{
  width:44px;
  height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:3px 0 0 3px;
}

#panel-0 .panel-pawn-side{background:#0984e3}
#panel-1 .panel-pawn-side{background:#d63031}
#panel-2 .panel-pawn-side{background:#00b894}
#panel-3 .panel-pawn-side{background:#fdcb6e}

.panel-pawn-icon{
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid white;
}

#panel-0 .panel-pawn-icon{background:#0984e3}
#panel-1 .panel-pawn-icon{background:#d63031}
#panel-2 .panel-pawn-icon{background:#00b894}
#panel-3 .panel-pawn-icon{background:#ffa502}

.ludo-dice{
  width:44px;
  height:44px;
  background:white;
  color:#111;
  border-radius:0 3px 3px 0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:27px;
  font-weight:900;
  cursor:pointer;
  user-select:none;
}

.dice-disabled{
  cursor:not-allowed;
  pointer-events:none;
  opacity:.7;
}

#status{
  font-size:15px;
  font-weight:bold;
  margin:8px 0;
  text-align:center;
  min-height:22px;
  background:#ffffffeF;
  padding:6px 12px;
  border-radius:20px;
  color:#333;
  display:none;
  width:100%;
  max-width:390px;
}

.comm-dock{
  display:none;
  width:100%;
  max-width:420px;
  margin-top:10px;
  background:#0005;
  border-radius:10px;
  padding:8px;
}

.chat-box{
  height:70px;
  overflow-y:auto;
  background:#ffffff1a;
  border-radius:6px;
  padding:5px;
  font-size:12px;
  margin-bottom:6px;
}

.chat-input-row{
  display:flex;
  gap:5px;
}

.chat-input-row input{
  flex:1;
  padding:7px;
  border-radius:4px;
  border:0;
}

.chat-input-row button{
  padding:6px 10px;
  border:0;
  background:#e67e22;
  color:white;
  border-radius:4px;
  font-weight:bold;
}

.mic-btn-active{
  background:#c0392b!important;
  animation:pulse 1s infinite;
}
</style>
</head>

<body>

<div id="setup-screen" class="modal-overlay">

  <div class="modal-box" id="main-menu">
    <h1>Ludo Twist</h1>
    <button class="setup-btn" onclick="showLocalMenu()">Play Local (Offline)</button>
    <button class="setup-btn secondary-btn" onclick="showOnlineMenu()">Play Online Multiplayer</button>
  </div>

  <div class="modal-box" id="local-menu">
    <h2>Local Mode</h2>
    <button class="setup-btn" onclick="startLocalGame(1)">1 Player (vs Bot)</button>
    <button class="setup-btn" onclick="startLocalGame(2)">2 Players</button>
    <button class="setup-btn" onclick="startLocalGame(3)">3 Players</button>
    <button class="setup-btn" onclick="startLocalGame(4)">4 Players</button>
    <button class="setup-btn back-btn" onclick="backToMain()">Back</button>
  </div>

  <div class="modal-box" id="online-menu">
    <h2>Online Multiplayer</h2>
    <button class="setup-btn secondary-btn" onclick="startOnlineGame(2)">Public 2-Player</button>
    <button class="setup-btn secondary-btn" onclick="startOnlineGame(3)">Public 3-Player</button>
    <button class="setup-btn secondary-btn" onclick="startOnlineGame(4)">Public 4-Player</button>
    <button class="setup-btn purple-btn" onclick="showPrivateMenu()">Private Room</button>
    <button class="setup-btn back-btn" onclick="backToMain()">Back</button>
  </div>

  <div class="modal-box" id="private-menu">
    <h2>Private Room</h2>

    <div style="display:flex;gap:5px">
      <button class="setup-btn secondary-btn" onclick="createPrivateGame(2)">Create 2P</button>
      <button class="setup-btn secondary-btn" onclick="createPrivateGame(3)">Create 3P</button>
      <button class="setup-btn secondary-btn" onclick="createPrivateGame(4)">Create 4P</button>
    </div>

    <p style="text-align:center"><b>— OR —</b></p>

    <input
      id="room-code-input"
      placeholder="Enter Room Code"
      style="width:100%;padding:10px;text-align:center;text-transform:uppercase"
    >

    <button class="setup-btn purple-btn" onclick="joinPrivateGame()">Join Room</button>
    <button class="setup-btn back-btn" onclick="showOnlineMenu()">Back</button>
  </div>

</div>

<div id="settings-screen" class="modal-overlay">
  <div class="modal-box">
    <h2>Settings</h2>
    <button id="sound-toggle-btn" class="setup-btn" onclick="toggleSound()">
      🔊 Sound: ON
    </button>
    <button class="setup-btn" style="background:#e74c3c" onclick="toggleSettings()">
      Close
    </button>
  </div>
</div>

<div id="help-screen" class="modal-overlay">
  <div class="modal-box">
    <h2>How to Play</h2>
    <p>🎲 Roll a 1, 2, 3, 4 or 8.</p>
    <p>⭐ Rolling 4 or 8 gives an extra turn.</p>
    <p>🏠 Get all four pawns HOME to win.</p>
    <p>💥 Capturing an opponent gives an extra turn.</p>

    <button class="setup-btn" style="background:#e74c3c" onclick="toggleHelp()">
      Close
    </button>
  </div>
</div>

<div class="header-row">
  <h2>Ludo Twist</h2>

  <div id="identity-badge"></div>

  <div class="header-buttons">
    <button class="action-btn settings-btn" onclick="toggleSettings()">⚙️</button>
    <button class="action-btn" onclick="toggleHelp()">❓</button>
  </div>
</div>

<div id="status"></div>

<div class="game-container" id="game-container">

  <div class="player-panel" id="panel-1">
    <div class="panel-pawn-side">
      <div class="panel-pawn-icon"></div>
    </div>
    <div class="ludo-dice dice-disabled" id="dice-1" onclick="requestRoll(1)">🎲</div>
  </div>

  <div class="player-panel" id="panel-2">
    <div class="panel-pawn-side">
      <div class="panel-pawn-icon"></div>
    </div>
    <div class="ludo-dice dice-disabled" id="dice-2" onclick="requestRoll(2)">🎲</div>
  </div>

  <div class="board" id="board">
    <div class="pawn-layer" id="pawn-layer"></div>
  </div>

  <div class="player-panel active-turn" id="panel-0">
    <div class="panel-pawn-side">
      <div class="panel-pawn-icon"></div>
    </div>
    <div class="ludo-dice dice-disabled" id="dice-0" onclick="requestRoll(0)">🎲</div>
  </div>

  <div class="player-panel" id="panel-3">
    <div class="panel-pawn-side">
      <div class="panel-pawn-icon"></div>
    </div>
    <div class="ludo-dice dice-disabled" id="dice-3" onclick="requestRoll(3)">🎲</div>
  </div>

</div>

<div class="comm-dock" id="comm-dock">

  <div class="chat-box" id="chat-messages"></div>

  <div class="chat-input-row">
    <input
      id="chat-input"
      placeholder="Type message..."
      onkeydown="if(event.key==='Enter')sendChatMessage()"
    >

    <button onclick="sendChatMessage()">Send</button>

    <button id="mic-btn" onclick="toggleMicrophone()">
      🎤 Mic
    </button>
  </div>

</div>

<script>

const socket = io();

let isOnlineMode = false;
let myPlayerId = null;

let activePlayers = [];
let activePlayerIndex = 0;

let activeRolls = [];
let canRoll = true;
let isAnimating = false;

let currentRank = 1;

let audioCtx = null;
let isSoundEnabled = true;

let mediaRecorder = null;
let isMicActive = false;
let micAudioCtx = null;


/* =========================
   PLAYER DATA
========================= */

const allPlayers = [

  {
    id:0,
    name:"Blue",
    color:"#1e90ff",
    hasWon:false,
    winRank:0,
    hasKilled:false,
    isBot:false,
    pawns:[0,0,0,0],
    path:[
      10,15,20,21,22,23,24,
      19,14,9,4,3,2,1,0,
      5,6,7,8,13,18,17,16,11,12
    ]
  },

  {
    id:1,
    name:"Red",
    color:"#ff4757",
    hasWon:false,
    winRank:0,
    hasKilled:false,
    isBot:false,
    pawns:[0,0,0,0],
    path:[
      2,1,0,5,10,15,20,21,22,23,24,
      19,14,9,4,3,8,13,18,17,16,11,6,7,12
    ]
  },

  {
    id:2,
    name:"Green",
    color:"#2ed573",
    hasWon:false,
    winRank:0,
    hasKilled:false,
    isBot:false,
    pawns:[0,0,0,0],
    path:[
      14,9,4,3,2,1,0,5,10,15,20,21,22,23,24,
      19,18,17,16,11,6,7,8,13,12
    ]
  },

  {
    id:3,
    name:"Yellow",
    color:"#ffa502",
    hasWon:false,
    winRank:0,
    hasKilled:false,
    isBot:false,
    pawns:[0,0,0,0],
    path:[
      22,23,24,19,14,9,4,3,2,1,0,5,10,15,20,21,
      16,11,6,7,8,13,18,17,12
    ]
  }

];

const totalSpaces = 25;
const centerSpace = 12;

const boardArrows = {
  10:'↓',
  22:'→',
  14:'↑',
  2:'←',
  11:'→',
  17:'↑',
  13:'←',
  7:'↓'
};


/* =========================
   MENUS
========================= */

function showLocalMenu(){

  document.getElementById('main-menu').style.display='none';
  document.getElementById('local-menu').style.display='block';

}

function showOnlineMenu(){

  document.getElementById('main-menu').style.display='none';
  document.getElementById('local-menu').style.display='none';
  document.getElementById('private-menu').style.display='none';
  document.getElementById('online-menu').style.display='block';

}

function showPrivateMenu(){

  document.getElementById('online-menu').style.display='none';
  document.getElementById('private-menu').style.display='block';

}

function backToMain(){

  document.getElementById('local-menu').style.display='none';
  document.getElementById('online-menu').style.display='none';
  document.getElementById('private-menu').style.display='none';
  document.getElementById('main-menu').style.display='block';

}


/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new(window.AudioContext || window.webkitAudioContext)();

  }

  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }

}


/*
  IMPORTANT:
  This sound is deliberately shorter than
  the pawn step interval.

  Pawn:
  MOVE -> RENDER -> SOUND -> WAIT -> NEXT MOVE
*/

function playPawnStepSound(){

  if(!isSoundEnabled) return;

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type='sine';

  osc.frequency.setValueAtTime(420,now);
  osc.frequency.exponentialRampToValueAtTime(
    650,
    now + 0.045
  );

  gain.gain.setValueAtTime(0.0001,now);

  gain.gain.exponentialRampToValueAtTime(
    0.18,
    now + 0.008
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.085
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.09);

}


function playCaptureSound(){

  if(!isSoundEnabled) return;

  initAudio();

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type='square';

  osc.frequency.setValueAtTime(180,now);
  osc.frequency.exponentialRampToValueAtTime(
    80,
    now+0.18
  );

  gain.gain.setValueAtTime(0.15,now);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now+0.18
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.18);

}


function playHomeSound(){

  if(!isSoundEnabled) return;

  initAudio();

  const now=audioCtx.currentTime;

  [520,660,820].forEach((freq,i)=>{

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type='triangle';
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(0.001,now+i*.12);
    gain.gain.exponentialRampToValueAtTime(
      0.18,
      now+i*.12+0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now+i*.12+0.12
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now+i*.12);
    osc.stop(now+i*.12+0.13);

  });

}


function toggleSound(){

  isSoundEnabled=!isSoundEnabled;

  document.getElementById('sound-toggle-btn').innerText =
    isSoundEnabled
      ? '🔊 Sound: ON'
      : '🔇 Sound: OFF';

}


/* =========================
   SETTINGS / HELP
========================= */

function toggleSettings(){

  const el=document.getElementById('settings-screen');

  el.style.display =
    el.style.display==='flex'
      ? 'none'
      : 'flex';

}

function toggleHelp(){

  const el=document.getElementById('help-screen');

  el.style.display =
    el.style.display==='flex'
      ? 'none'
      : 'flex';

}


/* =========================
   LOCAL GAME
========================= */

function startLocalGame(numPlayers){

  initAudio();

  isOnlineMode=false;
  myPlayerId=0;

  document.getElementById('setup-screen').style.display='none';
  document.getElementById('game-container').style.display='grid';
  document.getElementById('status').style.display='block';
  document.getElementById('comm-dock').style.display='block';

  let copy=JSON.parse(JSON.stringify(allPlayers));

  if(numPlayers===1){

    activePlayers=[
      copy[0],
      Object.assign(copy[2],{
        isBot:true,
        name:'Green (Bot)'
      })
    ];

  }else{

    activePlayers=copy.slice(0,numPlayers);

  }

  document.getElementById('identity-badge').style.display='block';

  document.getElementById('identity-badge').innerText=
    'You are Blue';

  resetGameState();

  updatePanelVisibility();

  initBoardStaticStructure();
  renderBoard();
  processTurnState();

}


/* =========================
   ONLINE GAME
========================= */

function startOnlineGame(numPlayers){

  initAudio();

  isOnlineMode=true;

  document.getElementById('setup-screen').style.display='none';
  document.getElementById('status').style.display='block';

  socket.emit('joinGame',numPlayers);

}


function createPrivateGame(numPlayers){

  initAudio();

  isOnlineMode=true;

  document.getElementById('setup-screen').style.display='none';
  document.getElementById('status').style.display='block';

  socket.emit(
    'createPrivateGame',
    numPlayers
  );

}


function joinPrivateGame(){

  const code=
    document.getElementById('room-code-input')
    .value
    .trim()
    .toUpperCase();

  if(!code){

    alert('Enter room code!');
    return;

  }

  initAudio();

  isOnlineMode=true;

  document.getElementById('setup-screen').style.display='none';
  document.getElementById('status').style.display='block';

  socket.emit(
    'joinPrivateGame',
    code
  );

}


/* =========================
   RESET
========================= */

function resetGameState(){

  activePlayerIndex=0;
  activeRolls=[];
  canRoll=true;
  isAnimating=false;
  currentRank=1;

  activePlayers.forEach(p=>{

    p.hasWon=false;
    p.winRank=0;
    p.hasKilled=false;
    p.pawns=[0,0,0,0];

  });

}


/* =========================
   BOARD
========================= */

function updatePanelVisibility(){

  for(let i=0;i<4;i++){

    const panel=
      document.getElementById(`panel-${i}`);

    const player=
      activePlayers.find(p=>p.id===i);

    panel.style.visibility=
      player ? 'visible':'hidden';

  }

}


function initBoardStaticStructure(){

  const board=
    document.getElementById('board');

  board.querySelectorAll('.cell')
    .forEach(c=>c.remove());

  for(let i=0;i<25;i++){

    const cell=
      document.createElement('div');

    cell.className='cell';

    if(i===centerSpace){

      cell.classList.add('home-zone');
      cell.innerText='HOME';

    }else if(i===10){

      cell.classList.add('start-blue');

    }else if(i===2){

      cell.classList.add('start-red');

    }else if(i===14){

      cell.classList.add('start-green');

    }else if(i===22){

      cell.classList.add('start-yellow');

    }

    if(boardArrows[i] && i!==centerSpace){

      const arrow=
        document.createElement('div');

      arrow.className='board-arrow';
      arrow.innerText=boardArrows[i];

      cell.appendChild(arrow);

    }

    board.insertBefore(
      cell,
      document.getElementById('pawn-layer')
    );

  }

  const layer=
    document.getElementById('pawn-layer');

  layer.innerHTML='';

  for(let i=0;i<25;i++){

    const slot=
      document.createElement('div');

    slot.className='pawn-slot';
    slot.id=`pawn-slot-${i}`;

    layer.appendChild(slot);

  }

}


/* =========================
   RENDER PAWNS
========================= */

function renderBoard(){

  if(!document.getElementById('pawn-slot-0')){

    initBoardStaticStructure();

  }

  for(let i=0;i<25;i++){

    const slot=
      document.getElementById(`pawn-slot-${i}`);

    if(slot) slot.innerHTML='';

  }

  if(activePlayers.length===0) return;

  const currentPlayer=
    activePlayers[activePlayerIndex];

  activePlayers.forEach(player=>{

    player.pawns.forEach((pawnStep,pawnIndex)=>{

      const gridIdx=
        player.path[pawnStep];

      const slot=
        document.getElementById(
          `pawn-slot-${gridIdx}`
        );

      if(!slot) return;

      const pawn=
        document.createElement('div');

      pawn.className='player-pawn';

      pawn.style.backgroundColor=
        player.color;

      const isCurrent=
        currentPlayer &&
        player.id===currentPlayer.id;

      const isMine=
        isOnlineMode
          ? player.id===myPlayerId
          : !player.isBot;

      const hasRoll=
        activeRolls.length>0;

      const nextStep=
        pawnStep+
        (activeRolls[0]||0);

      const maxStep=
        player.hasKilled ? 24 : 15;

      if(
        isCurrent &&
        isMine &&
        hasRoll &&
        !isAnimating &&
        nextStep<=maxStep
      ){

        pawn.classList.add('clickable-pawn');

        pawn.onclick=()=>{

          if(isAnimating) return;

          if(isOnlineMode){

            requestMove(
              player.id,
              pawnIndex
            );

          }else{

            handleIncomingMove(
              player.id,
              pawnIndex
            );

          }

        };

      }

      slot.appendChild(pawn);

    });

  });

  updateUI();

}


/* =========================
   UI
========================= */

function updateUI(){

  if(activePlayers.length===0) return;

  const current=
    activePlayers[activePlayerIndex];

  if(!current) return;

  const status=
    document.getElementById('status');

  if(!isAnimating){

    status.style.color=
      current.color;

  }

  for(let i=0;i<4;i++){

    const dice=
      document.getElementById(`dice-${i}`);

    const panel=
      document.getElementById(`panel-${i}`);

    const player=
      activePlayers.find(p=>p.id===i);

    if(!player) continue;

    if(player.hasWon){

      panel.classList.remove('active-turn');
      dice.classList.add('dice-disabled');

      dice.innerText=
        player.winRank===1
          ? '🥇'
          : '👑';

      continue;

    }

    if(current.id===i){

      panel.classList.add('active-turn');

      const mine=
        isOnlineMode
          ? current.id===myPlayerId
          : !current.isBot;

      if(
        isAnimating ||
        !canRoll ||
        !mine
      ){

        dice.classList.add('dice-disabled');

      }else{

        dice.classList.remove('dice-disabled');

      }

    }else{

      panel.classList.remove('active-turn');
      dice.classList.add('dice-disabled');

    }

  }

}


/* =========================
   DICE
========================= */

function requestRoll(playerId){

  if(activePlayers.length===0) return;

  const current=
    activePlayers[activePlayerIndex];

  const mine=
    isOnlineMode
      ? playerId===myPlayerId
      : !current.isBot;

  if(
    !mine ||
    playerId!==current.id ||
    isAnimating ||
    !canRoll
  ) return;

  canRoll=false;

  updateUI();

  const roll=
    [1,1,2,2,3,3,4,8]
    [Math.floor(Math.random()*8)];

  if(isOnlineMode){

    socket.emit(
      'requestRoll',
      {
        playerId,
        rollValue:roll
      }
    );

  }else{

    handleIncomingRoll(
      playerId,
      roll
    );

  }

}


function handleIncomingRoll(playerId,rollValue){

  if(activePlayers.length===0) return;

  const current=
    activePlayers[activePlayerIndex];

  if(
    !current ||
    playerId!==current.id
  ) return;

  initAudio();

  const dice=
    document.getElementById(
      `dice-${playerId}`
    );

  dice.innerText=rollValue;

  activeRolls.push(rollValue);

  /*
    4 or 8 = another roll.
    1/2/3 = must move.
  */

  if(
    rollValue===4 ||
    rollValue===8
  ){

    canRoll=true;

  }else{

    canRoll=false;

  }

  processTurnState();

  broadcastSyncState();

}


/* =========================
   TURN PROCESSING
========================= */

function processTurnState(customMessage=null){

  if(activePlayers.length===0) return;

  const player=
    activePlayers[activePlayerIndex];

  while(activeRolls.length>0){

    const roll=
      activeRolls[0];

    const valid=
      player.pawns.some(
        p=>
          p+roll<=
          (player.hasKilled ? 24:15)
      );

    if(valid) break;

    activeRolls.shift();

    customMessage=
      (customMessage
        ? customMessage+' '
        :'')+
      `${roll} blocked.`;

  }

  if(
    activeRolls.length===0 &&
    !canRoll
  ){

    document.getElementById('status')
      .innerText=
      customMessage ||
      'No moves left. Turn over!';

    isAnimating=true;

    updateUI();

    setTimeout(()=>{

      if(
        !isOnlineMode ||
        activePlayers[activePlayerIndex].id===
        myPlayerId
      ){

        advanceToNextPlayer();

      }

    },900);

    return;

  }

  renderBoard();

  let message=
    customMessage
      ? customMessage+' '
      :'';

  if(activeRolls.length>0){

    message+=
      `[Rolls: ${activeRolls.join(', ')}] `;

    const mine=
      isOnlineMode
        ? player.id===myPlayerId
        : !player.isBot;

    message+=
      canRoll
        ? mine
          ? 'Roll again or move!'
          : 'Waiting...'
        : mine
          ? 'Tap a glowing pawn.'
          : 'Moving...';

  }else if(canRoll){

    const mine=
      isOnlineMode
        ? player.id===myPlayerId
        : !player.isBot;

    message=
      mine
        ? 'Your Turn! Roll.'
        : `${player.name}'s turn...`;

  }

  document.getElementById('status')
    .innerText=message;


  /* BOT */

  if(
    !isOnlineMode &&
    player.isBot &&
    !isAnimating
  ){

    if(canRoll){

      setTimeout(()=>{

        if(
          activePlayers[activePlayerIndex]===player &&
          canRoll &&
          !isAnimating
        ){

          handleIncomingRoll(
            player.id,
            [1,1,2,2,3,3,4,8]
            [Math.floor(Math.random()*8)]
          );

        }

      },650);

    }else if(activeRolls.length>0){

      const roll=
        activeRolls[0];

      const valid=[];

      player.pawns.forEach(
        (p,i)=>{

          if(
            p+roll<=
            (player.hasKilled ? 24:15)
          ){

            valid.push(i);

          }

        }
      );

      if(valid.length){

        setTimeout(()=>{

          if(
            activePlayers[activePlayerIndex]===player &&
            !isAnimating
          ){

            const index=
              valid[
                Math.floor(
                  Math.random()*valid.length
                )
              ];

            handleIncomingMove(
              player.id,
              index
            );

          }

        },650);

      }

    }

  }

}


/* =========================
   NEXT PLAYER
========================= */

function advanceToNextPlayer(){

  activeRolls=[];
  canRoll=true;
  isAnimating=false;

  if(activePlayers.length===0) return;

  let attempts=0;

  do{

    activePlayerIndex=
      (activePlayerIndex+1)%
      activePlayers.length;

    attempts++;

  }while(
    activePlayers[activePlayerIndex].hasWon &&
    attempts<=activePlayers.length
  );

  for(let i=0;i<4;i++){

    const dice=
      document.getElementById(`dice-${i}`);

    const p=
      activePlayers.find(
        pl=>pl.id===i
      );

    if(
      dice &&
      p &&
      !p.hasWon
    ){

      dice.innerText='🎲';

    }

  }

  processTurnState();

  broadcastSyncState();

}


/* =========================
   MOVE REQUEST
========================= */

function requestMove(playerId,pawnIndex){

  if(!isOnlineMode) return;

  socket.emit(
    'requestMove',
    {
      playerId,
      pawnIndex
    }
  );

}


/* =========================
   PAWN MOVEMENT
========================= */

function handleIncomingMove(playerId,pawnIndex){

  if(activePlayers.length===0) return;

  const player=
    activePlayers.find(
      p=>p.id===playerId
    );

  if(!player) return;

  const current=
    activePlayers[activePlayerIndex];

  if(
    !current ||
    current.id!==playerId ||
    activeRolls.length===0 ||
    isAnimating
  ) return;

  const roll=
    activeRolls.shift();

  const maxStep=
    player.hasKilled ? 24:15;

  if(
    player.pawns[pawnIndex]+roll>
    maxStep
  ){

    activeRolls.unshift(roll);

    return;

  }

  isAnimating=true;
  updateUI();

  let stepsTaken=0;

  /*
    SYNCHRONIZED MOVEMENT LOOP

    Every cycle:

    1. Increase pawn position
    2. Render pawn
    3. Play sound
    4. Wait 180ms
    5. Repeat
  */

  function hop(){

    if(
      stepsTaken<roll &&
      player.pawns[pawnIndex]<24
    ){

      player.pawns[pawnIndex]++;
      stepsTaken++;

      renderBoard();

      // Sound is triggered at EXACTLY
      // the same moment as visual movement.
      playPawnStepSound();

      setTimeout(
        hop,
        180
      );

    }else{

      finishMove();

    }

  }


  function finishMove(){

    const finalCell=
      player.path[
        player.pawns[pawnIndex]
      ];

    let extraTurn=false;
    let endMessage=null;


    /* HOME */

    if(
      player.pawns[pawnIndex]===24
    ){

      playHomeSound();

      if(
        player.pawns.every(
          p=>p===24
        )
      ){

        player.hasWon=true;
        player.winRank=currentRank++;

        isAnimating=false;

        renderBoard();

        setTimeout(()=>{

          if(
            !isOnlineMode ||
            activePlayers[activePlayerIndex].id===
            myPlayerId
          ){

            advanceToNextPlayer();

          }

        },1000);

        return;

      }else{

        extraTurn=true;
        endMessage=
          'Pawn Home! Extra Turn!';

      }

    }


    /* CAPTURE */

    let captured=[];

    if(
      ![2,10,14,22,12]
      .includes(finalCell)
    ){

      activePlayers.forEach(opp=>{

        if(
          opp.id!==playerId &&
          !opp.hasWon
        ){

          opp.pawns.forEach(
            (step,index)=>{

              if(
                opp.path[step]===finalCell &&
                step<24
              ){

                captured.push({
                  player:opp,
                  pawnIdx:index
                });

              }

            }
          );

        }

      });

    }


    if(captured.length>0){

      extraTurn=true;
      player.hasKilled=true;

      playCaptureSound();

      const target=
        captured[0];

      function sendPawnBack(){

        if(
          target.player.pawns[
            target.pawnIdx
          ]>0
        ){

          target.player.pawns[
            target.pawnIdx
          ]--;

          renderBoard();

          playPawnStepSound();

          setTimeout(
            sendPawnBack,
            120
          );

        }else{

          isAnimating=false;

          if(
            extraTurn &&
            activeRolls.length===0
          ){

            canRoll=true;

          }

          processTurnState(
            'Captured! Extra Turn!'
          );

          broadcastSyncState();

        }

      }

      sendPawnBack();

    }else{

      isAnimating=false;

      if(
        extraTurn &&
        activeRolls.length===0
      ){

        canRoll=true;

      }

      processTurnState(
        endMessage
      );

      broadcastSyncState();

    }

  }

  hop();

}


/* =========================
   SERVER SYNC
========================= */

function broadcastSyncState(){

  if(!isOnlineMode) return;

  socket.emit(
    'syncState',
    {
      activeIndex:activePlayerIndex,
      activeRolls:activeRolls,
      canRoll:canRoll,

      players:activePlayers.map(
        p=>({
          id:p.id,
          pawns:p.pawns,
          hasKilled:p.hasKilled,
          hasWon:p.hasWon,
          winRank:p.winRank
        })
      )

    }
  );

}


/* =========================
   CHAT
========================= */

function sendChatMessage(){

  const input=
    document.getElementById(
      'chat-input'
    );

  const text=
    input.value.trim();

  if(!text) return;

  const player=
    allPlayers.find(
      p=>p.id===myPlayerId
    );

  const name=
    player
      ? player.name
      : 'Player';

  if(isOnlineMode){

    socket.emit(
      'sendChatMessage',
      {
        name,
        text
      }
    );

  }else{

    appendChatMsg(
      name,
      text
    );

  }

  input.value='';

}


function appendChatMsg(name,text){

  const box=
    document.getElementById(
      'chat-messages'
    );

  const div=
    document.createElement('div');

  const bold=
    document.createElement('b');

  bold.textContent=name+': ';

  div.appendChild(bold);
  div.appendChild(
    document.createTextNode(text)
  );

  box.appendChild(div);

  box.scrollTop=
    box.scrollHeight;

}


/* =========================
   MICROPHONE
========================= */

async function toggleMicrophone(){

  const btn=
    document.getElementById(
      'mic-btn'
    );

  if(!isMicActive){

    try{

      if(!navigator.mediaDevices ||
         !navigator.mediaDevices.getUserMedia){

        alert(
          'Microphone is not supported by this browser.'
        );

        return;

      }

      const stream=
        await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });

      mediaRecorder=
        new MediaRecorder(stream);

      mediaRecorder.ondataavailable=
        async event=>{

          if(
            event.data.size>0 &&
            isOnlineMode
          ){

            const buffer=
              await event.data.arrayBuffer();

            socket.emit(
              'voiceData',
              buffer
            );

          }

        };

      mediaRecorder.start(100);

      isMicActive=true;

      btn.classList.add(
        'mic-btn-active'
      );

      btn.innerText='🔴 Live';

    }catch(error){

      alert(
        'Microphone permission was blocked or unavailable.'
      );

    }

  }else{

    if(mediaRecorder){

      mediaRecorder.stop();

      if(mediaRecorder.stream){

        mediaRecorder.stream
          .getTracks()
          .forEach(track=>track.stop());

      }

    }

    isMicActive=false;

    btn.classList.remove(
      'mic-btn-active'
    );

    btn.innerText='🎤 Mic';

  }

}


/* =========================
   SOCKET EVENTS
========================= */

socket.on(
  'assignPlayer',
  id=>{

    myPlayerId=id;

    const player=
      allPlayers.find(
        p=>p.id===id
      );

    document.getElementById(
      'identity-badge'
    ).style.display='block';

    document.getElementById(
      'identity-badge'
    ).innerText=
      `You are ${player ? player.name:'Player'}`;

    document.getElementById(
      'status'
    ).style.display='block';

    document.getElementById(
      'comm-dock'
    ).style.display='block';

  }
);


socket.on(
  'systemMessage',
  msg=>{

    document.getElementById(
      'status'
    ).innerText=msg;

  }
);


socket.on(
  'privateRoomCreated',
  code=>{

    document.getElementById(
      'status'
    ).innerText=
      `Room Code: ${code}`;

  }
);


socket.on(
  'roomError',
  msg=>{

    alert(msg);

    document.getElementById(
      'setup-screen'
    ).style.display='flex';

  }
);


socket.on(
  'gameStart',
  ids=>{

    const copies=
      JSON.parse(
        JSON.stringify(allPlayers)
      );

    activePlayers=
      copies.filter(
        p=>ids.includes(p.id)
      );

    activePlayers.forEach(p=>{
      p.isBot=false;
    });

    activePlayerIndex=0;
    currentRank=1;
    activeRolls=[];
    canRoll=true;
    isAnimating=false;

    updatePanelVisibility();

    document.getElementById(
      'game-container'
    ).style.display='grid';

    document.getElementById(
      'status'
    ).style.display='block';

    document.getElementById(
      'comm-dock'
    ).style.display='block';

    initBoardStaticStructure();
    renderBoard();
    processTurnState();

  }
);


socket.on(
  'executeRoll',
  data=>{

    if(isOnlineMode){

      handleIncomingRoll(
        data.playerId,
        data.rollValue
      );

    }

  }
);


socket.on(
  'executeMove',
  data=>{

    if(isOnlineMode){

      handleIncomingMove(
        data.playerId,
        data.pawnIndex
      );

    }

  }
);


socket.on(
  'forceSync',
  state=>{

    if(!isOnlineMode) return;

    activePlayerIndex=
      state.activeIndex;

    activeRolls=
      state.activeRolls || [];

    canRoll=
      state.canRoll;

    if(state.players){

      state.players.forEach(serverPlayer=>{

        const local=
          activePlayers.find(
            p=>p.id===serverPlayer.id
          );

        if(local){

          local.pawns=
            serverPlayer.pawns;

          local.hasKilled=
            serverPlayer.hasKilled;

          local.hasWon=
            serverPlayer.hasWon;

          local.winRank=
            serverPlayer.winRank || 0;

        }

      });

    }

    isAnimating=false;

    renderBoard();
    processTurnState();

  }
);


socket.on(
  'receiveChatMessage',
  data=>{

    appendChatMsg(
      data.name,
      data.text
    );

  }
);


socket.on(
  'voiceData',
  async buffer=>{

    try{

      if(!micAudioCtx){

        micAudioCtx=
          new(
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if(
        micAudioCtx.state===
        'suspended'
      ){

        await micAudioCtx.resume();

      }

      const decoded=
        await micAudioCtx.decodeAudioData(
          buffer.slice(0)
        );

      const source=
        micAudioCtx.createBufferSource();

      source.buffer=decoded;

      source.connect(
        micAudioCtx.destination
      );

      source.start();

    }catch(error){

      console.log(
        'Voice playback error',
        error
      );

    }

  }
);

</script>
