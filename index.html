<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Ludo Twist</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(135deg,#1e3c72,#2a5298);
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

.header {
    width: 100%;
    max-width: 460px;
    margin: 8px auto;
    display: flex;
    align-items: center;
    gap: 8px;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    flex: 1;
}

.header button {
    width: 50px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    font-size: 22px;
    background: #34495e;
    color: white;
    box-shadow: 0 4px 8px #0005;
}

#identity {
    background: #2ecc71;
    padding: 10px 15px;
    border-radius: 25px;
    font-weight: bold;
    display: none;
    white-space: nowrap;
}

#status {
    width: 100%;
    max-width: 460px;
    margin: 8px auto;
    padding: 9px;
    border-radius: 22px;
    background: white;
    color: #333;
    text-align: center;
    font-weight: bold;
    min-height: 38px;
}

#game {
    width: 100%;
    max-width: 460px;
    margin: auto;
    display: none;
}

.players {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
}

.player {
    display: flex;
    align-items: center;
    border: 3px solid transparent;
    border-radius: 9px;
    opacity: .55;
    transition: .2s;
}

.player.active {
    opacity: 1;
    border-color: #ffd700;
    transform: scale(1.05);
    box-shadow: 0 0 15px #ffd700;
}

.player-name {
    padding: 8px;
    font-weight: bold;
}

.dice {
    width: 52px;
    height: 52px;
    border: 0;
    background: white;
    color: #111;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

.dice:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.board {
    width: 100%;
    aspect-ratio: 1;
    position: relative;
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);
    gap: 4px;
    background: #263746;
    border-radius: 15px;
    box-shadow: 0 10px 30px #0007;
}

.cell {
    background: #ecf0f1;
    border-radius: 7px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #555;
    font-size: 24px;
}

.blue {
    background: linear-gradient(135deg,#74b9ff,#0984e3);
}

.red {
    background: linear-gradient(135deg,#ff7675,#d63031);
}

.green {
    background: linear-gradient(135deg,#55efc4,#00b894);
}

.yellow {
    background: linear-gradient(135deg,#ffeaa7,#fdcb6e);
}

.home {
    background: linear-gradient(135deg,#9b59b6,#8e44ad);
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.arrow {
    opacity: .35;
}

.pawn-layer {
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    bottom: 6px;

    display: grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);

    gap: 4px;
    pointer-events: none;
    z-index: 10;
}

.pawn-slot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    align-content: center;
    gap: 3px;
    pointer-events: none;
}

.pawn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow:
        0 3px 7px #0009,
        inset 0 2px 2px #fff8;
    pointer-events: auto;
    transition:
        transform .12s,
        box-shadow .12s;
}

.pawn.movable {
    animation: glow .8s infinite;
    cursor: pointer;
}

@keyframes glow {

    0%,100% {
        transform: scale(1);
        box-shadow: 0 0 4px white;
    }

    50% {
        transform: scale(1.25);
        box-shadow:
            0 0 13px 5px white;
    }
}

.moving {
    animation: hop .18s ease;
}

@keyframes hop {

    0% {
        transform: scale(.7);
    }

    50% {
        transform: scale(1.3);
    }

    100% {
        transform: scale(1);
    }
}

.communication {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: #203d69;
    border-radius: 13px;
    box-shadow: 0 5px 15px #0004;
}

.chat {
    height: 100px;
    overflow-y: auto;
    padding: 7px;
    background: #ffffff12;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 8px;
}

.chat div {
    margin: 4px 0;
}

.chat-row {
    display: flex;
    gap: 5px;
}

.chat-row input {
    flex: 1;
    min-width: 0;
    padding: 11px;
    border: 0;
    border-radius: 7px;
    font-size: 14px;
}

.chat-row button {
    border: 0;
    border-radius: 7px;
    padding: 0 13px;
    background: #e67e22;
    color: white;
    font-weight: bold;
}

.mic-on {
    background: #c0392b !important;
    animation: glow .8s infinite;
}

.overlay {
    position: fixed;
    inset: 0;
    background: #000d;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
}

.menu {
    width: 88%;
    max-width: 360px;
    background: white;
    color: #333;
    padding: 22px;
    border-radius: 16px;
    text-align: center;
}

.menu h1,
.menu h2 {
    margin-top: 0;
}

.menu button {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 0;
    border-radius: 9px;
    background: #1e90ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.menu .greenBtn {
    background: #2ecc71;
}

.menu .purple {
    background: #9b59b6;
}

.menu .gray {
    background: #7f8c8d;
}

.menu input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    text-align: center;
    font-weight: bold;
    text-transform: uppercase;
}

.hidden {
    display: none !important;
}

#roomCode {
    font-size: 22px;
    font-weight: bold;
    margin: 10px;
    letter-spacing: 3px;
}

</style>
</head>

<body>

<!-- MAIN MENU -->

<div id="menuOverlay" class="overlay">

    <div id="mainMenu" class="menu">

        <h1>🎲 Ludo Twist</h1>

        <button onclick="showLocal()">
            Play Local
        </button>

        <button class="greenBtn" onclick="showOnline()">
            Play Online
        </button>

    </div>

    <div id="localMenu" class="menu hidden">

        <h2>Local Game</h2>

        <button onclick="startLocal(1)">
            1 Player vs Bot
        </button>

        <button onclick="startLocal(2)">
            2 Players
        </button>

        <button onclick="startLocal(3)">
            3 Players
        </button>

        <button onclick="startLocal(4)">
            4 Players
        </button>

        <button class="gray" onclick="backMain()">
            Back
        </button>

    </div>

    <div id="onlineMenu" class="menu hidden">

        <h2>Online Game</h2>

        <button class="greenBtn"
                onclick="startOnline(2)">
            Public 2 Player
        </button>

        <button class="greenBtn"
                onclick="startOnline(3)">
            Public 3 Player
        </button>

        <button class="greenBtn"
                onclick="startOnline(4)">
            Public 4 Player
        </button>

        <button class="purple"
                onclick="showPrivate()">
            Private Room
        </button>

        <button class="gray"
                onclick="backMain()">
            Back
        </button>

    </div>

    <div id="privateMenu" class="menu hidden">

        <h2>Private Room</h2>

        <button class="greenBtn"
                onclick="createPrivate(2)">
            Create 2 Player
        </button>

        <button class="greenBtn"
                onclick="createPrivate(3)">
            Create 3 Player
        </button>

        <button class="greenBtn"
                onclick="createPrivate(4)">
            Create 4 Player
        </button>

        <hr>

        <input id="roomInput"
               placeholder="ROOM CODE">

        <button class="purple"
                onclick="joinPrivate()">
            Join Room
        </button>

        <button class="gray"
                onclick="showOnline()">
            Back
        </button>

    </div>

</div>


<!-- HEADER -->

<div class="header">

    <div class="logo">
        🎲 Ludo Twist
    </div>

    <div id="identity"></div>

    <button onclick="toggleSettings()">
        ⚙️
    </button>

    <button onclick="toggleHelp()">
        ❓
    </button>

</div>

<div id="status">
    Choose a game mode.
</div>


<!-- GAME -->

<div id="game">

    <div id="players" class="players"></div>

    <div id="board" class="board">

        <!-- cells generated by JS -->

        <div id="pawnLayer"
             class="pawn-layer"></div>

    </div>

    <div id="communication"
         class="communication">

        <div id="chat"
             class="chat"></div>

        <div class="chat-row">

            <input id="chatInput"
                   placeholder="Type message..."
                   onkeydown="
                   if(event.key==='Enter')
                   sendChat()
                   ">

            <button onclick="sendChat()">
                Send
            </button>

            <button id="micButton"
                    onclick="toggleMic()">
                🎤
            </button>

        </div>

    </div>

</div>


<!-- SETTINGS -->

<div id="settingsOverlay"
     class="overlay hidden">

    <div class="menu">

        <h2>Settings</h2>

        <button onclick="toggleSound()"
                id="soundButton">
            🔊 Sound ON
        </button>

        <button class="gray"
                onclick="toggleSettings()">
            Close
        </button>

    </div>

</div>


<!-- HELP -->

<div id="helpOverlay"
     class="overlay hidden">

    <div class="menu">

        <h2>How to Play</h2>

        <p>
            Roll the dice when it is your turn.
        </p>

        <p>
            Select a glowing pawn to move it.
        </p>

        <p>
            A roll of 4 or 8 gives an extra turn.
        </p>

        <p>
            Capturing an opponent also gives
            an extra turn.
        </p>

        <button class="gray"
                onclick="toggleHelp()">
            Close
        </button>

    </div>

</div>


<script>

const socket = io();

/* -----------------------------
   CONSTANTS
----------------------------- */

const PATHS = [

[10,15,20,21,22,23,24,19,14,9,4,3,2,1,0,5,6,7,8,13,18,17,16,11,12],

[2,1,0,5,10,15,20,21,22,23,24,19,14,9,4,3,8,13,18,17,16,11,6,7,12],

[14,9,4,3,2,1,0,5,10,15,20,21,22,23,24,19,18,17,16,11,6,7,8,13,12],

[22,23,24,19,14,9,4,3,2,1,0,5,10,15,20,21,16,11,6,7,8,13,18,17,12]

];

const COLORS = [
    "#1e90ff",
    "#ff4757",
    "#2ed573",
    "#ffa502"
];

const NAMES = [
    "Blue",
    "Red",
    "Green",
    "Yellow"
];

const SAFE = [
    2,10,14,22,12
];

let online = false;
let myId = null;

let players = [];
let activeIndex = 0;

let currentRoll = null;
let canRoll = false;
let moving = false;

let soundEnabled = true;
let audioContext = null;

let botTimer = null;
let gameToken = 0;


/* -----------------------------
   MENU
----------------------------- */

function hideMenus() {

    document
        .querySelectorAll(".menu")
        .forEach(x => x.classList.add("hidden"));
}

function showLocal() {

    hideMenus();

    document
        .getElementById("localMenu")
        .classList.remove("hidden");
}

function showOnline() {

    hideMenus();

    document
        .getElementById("onlineMenu")
        .classList.remove("hidden");
}

function showPrivate() {

    hideMenus();

    document
        .getElementById("privateMenu")
        .classList.remove("hidden");
}

function backMain() {

    hideMenus();

    document
        .getElementById("mainMenu")
        .classList.remove("hidden");
}


/* -----------------------------
   AUDIO
----------------------------- */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function playStepSound() {

    if (!soundEnabled) return;

    initAudio();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(
        220,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        520,
        audioContext.currentTime + .07
    );

    gain.gain.setValueAtTime(
        .18,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .12
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + .13
    );
}

function playDiceSound() {

    if (!soundEnabled) return;

    initAudio();

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "square";

    osc.frequency.value = 500;

    gain.gain.value = .08;

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    setTimeout(() => {

        osc.frequency.value = 800;

    }, 70);

    osc.stop(
        audioContext.currentTime + .14
    );
}

function toggleSound() {

    soundEnabled = !soundEnabled;

    document.getElementById("soundButton").innerText =
        soundEnabled
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";
}


/* -----------------------------
   START LOCAL
----------------------------- */

function startLocal(count) {

    initAudio();

    online = false;

    document
        .getElementById("menuOverlay")
        .classList.add("hidden");

    document
        .getElementById("game")
        .style.display = "block";

    document
        .getElementById("communication")
        .style.display = "block";

    players = [];

    for (let i = 0; i < count; i++) {

        players.push({
            id: i,
            name: NAMES[i] +
                (count === 1 && i === 1
                    ? " (Bot)"
                    : ""),
            color: COLORS[i],
            pawns: [0,0,0,0],
            hasWon: false,
            winRank: 0,
            isBot:
                count === 1 && i === 1
        });

    }

    myId = 0;

    activeIndex = 0;
    currentRoll = null;
    canRoll = true;
    moving = false;

    document.getElementById("identity").style.display =
        "block";

    document.getElementById("identity").innerText =
        "You are Blue";

    createBoard();

    renderPlayers();

    renderPawns();

    updateGameUI();

    startGameMessage();

    gameToken++;

    scheduleBot();

}


/* -----------------------------
   ONLINE
----------------------------- */

function startOnline(count) {

    initAudio();

    online = true;

    document
        .getElementById("menuOverlay")
        .classList.add("hidden");

    document
        .getElementById("game")
        .style.display = "block";

    document.getElementById("communication")
        .style.display = "block";

    socket.emit("joinGame", count);

    setStatus("Searching for players...");
}

function createPrivate(count) {

    initAudio();

    online = true;

    document
        .getElementById("menuOverlay")
        .classList.add("hidden");

    document
        .getElementById("game")
        .style.display = "block";

    socket.emit(
        "createPrivateGame",
        count
    );

    setStatus("Creating private room...");
}

function joinPrivate() {

    const code =
        document
        .getElementById("roomInput")
        .value
        .trim()
        .toUpperCase();

    if (!code) {

        alert("Enter room code.");

        return;
    }

    initAudio();

    online = true;

    document
        .getElementById("menuOverlay")
        .classList.add("hidden");

    document
        .getElementById("game")
        .style.display = "block";

    socket.emit(
        "joinPrivateGame",
        code
    );

    setStatus("Joining room...");
}


/* -----------------------------
   SERVER EVENTS
----------------------------- */

socket.on("assignPlayer", id => {

    myId = id;

    document
        .getElementById("identity")
        .style.display = "block";

    document
        .getElementById("identity")
        .innerText =
        "You are " + NAMES[id];

});

socket.on("gameStart", ids => {

    players = ids.map(id => ({
        id,
        name: NAMES[id],
        color: COLORS[id],
        pawns: [0,0,0,0],
        hasWon: false,
        winRank: 0,
        isBot: false
    }));

    createBoard();

    renderPlayers();

    renderPawns();

    setStatus("Match started! Blue goes first.");

});

socket.on("gameState", state => {

    if (!online) return;

    activeIndex = state.activeIndex;

    currentRoll = state.roll;

    canRoll = state.canRoll;

    moving = state.moving;

    players = state.players;

    renderPlayers();

    renderPawns();

    updateGameUI();

});

socket.on("diceRolled", data => {

    currentRoll = data.value;

    playDiceSound();

    updateGameUI();

});

socket.on("systemMessage", msg => {

    setStatus(msg);

});

socket.on("privateRoomCreated", code => {

    setStatus("Room created.");

    document.getElementById("status").innerHTML =
        `Room Code: <b>${code}</b>`;

});


socket.on("roomError", msg => {

    alert(msg);

    document
        .getElementById("menuOverlay")
        .classList.remove("hidden");

    backMain();

});


/* -----------------------------
   BOARD
----------------------------- */

function createBoard() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    const arrows = {
        10:"↓",
        22:"→",
        14:"↑",
        2:"←",
        11:"→",
        17:"↑",
        13:"←",
        7:"↓"
    };

    for (let i = 0; i < 25; i++) {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        if (i === 12) {

            cell.classList.add("home");

            cell.innerText = "HOME";

        }

        else if (i === 10) {

            cell.classList.add("blue");

        }

        else if (i === 2) {

            cell.classList.add("red");

        }

        else if (i === 14) {

            cell.classList.add("green");

        }

        else if (i === 22) {

            cell.classList.add("yellow");

        }

        if (arrows[i] && i !== 12) {

            cell.innerText =
                arrows[i];

            cell.classList.add("arrow");

        }

        board.appendChild(cell);

    }

    const layer =
        document.createElement("div");

    layer.id = "pawnLayer";

    layer.className = "pawn-layer";

    board.appendChild(layer);

}


/* -----------------------------
   PLAYERS
----------------------------- */

function renderPlayers() {

    const container =
        document.getElementById("players");

    container.innerHTML = "";

    players.forEach((p,index) => {

        const box =
            document.createElement("div");

        box.className = "player";

        if (index === activeIndex) {
            box.classList.add("active");
        }

        box.style.background =
            p.color;

        const name =
            document.createElement("div");

        name.className = "player-name";

        name.innerText =
            p.name +
            (p.hasWon ? " 🏆" : "");

        const dice =
            document.createElement("button");

        dice.className = "dice";

        dice.id =
            "dice-" + p.id;

        dice.innerText =
            currentRoll &&
            index === activeIndex
                ? currentRoll
                : "🎲";

        dice.disabled =
            online
            ? !(
                p.id === myId &&
                index === activeIndex &&
                canRoll &&
                !moving
              )
            : !(
                index === activeIndex &&
                canRoll &&
                !moving &&
                !p.isBot
              );

        dice.onclick = () =>
            rollDice();

        box.appendChild(name);

        box.appendChild(dice);

        container.appendChild(box);

    });

}


/* -----------------------------
   PAWNS
----------------------------- */

function renderPawns() {

    const layer =
        document.getElementById("pawnLayer");

    if (!layer) return;

    layer.innerHTML = "";

    for (let i = 0; i < 25; i++) {

        const slot =
            document.createElement("div");

        slot.className = "pawn-slot";

        slot.id =
            "slot-" + i;

        layer.appendChild(slot);

    }

    players.forEach(player => {

        player.pawns.forEach(
            (step,pawnIndex) => {

                const cell =
                    PATHS[player.id][step];

                const slot =
                    document.getElementById(
                        "slot-" + cell
                    );

                if (!slot) return;

                const pawn =
                    document.createElement("div");

                pawn.className = "pawn";

                pawn.style.background =
                    player.color;

                const isCurrent =
                    players[activeIndex] &&
                    players[activeIndex].id ===
                    player.id;

                let movable = false;

                if (
                    isCurrent &&
                    currentRoll &&
                    !moving
                ) {

                    if (
                        step + currentRoll <= 24
                    ) {

                        if (
                            online
                            ? player.id === myId
                            : !player.isBot
                        ) {

                            movable = true;

                        }

                    }

                }

                if (movable) {

                    pawn.classList.add("movable");

                    pawn.onclick = e => {

                        e.stopPropagation();

                        movePawn(
                            player.id,
                            pawnIndex
                        );

                    };

                }

                slot.appendChild(pawn);

            }
        );

    });

}


/* -----------------------------
   ROLL
----------------------------- */

function rollDice() {

    if (moving) return;

    const player =
        players[activeIndex];

    if (!player) return;

    if (online) {

        if (
            player.id !== myId ||
            !canRoll
        ) return;

        canRoll = false;

        updateGameUI();

        socket.emit("requestRoll");

        return;
    }

    if (player.isBot) return;

    if (!canRoll) return;

    canRoll = false;

    const roll =
        [1,1,2,2,3,3,4,8]
        [Math.floor(Math.random()*8)];

    handleLocalRoll(
        player.id,
        roll
    );

}


/* -----------------------------
   LOCAL ROLL
----------------------------- */

function handleLocalRoll(
    playerId,
    roll
) {

    currentRoll = roll;

    playDiceSound();

    const player =
        players[activeIndex];

    if (
        player.id !== playerId
    ) return;

    const valid =
        player.pawns.some(
            p => p + roll <= 24
        );

    renderPlayers();

    renderPawns();

    if (!valid) {

        setStatus(
            `${player.name} rolled ${roll}, but cannot move.`
        );

        if (
            roll === 4 ||
            roll === 8
        ) {

            currentRoll = null;

            canRoll = true;

            setStatus(
                `${player.name} gets another roll!`
            );

            updateGameUI();

            scheduleBot();

        } else {

            setTimeout(
                nextLocalPlayer,
                900
            );

        }

        return;
    }

    canRoll = false;

    setStatus(
        `${player.name} rolled ${roll}.`
    );

    updateGameUI();

    scheduleBot();

}


/* -----------------------------
   MOVE
----------------------------- */

function movePawn(
    playerId,
    pawnIndex
) {

    if (moving) return;

    const player =
        players[activeIndex];

    if (!player) return;

    if (player.id !== playerId) return;

    if (!currentRoll) return;

    if (
        player.pawns[pawnIndex] +
        currentRoll > 24
    ) return;

    moving = true;

    updateGameUI();

    if (online) {

        socket.emit(
            "requestMove",
            {
                playerId,
                pawnIndex
            }
        );

    } else {

        animateLocalPawn(
            playerId,
            pawnIndex,
            currentRoll
        );

    }

}


/* -----------------------------
   LOCAL ANIMATION
----------------------------- */

function animateLocalPawn(
    playerId,
    pawnIndex,
    steps
) {

    const token =
        ++gameToken;

    let done = 0;

    const player =
        players.find(
            p => p.id === playerId
        );

    if (!player) return;

    function stepMove() {

        if (token !== gameToken) return;

        if (done >= steps) {

            finishLocalMove(
                playerId,
                pawnIndex
            );

            return;
        }

        player.pawns[pawnIndex]++;

        done++;

        playStepSound();

        renderPawns();

        updateGameUI();

        setTimeout(
            stepMove,
            180
        );

    }

    stepMove();

}


/* -----------------------------
   ONLINE PAWN STEP
----------------------------- */

socket.on("pawnStep", data => {

    const player =
        players.find(
            p => p.id === data.playerId
        );

    if (!player) return;

    player.pawns[data.pawnIndex] =
        data.step;

    playStepSound();

    renderPawns();

});


socket.on("pawnCaptured", data => {

    const victim =
        players.find(
            p => p.id === data.victimId
        );

    if (!victim) return;

    victim.pawns[data.victimPawn] = 0;

    renderPawns();

});


/* -----------------------------
   LOCAL MOVE FINISH
----------------------------- */

function finishLocalMove(
    playerId,
    pawnIndex
) {

    const player =
        players.find(
            p => p.id === playerId
        );

    if (!player) return;

    const finalStep =
        player.pawns[pawnIndex];

    const finalCell =
        PATHS[player.id][finalStep];

    let extra = false;

    // HOME
    if (finalStep === 24) {

        extra = true;

        setStatus(
            `${player.name} reached HOME! Extra turn!`
        );

    }

    // CAPTURE
    if (
        !SAFE.includes(finalCell) &&
        finalStep < 24
    ) {

        players.forEach(opponent => {

            if (
                opponent.id === player.id ||
                opponent.hasWon
            ) return;

            opponent.pawns.forEach(
                (oppStep,oppIndex) => {

                    if (
                        oppStep < 24 &&
                        PATHS[opponent.id][oppStep]
                        === finalCell
                    ) {

                        opponent.pawns[oppIndex] = 0;

                        player.hasKilled = true;

                        extra = true;

                        setStatus(
                            `${player.name} captured ${opponent.name}! Extra turn!`
                        );

                    }

                }
            );

        });

    }

    // WIN
    if (
        player.pawns.every(
            p => p === 24
        )
    ) {

        player.hasWon = true;

        player.winRank =
            players.filter(
                p => p.hasWon
            ).length + 1;

        extra = false;

        setStatus(
            `${player.name} finished all pawns! 🏆`
        );

    }

    currentRoll = null;

    moving = false;

    if (player.hasWon) {

        setTimeout(
            nextLocalPlayer,
            1000
        );

        return;

    }

    if (extra) {

        canRoll = true;

        updateGameUI();

        scheduleBot();

    } else {

        setTimeout(
            nextLocalPlayer,
            700
        );

    }

}


/* -----------------------------
   NEXT LOCAL PLAYER
----------------------------- */

function nextLocalPlayer() {

    gameToken++;

    currentRoll = null;

    canRoll = true;

    moving = false;

    let attempts = 0;

    do {

        activeIndex =
            (activeIndex + 1)
            % players.length;

        attempts++;

    } while (
        players[activeIndex].hasWon &&
        attempts < players.length + 1
    );

    if (
        players.every(
            p => p.hasWon
        )
    ) {

        setStatus("Game finished!");

        canRoll = false;

        updateGameUI();

        return;

    }

    const player =
        players[activeIndex];

    setStatus(
        `${player.name}'s turn.`
    );

    updateGameUI();

    scheduleBot();

}


/* -----------------------------
   BOT
----------------------------- */

function scheduleBot() {

    if (online) return;

    clearTimeout(botTimer);

    const player =
        players[activeIndex];

    if (!player || !player.isBot) return;

    const token =
        gameToken;

    botTimer =
        setTimeout(() => {

            if (token !== gameToken) return;

            if (
                activeIndex >= players.length
            ) return;

            if (
                players[activeIndex].id !==
                player.id
            ) return;

            if (moving) {

                scheduleBot();

                return;
            }

            if (canRoll) {

                const roll =
                    [1,1,2,2,3,3,4,8]
                    [Math.floor(Math.random()*8)];

                canRoll = false;

                handleLocalRoll(
                    player.id,
                    roll
                );

                return;

            }

            if (currentRoll) {

                const valid = [];

                player.pawns.forEach(
                    (step,index) => {

                        if (
                            step +
                            currentRoll <= 24
                        ) {

                            valid.push(index);

                        }

                    }
                );

                if (valid.length === 0) {

                    nextLocalPlayer();

                    return;

                }

                const pawn =
                    valid[
                        Math.floor(
                            Math.random() *
                            valid.length
                        )
                    ];

                movePawn(
                    player.id,
                    pawn
                );

            }

        }, 700);

}


/* -----------------------------
   UI
----------------------------- */

function updateGameUI() {

    renderPlayers();

    renderPawns();

    const current =
        players[activeIndex];

    if (!current) return;

    if (current.id === myId && online) {

        if (canRoll) {

            setStatus(
                "Your turn! Roll the dice."
            );

        }

    }

    if (!online && !current.isBot) {

        if (canRoll) {

            setStatus(
                `${current.name}'s turn. Roll the dice.`
            );

        }

    }

}

function setStatus(text) {

    document.getElementById(
        "status"
    ).innerText = text;

}

function startGameMessage() {

    setStatus(
        "Blue goes first."
    );

}


/* -----------------------------
   CHAT
----------------------------- */

function sendChat() {

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    if (online) {

        socket.emit(
            "sendChatMessage",
            { text }
        );

    } else {

        addChat(
            "You",
            text
        );

    }

    input.value = "";

}

socket.on(
    "receiveChatMessage",
    data => {

        addChat(
            data.name,
            data.text
        );

    }
);

function addChat(
    name,
    text
) {

    const box =
        document.getElementById(
            "chat"
        );

    const row =
        document.createElement("div");

    const bold =
        document.createElement("b");

    bold.innerText =
        name + ": ";

    row.appendChild(bold);

    row.appendChild(
        document.createTextNode(text)
    );

    box.appendChild(row);

    box.scrollTop =
        box.scrollHeight;

}


/* -----------------------------
   WEBRTC MICROPHONE
----------------------------- */

let localStream = null;

const voicePeers = {};

async function toggleMic() {

    if (localStream) {

        stopMic();

        return;

    }

    try {

        initAudio();

        localStream =
            await navigator.mediaDevices
            .getUserMedia({
                audio: true,
                video: false
            });

        document
            .getElementById("micButton")
            .classList.add("mic-on");

        document
            .getElementById("micButton")
            .innerText =
            "🔴";

        if (online) {

            await startVoiceConnections();

        } else {

            addChat(
                "System",
                "Microphone works only in online multiplayer."
            );

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Microphone permission was denied or unavailable. Allow microphone access for this site and try again."
        );

    }

}

function stopMic() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }

    localStream = null;

    Object.keys(voicePeers)
        .forEach(id => {

            try {
                voicePeers[id].close();
            } catch(e) {}

            delete voicePeers[id];

        });

    document
        .getElementById("micButton")
        .classList.remove("mic-on");

    document
        .getElementById("micButton")
        .innerText =
        "🎤";

    if (online) {

        socket.emit(
            "voiceStop"
        );

    }

}

async function startVoiceConnections() {

    // Ask the other players to create connections
    socket.emit(
        "voiceOffer",
        {
            offer: null
        }
    );

}


/*
   Receiver of voice offer.
*/

socket.on(
    "voiceOffer",
    async data => {

        if (!localStream) return;

        const pc =
            new RTCPeerConnection({
                iceServers: [
                    {
                        urls:
                        "stun:stun.l.google.com:19302"
                    }
                ]
            });

        voicePeers[data.from] = pc;

        localStream
            .getTracks()
            .forEach(
                track =>
                    pc.addTrack(
                        track,
                        localStream
                    )
            );

        pc.ontrack = event => {

            playRemoteAudio(
                event.streams[0]
            );

        };

        pc.onicecandidate =
            event => {

                if (
                    event.candidate
                ) {

                    socket.emit(
                        "voiceCandidate",
                        {
                            to: data.from,
                            candidate:
                                event.candidate
                        }
                    );

                }

            };

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );

        socket.emit(
            "voiceAnswer",
            {
                to: data.from,
                answer: pc.localDescription
            }
        );

    }
);


/*
   Answer receiver.
*/

socket.on(
    "voiceAnswer",
    async data => {

        // This simple mesh connection
        // is created when another peer
        // sends an offer.
        //
        // If no peer exists yet,
        // create one.

        if (!localStream) return;

        let pc =
            voicePeers[data.from];

        if (!pc) {

            pc =
                new RTCPeerConnection({
                    iceServers: [
                        {
                            urls:
                            "stun:stun.l.google.com:19302"
                        }
                    ]
                });

            voicePeers[data.from] = pc;

            localStream
                .getTracks()
                .forEach(
                    track =>
                        pc.addTrack(
                            track,
                            localStream
                        )
                );

            pc.ontrack = event => {

                playRemoteAudio(
                    event.streams[0]
                );

            };

            pc.onicecandidate =
                event => {

                    if (
                        event.candidate
                    ) {

                        socket.emit(
                            "voiceCandidate",
                            {
                                to: data.from,
                                candidate:
                                    event.candidate
                            }
                        );

                    }

                };

        }

        try {

            await pc.setRemoteDescription(
                data.answer
            );

        } catch(e) {

            console.log(e);

        }

    }
);


/*
   ICE candidate.
*/

socket.on(
    "voiceCandidate",
    async data => {

        const pc =
            voicePeers[data.from];

        if (!pc) return;

        try {

            await pc.addIceCandidate(
                data.candidate
            );

        } catch(e) {

            console.log(e);

        }

    }
);


socket.on(
    "voiceStop",
    data => {

        if (
            voicePeers[data.from]
        ) {

            voicePeers[data.from].close();

            delete voicePeers[data.from];

        }

    }
);


function playRemoteAudio(
    stream
) {

    const audio =
        document.createElement("audio");

    audio.autoplay = true;

    audio.srcObject = stream;

    document.body.appendChild(
        audio
    );

}


/* -----------------------------
   HELP / SETTINGS
----------------------------- */

function toggleSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.toggle("hidden");

}

function toggleHelp() {

    document
        .getElementById(
            "helpOverlay"
        )
        .classList.toggle("hidden");

}
