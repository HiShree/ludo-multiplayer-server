<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ludo Twist</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;font-family:Arial,"Segoe UI",sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;min-height:100vh}
button{font-family:inherit}
.header{width:100%;max-width:430px;margin:8px auto;display:flex;align-items:center;justify-content:space-between}
.header h2{margin:0}.header-buttons{display:flex;gap:6px}
.action-btn{border:0;border-radius:20px;padding:8px 12px;color:#fff;background:#34495e;font-weight:bold}
.modal{position:fixed;inset:0;z-index:1000;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.86)}
.modal-box{width:88%;max-width:340px;background:#fff;color:#222;padding:22px;border-radius:16px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.modal-box h1,.modal-box h2{margin-top:0}
.menu-btn{width:100%;border:0;margin:7px 0;padding:13px;border-radius:9px;color:#fff;font-size:16px;font-weight:bold;background:#1e90ff}
.green{background:#2ecc71}.purple{background:#9b59b6}.gray{background:#7f8c8d}.red{background:#e74c3c}
input{width:100%;padding:12px;border-radius:7px;border:1px solid #ccc;font-size:16px;text-align:center;text-transform:uppercase}
.hidden{display:none!important}
#status{width:100%;max-width:430px;min-height:30px;margin:8px auto;padding:7px 12px;background:rgba(255,255,255,.95);color:#222;border-radius:20px;text-align:center;font-weight:bold}
#identity{display:none;width:fit-content;margin:5px auto;padding:5px 15px;border-radius:20px;background:#2ecc71;font-weight:bold}
#game{display:none;width:100%;max-width:430px;margin:auto}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.player-panel{display:flex;align-items:center;justify-content:center;border:3px solid transparent;border-radius:9px;opacity:.55;transition:.2s}
.player-panel.active{opacity:1;border-color:#ffd700;transform:scale(1.03)}
.player-name{padding:8px;font-weight:bold;font-size:13px}
.dice{width:54px;height:44px;border:0;border-radius:7px;background:#fff;color:#111;font-size:22px;font-weight:900;cursor:pointer}
.dice.disabled{opacity:.4;pointer-events:none}
.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;aspect-ratio:1;padding:6px;background:#263746;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.cell{position:relative;display:flex;justify-content:center;align-items:center;border-radius:6px;background:#ecf0f1;color:#333;font-size:11px;font-weight:bold}
.blue{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.red-cell{background:linear-gradient(135deg,#ff7675,#d63031)}
.green-cell{background:linear-gradient(135deg,#55efc4,#00b894)}
.yellow{background:linear-gradient(135deg,#ffeaa7,#fdcb6e)}
.home{background:linear-gradient(135deg,#9b59b6,#8e44ad);color:#fff}
.pawn-layer{position:absolute;inset:6px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:4px;pointer-events:none;z-index:10}
.pawn-slot{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px;pointer-events:none;min-width:0}
.pawn{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:2px 3px 5px rgba(0,0,0,.45);pointer-events:auto;transition:transform .15s;position:relative}
.pawn.clickable{cursor:pointer;animation:pawnPulse 1s infinite;box-shadow:0 0 10px 4px #fff}
.pawn.moving{z-index:50;transform:scale(1.25)}
@keyframes pawnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
#communication{display:none;width:100%;max-width:430px;margin:10px auto;padding:8px;border-radius:10px;background:rgba(0,0,0,.3)}
#chat{height:80px;overflow-y:auto;padding:6px;margin-bottom:6px;background:rgba(255,255,255,.1);border-radius:6px;font-size:12px}
.chat-row{display:flex;gap:5px}.chat-row input{flex:1;text-align:left;text-transform:none;padding:8px;font-size:13px}
.chat-row button{border:0;border-radius:5px;padding:7px 10px;color:#fff;background:#e67e22;font-weight:bold}
#micBtn{background:#34495e}#micBtn.active{background:#c0392b;animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 15px;border-radius:20px;z-index:2000;display:none}
.win-list{margin:8px 0;text-align:left}
</style>
</head>
<body>

<div id="setup" class="modal">
  <div id="mainMenu" class="modal-box">
    <h1>🎲 Ludo Twist</h1>
    <button class="menu-btn" onclick="showLocalMenu()">Play Local</button>
    <button class="menu-btn green" onclick="showOnlineMenu()">Play Online</button>
  </div>
  <div id="localMenu" class="modal-box hidden">
    <h2>Local Game</h2>
    <button class="menu-btn" onclick="startLocal(1)">1 Player vs Bot</button>
    <button class="menu-btn" onclick="startLocal(2)">2 Players</button>
    <button class="menu-btn" onclick="startLocal(3)">3 Players</button>
    <button class="menu-btn" onclick="startLocal(4)">4 Players</button>
    <button class="menu-btn gray" onclick="backMain()">Back</button>
  </div>
  <div id="onlineMenu" class="modal-box hidden">
    <h2>Online Multiplayer</h2>
    <button class="menu-btn green" onclick="startOnline(2)">Public 2 Players</button>
    <button class="menu-btn green" onclick="startOnline(3)">Public 3 Players</button>
    <button class="menu-btn green" onclick="startOnline(4)">Public 4 Players</button>
    <hr>
    <button class="menu-btn purple" onclick="showPrivate()">Private Room</button>
    <button class="menu-btn gray" onclick="backMain()">Back</button>
  </div>
  <div id="privateMenu" class="modal-box hidden">
    <h2>Private Room</h2>
    <button class="menu-btn green" onclick="createPrivate(2)">Create 2 Player Room</button>
    <button class="menu-btn green" onclick="createPrivate(3)">Create 3 Player Room</button>
    <button class="menu-btn green" onclick="createPrivate(4)">Create 4 Player Room</button>
    <p>OR</p>
    <input id="roomCode" placeholder="ROOM CODE">
    <button class="menu-btn purple" onclick="joinPrivate()">Join Room</button>
    <button class="menu-btn gray" onclick="showOnlineMenu()">Back</button>
  </div>
</div>

<div id="settings" class="modal hidden">
  <div class="modal-box">
    <h2>Settings</h2>
    <button id="soundBtn" class="menu-btn" onclick="toggleSound()">🔊 Sound: ON</button>
    <button class="menu-btn red" onclick="closeSettings()">Close</button>
  </div>
</div>

<div id="help" class="modal hidden">
  <div class="modal-box">
    <h2>How to Play</h2>
    <p>🎲 Roll the dice on your turn.</p>
    <p>A roll of <b>4</b> or <b>8</b> gives another roll.</p>
    <p>Capturing an opponent gives another turn.</p>
    <p>Reach HOME with all four pawns to finish.</p>
    <button class="menu-btn red" onclick="closeHelp()">Close</button>
  </div>
</div>

<div class="header">
  <h2>🎲 Ludo Twist</h2>
  <div class="header-buttons">
    <button class="action-btn" onclick="openSettings()">⚙️</button>
    <button class="action-btn" onclick="openHelp()">❓</button>
  </div>
</div>

<div id="identity"></div>
<div id="status">Waiting to start...</div>

<div id="game">
  <div class="players">
    <div class="player-panel" id="panel-0"><div class="player-name" style="color:#0984e3">Blue</div><button class="dice disabled" id="dice-0" onclick="roll(0)">🎲</button></div>
    <div class="player-panel" id="panel-1"><div class="player-name" style="color:#d63031">Red</div><button class="dice disabled" id="dice-1" onclick="roll(1)">🎲</button></div>
    <div class="player-panel" id="panel-2"><div class="player-name" style="color:#00b894">Green</div><button class="dice disabled" id="dice-2" onclick="roll(2)">🎲</button></div>
    <div class="player-panel" id="panel-3"><div class="player-name" style="color:#ffa502">Yellow</div><button class="dice disabled" id="dice-3" onclick="roll(3)">🎲</button></div>
  </div>
  <div id="board" class="board"><div id="pawnLayer" class="pawn-layer"></div></div>
</div>

<div id="communication">
  <div id="chat"></div>
  <div class="chat-row">
    <input id="chatInput" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">Send</button>
    <button id="micBtn" onclick="toggleMic()">🎤</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const socket = io();
const TOTAL=25, HOME=12;
const boardArrows={10:"↓",22:"→",14:"↑",2:"←",11:"→",17:"↑",13:"←",7:"↓"};
const playerInfo=[
{id:0,name:"Blue",color:"#1e90ff",path:[10,15,20,21,22,23,24,19,14,9,4,3,2,1,0,5,6,7,8,13,18,17,16,11,12]},
{id:1,name:"Red",color:"#ff4757",path:[2,1,0,5,10,15,20,21,22,23,24,19,14,9,4,3,8,13,18,17,16,11,6,7,12]},
{id:2,name:"Green",color:"#2ed573",path:[14,9,4,3,2,1,0,5,10,15,20,21,22,23,24,19,18,17,16,11,6,7,8,13,12]},
{id:3,name:"Yellow",color:"#ffa502",path:[22,23,24,19,14,9,4,3,2,1,0,5,10,15,20,21,16,11,6,7,8,13,18,17,12]}
];

let online=false,myPlayerId=null,players=[],activeIndex=0,activeRolls=[],canRoll=false,soundEnabled=true;
let localCount=0,animating=false,localBotTimer=null,audioCtx=null,localTurnNumber=0;
let micStream=null,peerConnections={};

function $(id){return document.getElementById(id)}
function hideMenus(){document.querySelectorAll("#setup .modal-box").forEach(x=>x.classList.add("hidden"))}
function showLocalMenu(){hideMenus();$("localMenu").classList.remove("hidden")}
function showOnlineMenu(){hideMenus();$("onlineMenu").classList.remove("hidden")}
function showPrivate(){hideMenus();$("privateMenu").classList.remove("hidden")}
function backMain(){hideMenus();$("mainMenu").classList.remove("hidden")}
function openSettings(){$("settings").classList.remove("hidden")}
function closeSettings(){$("settings").classList.add("hidden")}
function openHelp(){$("help").classList.remove("hidden")}
function closeHelp(){$("help").classList.add("hidden")}
function toggleSound(){soundEnabled=!soundEnabled;$("soundBtn").innerText=soundEnabled?"🔊 Sound: ON":"🔇 Sound: OFF"}

function beep(freq=500,duration=.08,type="sine"){
  if(!soundEnabled)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration+.02);
  }catch(e){}
}
function diceSound(){beep(220,.06,"square");setTimeout(()=>beep(330,.08,"square"),60)}
function stepSound(){beep(500,.045,"triangle")}
function captureSound(){beep(180,.15,"sawtooth");setTimeout(()=>beep(90,.15,"sawtooth"),100)}
function winSound(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"triangle"),i*100))}
function toast(t){$("toast").innerText=t;$("toast").style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("toast").style.display="none",2200)}

function createBoard(){
  const board=$("board");
  board.querySelectorAll(".cell").forEach(c=>c.remove());
  for(let i=0;i<TOTAL;i++){
    const cell=document.createElement("div");cell.className="cell";
    if(i===HOME){cell.classList.add("home");cell.innerText="HOME"}
    else if(i===10)cell.classList.add("blue");
    else if(i===2)cell.classList.add("red-cell");
    else if(i===14)cell.classList.add("green-cell");
    else if(i===22)cell.classList.add("yellow");
    if(boardArrows[i]&&i!==HOME){
      const a=document.createElement("span");a.innerText=boardArrows[i];a.style.opacity=".25";a.style.fontSize="24px";cell.appendChild(a)
    }
    board.insertBefore(cell,$("pawnLayer"));
  }
  const layer=$("pawnLayer");layer.innerHTML="";
  for(let i=0;i<TOTAL;i++){const slot=document.createElement("div");slot.className="pawn-slot";slot.id=`slot-${i}`;layer.appendChild(slot)}
}

function updateVisibility(){
  $("game").style.display="block";$("communication").style.display="block";
  $("identity").style.display="block";
  for(let i=0;i<4;i++){const p=players.find(x=>x.id===i);$("panel-"+i).style.display=p?"flex":"none"}
}

function render(){
  updateVisibility();
  for(let i=0;i<4;i++){
    const p=players.find(x=>x.id===i);
    const panel=$("panel-"+i),dice=$("dice-"+i);
    if(!p){panel.style.display="none";continue}
    panel.style.display="flex";
    panel.querySelector(".player-name").innerText=p.name+(p.isBot?" 🤖":"");
    panel.querySelector(".player-name").style.color=p.color;
    panel.classList.toggle("active",players[activeIndex]&&players[activeIndex].id===p.id);
    dice.classList.toggle("disabled",!(players[activeIndex]&&players[activeIndex].id===p.id&&canRoll&&p.id===myPlayerId));
    if(players[activeIndex]&&players[activeIndex].id===p.id&&canRoll&&p.id===myPlayerId)dice.innerText="🎲";
  }
  const layer=$("pawnLayer");layer.querySelectorAll(".pawn").forEach(x=>x.remove());
  players.forEach(p=>{
    p.pawns.forEach((step,pi)=>{
      const cell=playerInfo[p.id].path[step];
      const slot=$("slot-"+cell);if(!slot)return;
      const pawn=document.createElement("div");
      pawn.className="pawn";pawn.style.background=p.color;
      pawn.title=p.name+" pawn "+(pi+1);
      const current=players[activeIndex];
      if(current&&current.id===p.id&&p.id===myPlayerId&&activeRolls.length&&canPawnMove(p,pi,activeRolls[0])){
        pawn.classList.add("clickable");
        pawn.onclick=()=>movePawn(p.id,pi);
      }
      slot.appendChild(pawn);
    });
  });
  $("status").innerText=players[activeIndex]?`${players[activeIndex].name}'s turn${canRoll?" — Roll the dice":" — Choose a pawn"}`:"Waiting...";
}

function canPawnMove(p,pi,roll){
  const max=p.hasKilled?24:15;
  return p.pawns[pi]+roll<=max;
}
function hasValidMoveLocal(p,roll){return p.pawns.some((_,i)=>canPawnMove(p,i,roll))}

function startLocal(count){
  online=false;localCount=count;myPlayerId=0;localTurnNumber=0;
  players=playerInfo.slice(0,count===1?1:count).map(p=>({...p,pawns:[0,0,0,0],hasKilled:false,hasWon:false,winRank:0,isBot:false}));
  if(count===1)players.push({...playerInfo[2],name:"Green (Bot)",pawns:[0,0,0,0],hasKilled:false,hasWon:false,winRank:0,isBot:true});
  activeIndex=0;activeRolls=[];canRoll=true;
  $("identity").innerText="You are Blue";createBoard();$("setup").classList.add("hidden");render();
  toast("Local game started!");beep(660,.12);
}

function startOnline(n){online=true;myPlayerId=null;players=[];activeIndex=0;activeRolls=[];canRoll=false;$("setup").classList.add("hidden");$("game").style.display="block";$("communication").style.display="block";$("identity").style.display="block";$("identity").innerText="Connecting...";createBoard();render();$("status").innerText="Finding players...";socket.emit("joinGame",n)}
function createPrivate(n){online=true;myPlayerId=null;players=[];$("setup").classList.add("hidden");$("game").style.display="block";$("communication").style.display="block";$("identity").style.display="block";$("identity").innerText="Creating room...";createBoard();socket.emit("createPrivateGame",n)}
function joinPrivate(){const code=$("roomCode").value.trim().toUpperCase();if(!code){toast("Enter a room code");return}online=true;myPlayerId=null;players=[];$("setup").classList.add("hidden");$("game").style.display="block";$("communication").style.display="block";$("identity").style.display="block";$("identity").innerText="Joining room...";createBoard();socket.emit("joinPrivateGame",code)}

function roll(id){
  if(online){if(id!==myPlayerId)return;socket.emit("requestRoll");return}
  if(!players[activeIndex]||players[activeIndex].id!==id||!canRoll)return;
  localRoll(id);
}
function localRoll(id){
  const values=[1,1,2,2,3,3,4,8],roll=values[Math.floor(Math.random()*values.length)];
  diceSound();canRoll=false;activeRolls=[roll];toast(players[activeIndex].name+" rolled "+roll);
  if(!hasValidMoveLocal(players[activeIndex],roll)){
    activeRolls=[];
    if(roll===4||roll===8){canRoll=true;toast("No move — extra roll!");render();botCheck();return}
    toast("No valid move");nextLocalTurn();return
  }
  render();botCheck();
}
function movePawn(pid,pi){
  if(animating)return;
  if(online){socket.emit("requestMove",{playerId:pid,pawnIndex:pi});return}
  const p=players.find(x=>x.id===pid);if(!p||players[activeIndex].id!==pid||!activeRolls.length)return;
  const roll=activeRolls.shift(),from=p.pawns[pi],to=from+roll;
  applyLocalMove(p,pi,from,to,roll).then(()=>botCheck());
}
async function applyLocalMove(p,pi,from,to,roll){
  animating=true;p.pawns[pi]=from;render();await animatePawn(p.id,pi,from,to);p.pawns[pi]=to;stepSound();
  let extra=false;
  const target=playerInfo[p.id].path[to],safe=[2,10,14,22,12];
  if(to===24){
    if(p.pawns.every(x=>x===24)){p.hasWon=true;p.winRank=players.filter(x=>x.hasWon).length;winSound();toast(p.name+" finished #"+p.winRank)}
    else{extra=true;toast(p.name+" reached HOME! Extra turn")}
  }
  if(!safe.includes(target)){
    players.forEach(op=>{
      if(op.id===p.id||op.hasWon)return;
      op.pawns.forEach((s,j)=>{
        if(s<24&&playerInfo[op.id].path[s]===target){op.pawns[j]=0;p.hasKilled=true;extra=true;captureSound()}
      })
    })
  }
  animating=false;
  if(p.hasWon&&players.filter(x=>!x.hasWon).length<=1){render();toast("Game finished!");return}
  if(extra){canRoll=true}else{canRoll=true;nextLocalTurn()}
  render();
}
function nextLocalTurn(){
  activeRolls=[];canRoll=true;
  for(let i=1;i<=players.length;i++){const idx=(activeIndex+i)%players.length;if(!players[idx].hasWon){activeIndex=idx;break}}
}
function botCheck(){
  if(online||!players[activeIndex]?.isBot||animating)return;
  clearTimeout(localBotTimer);
  localBotTimer=setTimeout(()=>{
    if(players[activeIndex]?.isBot&&canRoll){localRoll(players[activeIndex].id);return}
    if(players[activeIndex]?.isBot&&activeRolls.length){
      const p=players[activeIndex],r=activeRolls[0],choices=p.pawns.map((_,i)=>i).filter(i=>canPawnMove(p,i,r));
      if(choices.length)movePawn(p.id,choices[Math.floor(Math.random()*choices.length)]);
    }
  },700);
}

function slotOf(playerId,step){return playerInfo[playerId].path[step]}
async function animatePawn(playerId,pawnIndex,from,to){
  for(let s=from+1;s<=to;s++){
    const p=players.find(x=>x.id===playerId);if(!p)return;
    p.pawns[pawnIndex]=s;render();stepSound();await new Promise(r=>setTimeout(r,180));
  }
}
function findPawnElement(playerId,pawnIndex){
  const p=players.find(x=>x.id===playerId);if(!p)return null;
  const cell=slotOf(playerId,p.pawns[pawnIndex]);const slot=$("slot-"+cell);
  return slot?.querySelector(".pawn");
}

socket.on("assignPlayer",d=>{myPlayerId=Number(d.playerId);$("identity").innerText="You are "+d.playerName})
socket.on("privateRoomCreated",code=>{toast("Room code: "+code);$("identity").innerText="Room: "+code;$("status").innerText="Waiting for players..."})
socket.on("gameStart",()=>{toast("Match started!");beep(660,.12)})
socket.on("systemMessage",m=>{$("status").innerText=m;addChat("System",m)})
socket.on("roomError",m=>{toast(m);$("setup").classList.remove("hidden");backMain()})
socket.on("roomClosed",m=>{toast(m);location.reload()})
socket.on("actionError",m=>toast(m))

socket.on("gameState",state=>{
  const oldPlayers=players;
  activeIndex=Number(state.activeIndex||0);activeRolls=[...(state.activeRolls||[])];canRoll=!!state.canRoll;
  players=(state.players||[]).map(p=>({...p,isBot:false}));
  if(!animating)render();
})
socket.on("diceRolled",d=>{diceSound();toast((players.find(p=>p.id===d.playerId)?.name||"Player")+" rolled "+d.value);const b=$("dice-"+d.playerId);if(b){b.innerText=String(d.value);setTimeout(()=>{if(b)b.innerText="🎲"},900)}})
socket.on("moveResult",async d=>{
  if(animating)return;
  animating=true;
  const p=players.find(x=>x.id===d.playerId);
  if(p){p.pawns[d.pawnIndex]=d.from;render();await animatePawn(d.playerId,d.pawnIndex,d.from,d.to);stepSound()}
  if(d.captured?.length)captureSound();
  animating=false;render();
})
socket.on("gameFinished",()=>{winSound();toast("Game finished!")})

function addChat(name,text){const div=document.createElement("div");div.innerHTML="<b>"+escapeHtml(name)+":</b> "+escapeHtml(text);$("chat").appendChild(div);$("chat").scrollTop=$("chat").scrollHeight}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sendChat(){const input=$("chatInput"),text=input.value.trim();if(!text)return;if(online)socket.emit("sendChatMessage",{text});else addChat("You",text);input.value=""}
socket.on("receiveChatMessage",d=>addChat(d.name,d.text))

async function toggleMic(){
  if(!online){toast("Microphone is available in online rooms");return}
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;$("micBtn").classList.remove("active");toast("Microphone off");return}
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});$("micBtn").classList.add("active");toast("Microphone on");await startVoice()}catch(e){toast("Microphone permission was denied")}
}
async function startVoice(){
  const others=players.filter(p=>p.id!==myPlayerId);
  for(const p of others){
    const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    peerConnections[p.id]=pc;
    micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
    pc.onicecandidate=e=>{if(e.candidate)socket.emit("iceCandidate",{to:p.id,candidate:e.candidate})};
    pc.ontrack=e=>{let a=document.getElementById("voice-"+p.id);if(!a){a=document.createElement("audio");a.id="voice-"+p.id;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit("voiceOffer",{to:p.id,offer});
  }
}
socket.on("voiceOffer",async d=>{
  if(!micStream)return;
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});peerConnections[d.from]=pc;
  micStream.getTracks().forEach(t=>pc.addTrack(t,micStream));
  pc.onicecandidate=e=>{if(e.candidate)socket.emit("iceCandidate",{to:d.from,candidate:e.candidate})};
  pc.ontrack=e=>{let a=document.getElementById("voice-"+d.from);if(!a){a=document.createElement("audio");a.id="voice-"+d.from;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0]};
  await pc.setRemoteDescription(d.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit("voiceAnswer",{to:d.from,answer});
})
socket.on("voiceAnswer",async d=>{const pc=peerConnections[d.from];if(pc)await pc.setRemoteDescription(d.answer).catch(()=>{})})
socket.on("iceCandidate",async d=>{const pc=peerConnections[d.from];if(pc)await pc.addIceCandidate(d.candidate).catch(()=>{})})

createBoard();
</script>
