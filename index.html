<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Twist</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:10px;
    min-height:100vh;
    font-family:Segoe UI,Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
}

.header{
    width:100%;
    max-width:440px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:8px 0;
}

.header h2{
    margin:0;
}

.header-buttons{
    display:flex;
    gap:6px;
}

button{
    border:0;
    cursor:pointer;
}

.action-btn{
    padding:8px 12px;
    border-radius:20px;
    background:#34495e;
    color:white;
    font-weight:bold;
}

#identity-badge{
    display:none;
    background:#2ecc71;
    padding:5px 12px;
    border-radius:15px;
    font-size:13px;
    font-weight:bold;
}

#status{
    display:none;
    width:100%;
    max-width:420px;
    min-height:28px;
    margin:5px 0;
    padding:6px 10px;
    border-radius:20px;
    background:white;
    color:#333;
    text-align:center;
    font-weight:bold;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal{
    width:85%;
    max-width:350px;
    background:white;
    color:#333;
    padding:22px;
    border-radius:15px;
    text-align:center;
}

.menu{
    display:none;
}

.menu.active{
    display:block;
}

.menu-btn{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    color:white;
    background:#1e90ff;
    font-size:15px;
    font-weight:bold;
}

.green{background:#2ecc71}
.purple{background:#9b59b6}
.red{background:#e74c3c}
.gray{background:#7f8c8d}

#game{
    display:none;
    width:100%;
    max-width:440px;
}

.panels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
}

.panel{
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:.55;
    border:3px solid transparent;
    border-radius:8px;
    transition:.15s;
}

.panel.active{
    opacity:1;
    border-color:#ffd700;
    transform:scale(1.03);
}

.panel-left{
    width:45px;
    height:45px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.panel-pawn{
    width:25px;
    height:25px;
    border-radius:50%;
    border:2px solid white;
}

.dice{
    width:48px;
    height:45px;
    background:white;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    border-radius:5px;
    user-select:none;
}

.dice.enabled{
    cursor:pointer;
    box-shadow:0 0 10px 3px rgba(255,255,255,.8);
}

.dice.disabled{
    opacity:.5;
    pointer-events:none;
}

#board{
    width:100%;
    aspect-ratio:1;
    position:relative;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:3px;
    padding:6px;
    background:#2c3e50;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.cell{
    background:#ecf0f1;
    border-radius:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.blue{background:#74b9ff}
.redcell{background:#ff7675}
.greencell{background:#55efc4}
.yellow{background:#ffeaa7}

.home{
    background:#9b59b6;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.arrow{
    position:absolute;
    font-size:25px;
    color:rgba(0,0,0,.25);
    pointer-events:none;
}

#pawn-layer{
    position:absolute;
    inset:6px;
    z-index:20;
    pointer-events:none;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
}

.pawn-slot{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:2px;
    pointer-events:none;
}

.pawn{
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid white;
    box-shadow:2px 3px 5px rgba(0,0,0,.5);
    pointer-events:auto;
    cursor:default;
    transition:transform .12s;
}

.pawn.clickable{
    cursor:pointer;
    animation:pulse 1s infinite;
    box-shadow:0 0 10px 4px white;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.3)}
    100%{transform:scale(1)}
}

#communication{
    display:none;
    width:100%;
    max-width:440px;
    margin-top:8px;
    background:rgba(0,0,0,.25);
    padding:8px;
    border-radius:10px;
}

#chat{
    height:75px;
    overflow-y:auto;
    font-size:12px;
    padding:5px;
    background:rgba(255,255,255,.1);
    border-radius:5px;
    margin-bottom:5px;
}

.chat-row{
    display:flex;
    gap:5px;
}

.chat-row input{
    flex:1;
    min-width:0;
    padding:8px;
    border:0;
    border-radius:5px;
}

.chat-row button{
    padding:8px;
    border-radius:5px;
    color:white;
    background:#e67e22;
    font-weight:bold;
}

#mic.active{
    background:#c0392b;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="setup" class="overlay">

    <div id="mainMenu" class="modal menu active">
        <h1>Ludo Twist</h1>

        <button class="menu-btn" onclick="showMenu('localMenu')">
            Play Local
        </button>

        <button class="menu-btn green" onclick="showMenu('onlineMenu')">
            Online Multiplayer
        </button>
    </div>

    <div id="localMenu" class="modal menu">
        <h2>Local Game</h2>

        <button class="menu-btn" onclick="startLocal(1)">
            1 Player vs Bot
        </button>

        <button class="menu-btn" onclick="startLocal(2)">
            2 Players
        </button>

        <button class="menu-btn" onclick="startLocal(3)">
            3 Players
        </button>

        <button class="menu-btn" onclick="startLocal(4)">
            4 Players
        </button>

        <button class="menu-btn gray" onclick="showMenu('mainMenu')">
            Back
        </button>
    </div>

    <div id="onlineMenu" class="modal menu">
        <h2>Online Multiplayer</h2>

        <button class="menu-btn green" onclick="startOnline(2)">
            Public 2 Player
        </button>

        <button class="menu-btn green" onclick="startOnline(3)">
            Public 3 Player
        </button>

        <button class="menu-btn green" onclick="startOnline(4)">
            Public 4 Player
        </button>

        <button class="menu-btn purple" onclick="showMenu('privateMenu')">
            Private Room
        </button>

        <button class="menu-btn gray" onclick="showMenu('mainMenu')">
            Back
        </button>
    </div>

    <div id="privateMenu" class="modal menu">
        <h2>Private Room</h2>

        <button class="menu-btn green" onclick="createPrivate(2)">
            Create 2 Player
        </button>

        <button class="menu-btn green" onclick="createPrivate(3)">
            Create 3 Player
        </button>

        <button class="menu-btn green" onclick="createPrivate(4)">
            Create 4 Player
        </button>

        <hr>

        <input
            id="roomCode"
            placeholder="ROOM CODE"
            style="width:100%;padding:11px;text-align:center;text-transform:uppercase"
        >

        <button class="menu-btn purple" onclick="joinPrivate()">
            Join Room
        </button>

        <button class="menu-btn gray" onclick="showMenu('onlineMenu')">
            Back
        </button>
    </div>

</div>

<!-- SETTINGS -->
<div id="settings" class="overlay" style="display:none">
    <div class="modal">
        <h2>Settings</h2>

        <button id="soundBtn" class="menu-btn" onclick="toggleSound()">
            🔊 Sound ON
        </button>

        <button class="menu-btn red" onclick="closeSettings()">
            Close
        </button>
    </div>
</div>

<!-- HELP -->
<div id="help" class="overlay" style="display:none">
    <div class="modal">
        <h2>How To Play</h2>

        <p>
            Roll the dice and tap a glowing pawn.
        </p>

        <p>
            A roll of 4 or 8 gives an extra turn.
        </p>

        <p>
            Capturing an opponent also gives an extra turn.
        </p>

        <button class="menu-btn red" onclick="closeHelp()">
            Close
        </button>
    </div>
</div>

<!-- HEADER -->
<div class="header">

    <h2>Ludo Twist</h2>

    <span id="identity-badge"></span>

    <div class="header-buttons">
        <button class="action-btn" onclick="openSettings()">⚙️</button>
        <button class="action-btn" onclick="openHelp()">❓</button>
    </div>

</div>

<div id="status"></div>

<!-- GAME -->
<div id="game">

    <div class="panels">

        <div class="panel" id="panel-0">
            <div class="panel-left" style="background:#0984e3">
                <div class="panel-pawn" style="background:#0984e3"></div>
            </div>
            <div class="dice disabled" id="dice-0" onclick="rollDice(0)">
                🎲
            </div>
        </div>

        <div class="panel" id="panel-1">
            <div class="panel-left" style="background:#d63031">
                <div class="panel-pawn" style="background:#d63031"></div>
            </div>
            <div class="dice disabled" id="dice-1" onclick="rollDice(1)">
                🎲
            </div>
        </div>

        <div class="panel" id="panel-2">
            <div class="panel-left" style="background:#00b894">
                <div class="panel-pawn" style="background:#00b894"></div>
            </div>
            <div class="dice disabled" id="dice-2" onclick="rollDice(2)">
                🎲
            </div>
        </div>

        <div class="panel" id="panel-3">
            <div class="panel-left" style="background:#fdcb6e">
                <div class="panel-pawn" style="background:#ffa502"></div>
            </div>
            <div class="dice disabled" id="dice-3" onclick="rollDice(3)">
                🎲
            </div>
        </div>

    </div>

    <div id="board">
        <div id="pawn-layer"></div>
    </div>

</div>

<!-- CHAT + MIC -->
<div id="communication">

    <div id="chat"></div>

    <div class="chat-row">

        <input
            id="chatInput"
            placeholder="Type message..."
            onkeydown="if(event.key==='Enter') sendChat()"
        >

        <button onclick="sendChat()">Send</button>

        <button id="mic" onclick="toggleMic()">🎤</button>

    </div>

</div>

<script>
/* =========================================================
   SOCKET
========================================================= */

const socket = io();

/* =========================================================
   GAME DATA
========================================================= */

const paths = [
    [10,15,20,21,22,23,24,19,14,9,4,3,2,1,0,5,6,7,8,13,18,17,16,11,12],

    [2,1,0,5,10,15,20,21,22,23,24,19,14,9,4,3,8,13,18,17,16,11,6,7,12],

    [14,9,4,3,2,1,0,5,10,15,20,21,22,23,24,19,18,17,16,11,6,7,8,13,12],

    [22,23,24,19,14,9,4,3,2,1,0,5,10,15,20,21,16,11,6,7,8,13,18,17,12]
];

const players = [
    {
        id:0,
        name:"Blue",
        color:"#1e90ff",
        pawns:[0,0,0,0],
        hasKilled:false,
        hasWon:false,
        winRank:0,
        isBot:false
    },
    {
        id:1,
        name:"Red",
        color:"#ff4757",
        pawns:[0,0,0,0],
        hasKilled:false,
        hasWon:false,
        winRank:0,
        isBot:false
    },
    {
        id:2,
        name:"Green",
        color:"#2ed573",
        pawns:[0,0,0,0],
        hasKilled:false,
        hasWon:false,
        winRank:0,
        isBot:false
    },
    {
        id:3,
        name:"Yellow",
        color:"#ffa502",
        pawns:[0,0,0,0],
        hasKilled:false,
        hasWon:false,
        winRank:0,
        isBot:false
    }
];

/* =========================================================
   STATE
========================================================= */

let activePlayers = [];
let activePlayerIndex = 0;

let myPlayerId = null;

let activeRolls = [];
let canRoll = true;

let isOnline = false;
let isAnimating = false;

let soundEnabled = true;
let audioCtx = null;

let currentRank = 1;

/* =========================================================
   SOCKET EVENTS
========================================================= */

socket.on("assignPlayer", id => {

    myPlayerId = id;

    const p = players.find(x => x.id === id);

    if(p){
        document.getElementById("identity-badge").style.display = "block";
        document.getElementById("identity-badge").textContent =
            "You are " + p.name;
    }

    showStatus("Connected");
});

socket.on("systemMessage", msg => {
    showStatus(msg);
});

socket.on("privateRoomCreated", code => {
    showStatus("Room Code: " + code);
});

socket.on("roomError", msg => {

    alert(msg);

    document.getElementById("setup").style.display = "flex";
});

socket.on("gameStart", ids => {

    activePlayers = ids
        .map(id => players.find(p => p.id === id))
        .filter(Boolean);

    activePlayerIndex = 0;
    activeRolls = [];
    canRoll = true;
    isAnimating = false;

    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";

    if(isOnline){
        document.getElementById("communication").style.display = "block";
    }

    buildBoard();
    render();

    showStatus("Match started! Blue goes first.");
});

/*
 IMPORTANT:
 The server should send the complete authoritative state.
*/
socket.on("forceSync", state => {

    if(!isOnline) return;

    if(!state || !Array.isArray(state.players)) return;

    activePlayerIndex = Number.isInteger(state.activeIndex)
        ? state.activeIndex
        : 0;

    activeRolls = Array.isArray(state.activeRolls)
        ? [...state.activeRolls]
        : [];

    canRoll = !!state.canRoll;

    state.players.forEach(serverPlayer => {

        const local = players.find(p => p.id === serverPlayer.id);

        if(!local) return;

        if(Array.isArray(serverPlayer.pawns)){
            local.pawns = [...serverPlayer.pawns];
        }

        local.hasKilled = !!serverPlayer.hasKilled;
        local.hasWon = !!serverPlayer.hasWon;
        local.winRank = serverPlayer.winRank || 0;
    });

    activePlayers = activePlayers.filter(p =>
        state.players.some(sp => sp.id === p.id)
    );

    isAnimating = false;

    render();
    updateStatus();
});

/*
 Server tells clients to animate a move.
*/
socket.on("executeMove", data => {

    if(!data) return;

    animateRemoteMove(
        data.playerId,
        data.pawnIndex,
        data.steps
    );
});

/*
 Server tells clients about dice roll.
*/
socket.on("executeRoll", data => {

    if(!data) return;

    const p = activePlayers.find(x => x.id === data.playerId);

    if(!p) return;

    const dice = document.getElementById("dice-" + data.playerId);

    if(dice){
        dice.textContent = data.rollValue;
    }
});

/* =========================================================
   MENU
========================================================= */

function showMenu(id){

    document.querySelectorAll(".menu").forEach(m =>
        m.classList.remove("active")
    );

    document.getElementById(id).classList.add("active");
}

function startLocal(num){

    isOnline = false;

    ensureAudio();

    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("communication").style.display = "block";

    const copy = JSON.parse(JSON.stringify(players));

    if(num === 1){

        activePlayers = [
            copy[0],
            Object.assign(copy[2],{
                name:"Green (Bot)",
                isBot:true
            })
        ];

    }else{

        activePlayers = copy.slice(0,num);
    }

    myPlayerId = 0;

    document.getElementById("identity-badge").style.display = "block";
    document.getElementById("identity-badge").textContent =
        "You are Blue";

    activePlayerIndex = 0;
    activeRolls = [];
    canRoll = true;

    buildBoard();
    render();
    updateStatus();
}

function startOnline(num){

    isOnline = true;

    ensureAudio();

    document.getElementById("setup").style.display = "none";

    showStatus("Finding players...");

    socket.emit("joinGame",num);
}

function createPrivate(num){

    isOnline = true;

    ensureAudio();

    document.getElementById("setup").style.display = "none";

    showStatus("Creating room...");

    socket.emit("createPrivateGame",num);
}

function joinPrivate(){

    const code =
        document.getElementById("roomCode")
        .value
        .trim()
        .toUpperCase();

    if(!code){
        alert("Enter room code");
        return;
    }

    isOnline = true;

    ensureAudio();

    document.getElementById("setup").style.display = "none";

    showStatus("Joining room...");

    socket.emit("joinPrivateGame",code);
}

/* =========================================================
   BOARD
========================================================= */

function buildBoard(){

    const board = document.getElementById("board");

    board.querySelectorAll(".cell").forEach(c => c.remove());

    const arrows = {
        10:"↓",
        22:"→",
        14:"↑",
        2:"←",
        11:"→",
        17:"↑",
        13:"←",
        7:"↓"
    };

    for(let i=0;i<25;i++){

        const cell = document.createElement("div");

        cell.className = "cell";

        if(i===12){

            cell.classList.add("home");
            cell.textContent = "HOME";

        }else if(i===10){

            cell.classList.add("blue");

        }else if(i===2){

            cell.classList.add("redcell");

        }else if(i===14){

            cell.classList.add("greencell");

        }else if(i===22){

            cell.classList.add("yellow");
        }

        if(arrows[i] && i!==12){

            const arrow = document.createElement("div");

            arrow.className = "arrow";
            arrow.textContent = arrows[i];

            cell.appendChild(arrow);
        }

        board.insertBefore(
            cell,
            document.getElementById("pawn-layer")
        );
    }

    const layer = document.getElementById("pawn-layer");

    layer.innerHTML = "";

    for(let i=0;i<25;i++){

        const slot = document.createElement("div");

        slot.className = "pawn-slot";
        slot.id = "slot-"+i;

        layer.appendChild(slot);
    }
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    if(!document.getElementById("slot-0")){
        buildBoard();
    }

    for(let i=0;i<25;i++){

        const slot = document.getElementById("slot-"+i);

        if(slot){
            slot.innerHTML = "";
        }
    }

    if(!activePlayers.length) return;

    const current =
        activePlayers[activePlayerIndex];

    if(!current) return;

    activePlayers.forEach(player => {

        player.pawns.forEach((step,pawnIndex) => {

            const gridIndex =
                paths[player.id][Math.min(step,24)];

            const slot =
                document.getElementById("slot-"+gridIndex);

            if(!slot) return;

            const pawn =
                document.createElement("div");

            pawn.className = "pawn";

            pawn.style.background =
                player.color;

            const myTurn =
                current.id === player.id &&
                (
                    !isOnline ||
                    myPlayerId === player.id
                );

            const roll =
                activeRolls.length
                    ? activeRolls[0]
                    : null;

            const valid =
                roll !== null &&
                step + roll <= 24;

            /*
             This is the important fix:
             pawn remains clickable until a move request
             has actually been sent.
            */

            if(
                myTurn &&
                canRoll === false &&
                valid &&
                !isAnimating
            ){

                pawn.classList.add("clickable");

                pawn.addEventListener(
                    "click",
                    function(e){

                        e.stopPropagation();

                        if(isAnimating) return;

                        movePawn(
                            player.id,
                            pawnIndex
                        );
                    }
                );
            }

            slot.appendChild(pawn);
        });
    });

    updatePanels();
}

/* =========================================================
   DICE
========================================================= */

function rollDice(playerId){

    if(!activePlayers.length) return;

    const current =
        activePlayers[activePlayerIndex];

    if(!current) return;

    if(playerId !== current.id) return;

    if(isAnimating) return;

    if(!canRoll) return;

    if(isOnline && playerId !== myPlayerId) return;

    ensureAudio();

    /*
     Lock immediately.
     This prevents double-clicks and duplicate rolls.
    */

    canRoll = false;

    updatePanels();

    const roll =
        [1,1,2,2,3,3,4,8]
        [Math.floor(Math.random()*8)];

    if(isOnline){

        socket.emit("requestRoll",{
            playerId:playerId,
            rollValue:roll
        });

    }else{

        applyLocalRoll(
            playerId,
            roll
        );
    }
}

function applyLocalRoll(playerId,roll){

    const dice =
        document.getElementById("dice-"+playerId);

    if(dice){
        dice.textContent = roll;
    }

    activeRolls.push(roll);

    playDiceSound();

    /*
     Normal rolls require a move.
     4/8 allow another roll only AFTER
     the current move/event is completed.
    */

    canRoll =
        roll === 4 ||
        roll === 8;

    render();

    updateStatus();

    checkAvailableMove();
}

/* =========================================================
   PAWN MOVE
========================================================= */

function movePawn(playerId,pawnIndex){

    if(isAnimating) return;

    const current =
        activePlayers[activePlayerIndex];

    if(!current) return;

    if(current.id !== playerId) return;

    if(isOnline && myPlayerId !== playerId) return;

    if(activeRolls.length === 0) return;

    const roll = activeRolls[0];

    const player =
        activePlayers.find(p => p.id === playerId);

    if(!player) return;

    if(
        player.pawns[pawnIndex] + roll > 24
    ){
        return;
    }

    /*
     CRITICAL:
     Lock the client BEFORE sending.
     */

    isAnimating = true;

    render();

    if(isOnline){

        socket.emit("requestMove",{
            playerId:playerId,
            pawnIndex:pawnIndex
        });

    }else{

        animateMove(
            playerId,
            pawnIndex,
            roll
        );
    }
}

/* =========================================================
   LOCAL ANIMATION
========================================================= */

function animateMove(playerId,pawnIndex,steps){

    const player =
        activePlayers.find(p => p.id === playerId);

    if(!player){
        isAnimating = false;
        return;
    }

    activeRolls.shift();

    let count = 0;

    function hop(){

        if(count >= steps){

            finishMove(
                playerId,
                pawnIndex
            );

            return;
        }

        player.pawns[pawnIndex]++;

        count++;

        playMoveSound();

        render();

        setTimeout(hop,120);
    }

    hop();
}

/* =========================================================
   REMOTE ANIMATION
========================================================= */

function animateRemoteMove(
    playerId,
    pawnIndex,
    steps
){

    /*
     If the server already synchronizes the final state,
     don't overwrite it unnecessarily.
    */

    const player =
        activePlayers.find(p => p.id === playerId);

    if(!player) return;

    isAnimating = true;

    let target =
        player.pawns[pawnIndex];

    let count = 0;

    function hop(){

        if(count >= steps){

            isAnimating = false;

            render();
            updateStatus();

            return;
        }

        player.pawns[pawnIndex]++;

        target++;

        count++;

        playMoveSound();

        render();

        setTimeout(hop,120);
    }

    hop();
}

/* =========================================================
   FINISH MOVE
========================================================= */

function finishMove(playerId,pawnIndex){

    const player =
        activePlayers.find(p => p.id === playerId);

    if(!player){

        isAnimating = false;
        return;
    }

    const finalCell =
        paths[player.id][player.pawns[pawnIndex]];

    let extraTurn = false;

    /*
     Home
    */

    if(player.pawns[pawnIndex] === 24){

        if(player.pawns.every(p => p === 24)){

            player.hasWon = true;
            player.winRank = currentRank++;

            isAnimating = false;

            showStatus(
                player.name + " finished!"
            );

            setTimeout(
                nextPlayer,
                800
            );

            return;

        }else{

            extraTurn = true;
        }
    }

    /*
     Capture
    */

    if(
        ![2,10,14,22,12].includes(finalCell)
    ){

        for(const opponent of activePlayers){

            if(opponent.id === player.id) continue;

            if(opponent.hasWon) continue;

            for(let i=0;i<4;i++){

                if(
                    opponent.pawns[i] < 24 &&
                    paths[opponent.id][opponent.pawns[i]]
                    === finalCell
                ){

                    opponent.pawns[i] = 0;

                    player.hasKilled = true;

                    extraTurn = true;
                }
            }
        }
    }

    isAnimating = false;

    /*
     Extra turn from 4/8 OR capture/home.
    */

    if(extraTurn){

        canRoll = true;

        showStatus(
            player.name +
            " gets another turn!"
        );

    }else{

        canRoll = false;

        /*
         Normal roll consumed.
        */

        setTimeout(
            nextPlayer,
            700
        );
    }

    render();
    updateStatus();
}

/* =========================================================
   NO-MOVE CHECK
========================================================= */

function checkAvailableMove(){

    if(!activePlayers.length) return;

    const player =
        activePlayers[activePlayerIndex];

    if(!player) return;

    if(activeRolls.length === 0) return;

    const roll = activeRolls[0];

    const valid =
        player.pawns.some(
            p => p + roll <= 24
        );

    if(!valid){

        activeRolls.shift();

        if(canRoll){

            updateStatus();

            return;
        }

        setTimeout(
            nextPlayer,
            600
        );
    }

    render();
}

/* =========================================================
   NEXT PLAYER
========================================================= */

function nextPlayer(){

    if(!activePlayers.length) return;

    activeRolls = [];
    canRoll = true;
    isAnimating = false;

    let attempts = 0;

    do{

        activePlayerIndex =
            (activePlayerIndex + 1)
            % activePlayers.length;

        attempts++;

    }while(
        activePlayers[activePlayerIndex].hasWon &&
        attempts <= activePlayers.length
    );

    activePlayers.forEach(player => {

        const dice =
            document.getElementById(
                "dice-"+player.id
            );

        if(
            dice &&
            !player.hasWon
        ){
            dice.textContent = "🎲";
        }
    });

    render();
    updateStatus();

    /*
     Local bot
    */

    const current =
        activePlayers[activePlayerIndex];

    if(
        !isOnline &&
        current &&
        current.isBot
    ){

        setTimeout(
            botTurn,
            600
        );
    }
}

/* =========================================================
   BOT
========================================================= */

function botTurn(){

    if(isAnimating) return;

    const player =
        activePlayers[activePlayerIndex];

    if(!player || !player.isBot) return;

    if(canRoll){

        const roll =
            [1,1,2,2,3,3,4,8]
            [Math.floor(Math.random()*8)];

        canRoll = false;

        applyLocalRoll(
            player.id,
            roll
        );

        return;
    }

    if(activeRolls.length){

        const roll =
            activeRolls[0];

        const valid = [];

        player.pawns.forEach(
            (p,i)=>{
                if(p+roll <= 24){
                    valid.push(i);
                }
            }
        );

        if(valid.length){

            const index =
                valid[
                    Math.floor(
                        Math.random()*valid.length
                    )
                ];

            setTimeout(
                ()=>{
                    movePawn(
                        player.id,
                        index
                    );
                },
                500
            );
        }
    }
}

/* =========================================================
   PANELS
========================================================= */

function updatePanels(){

    activePlayers.forEach(player => {

        const panel =
            document.getElementById(
                "panel-"+player.id
            );

        const dice =
            document.getElementById(
                "dice-"+player.id
            );

        if(!panel || !dice) return;

        panel.style.display = "flex";

        const current =
            activePlayers[activePlayerIndex];

        panel.classList.toggle(
            "active",
            current &&
            current.id === player.id
        );

        const mine =
            current &&
            current.id === player.id &&
            (!isOnline ||
             myPlayerId === player.id);

        const enabled =
            mine &&
            canRoll &&
            !isAnimating &&
            !player.hasWon;

        dice.classList.toggle(
            "enabled",
            enabled
        );

        dice.classList.toggle(
            "disabled",
            !enabled
        );

        if(player.hasWon){

            dice.textContent =
                player.winRank === 1
                ? "🥇"
                : "👑";
        }
    });

    for(let i=0;i<4;i++){

        if(!activePlayers.some(p=>p.id===i)){

            const panel =
                document.getElementById(
                    "panel-"+i
                );

            if(panel){
                panel.style.display="none";
            }
        }
    }
}

/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    if(!activePlayers.length) return;

    const player =
        activePlayers[activePlayerIndex];

    if(!player) return;

    const mine =
        !isOnline ||
        player.id === myPlayerId;

    let text = "";

    if(activeRolls.length){

        text =
            "Roll: " +
            activeRolls.join(", ") +
            " — " +
            (
                mine
                ? (
                    canRoll
                    ? "Roll again or move."
                    : "Tap a glowing pawn."
                  )
                : "Waiting..."
            );

    }else{

        text =
            mine
            ? "Your turn — roll the dice."
            : player.name + "'s turn...";
    }

    showStatus(text);
}

function showStatus(text){

    const el =
        document.getElementById("status");

    el.style.display="block";
    el.textContent=text;
}

/* =========================================================
   AUDIO
========================================================= */

function ensureAudio(){

    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}

function playMoveSound(){

    if(!soundEnabled) return;

    ensureAudio();

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type="triangle";

    osc.frequency.setValueAtTime(
        420,
        audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        700,
        audioCtx.currentTime+.07
    );

    gain.gain.setValueAtTime(
        .16,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        audioCtx.currentTime+.1
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(
        audioCtx.currentTime+.1
    );
}

function playDiceSound(){

    if(!soundEnabled) return;

    ensureAudio();

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type="square";

    osc.frequency.value=300;

    gain.gain.value=.08;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+.08
    );
}

function toggleSound(){

    soundEnabled = !soundEnabled;

    document.getElementById(
        "soundBtn"
    ).textContent =
        soundEnabled
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";
}

   SETTINGS / HELP
========================================================= */

}

function closeSettings(){
    document.getElementById("settings").style.display="none";
}

/* =========================================================
   CHAT
========================================================= */

function sendChat(){

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if(!text) return;

    const p =
        players.find(
            x=>x.id===myPlayerId
        );

    const name =
        p ? p.name : "Player";

    if(isOnline){

        socket.emit(
            "sendChatMessage",
            {
                name:name,
                text:text
            }
        );

    }else{

        addChat(name,text);
    }

    input.value="";
}

socket.on(
    "receiveChatMessage",
    data=>{
        addChat(
            data.name,
            data.text
        );
    }
);

function addChat(name,text){

    const box =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.textContent =
        name + ": " + text;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;
}

/* =========================================================
   MICROPHONE
========================================================= */

let micStream = null;
let micRecorder = null;
let micActive = false;

async function toggleMic(){

    const button =
        document.getElementById("mic");

    if(micActive){

        stopMic();

        return;
    }

    if(!isOnline){

        alert(
            "Voice chat is available in online multiplayer."
        );

        return;
    }

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            alert(
                "This browser does not support microphone access."
            );

            return;
        }

        micStream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        /*
         Don't force one MIME type.
         Different Android browsers support
         different MediaRecorder formats.
        */

        let options = {};

        if(
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ){

            options.mimeType =
                "audio/webm;codecs=opus";

        }else if(
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ){

            options.mimeType =
                "audio/webm";
        }

        micRecorder =
            new MediaRecorder(
                micStream,
                options
            );

        micRecorder.ondataavailable =
            async event => {

                if(
                    !event.data ||
                    !event.data.size
                ) return;

                /*
                 Send ArrayBuffer through Socket.IO.
                */

                const buffer =
                    await event.data.arrayBuffer();

                socket.emit(
                    "voiceData",
                    buffer
                );
            };

        micRecorder.start(200);

        micActive=true;

        button.classList.add("active");
        button.textContent="🔴";

    }catch(error){

        console.error(error);

        alert(
            "Microphone permission was denied or unavailable."
        );
    }
}

function stopMic(){

    if(micRecorder){

        if(
            micRecorder.state !== "inactive"
        ){
            micRecorder.stop();
        }

        micRecorder=null;
    }

    if(micStream){

        micStream
            .getTracks()
            .forEach(track=>track.stop());

        micStream=null;
    }

    micActive=false;

    const button =
        document.getElementById("mic");

    button.classList.remove("active");
    button.textContent="🎤";
}

/* =========================================================
   REMOTE VOICE
========================================================= */

let voiceAudioContext = null;

socket.on(
    "voiceData",
    async data => {

        try{

            if(!voiceAudioContext){

                voiceAudioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }

            if(
                voiceAudioContext.state ===
                "suspended"
            ){

                await voiceAudioContext.resume();
            }

            /*
             Socket.IO may deliver an ArrayBuffer
             or a typed-array-like object.
            */

            let buffer;

            if(data instanceof ArrayBuffer){

                buffer=data;

            }else if(data && data.buffer){

                buffer =
                    data.buffer.slice(
                        data.byteOffset || 0,
                        (data.byteOffset || 0)+
                        data.byteLength
                    );

            }else{

                return;
            }

            const audioBuffer =
                await voiceAudioContext.decodeAudioData(
                    buffer.slice(0)
                );

            const source =
                voiceAudioContext
                .createBufferSource();

            source.buffer=audioBuffer;

            source.connect(
                voiceAudioContext.destination
            );

            source.start();

        }catch(error){

            console.log(
                "Voice playback error:",
                error
            );
        }
    }
);

/* =========================================================
   CONNECTION
========================================================= */

socket.on(
    "connect",
    ()=>{
        console.log(
            "Connected:",
            socket.id
        );
    }
);

socket.on(
    "disconnect",
    ()=>{
        showStatus(
            "Connection lost. Reconnecting..."
        );

        /*
         Stop local microphone if the
         connection disappears.
        */

        if(micActive){
            stopMic();
        }
    }
);
