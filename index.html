<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no"
>

<title>Ludo Twist</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:10px;
  font-family:
    Segoe UI,
    Tahoma,
    sans-serif;
  color:white;
  background:
    linear-gradient(
      135deg,
      #1e3c72,
      #2a5298
    );
  min-height:100vh;
}

button,input{
  font:inherit;
}

.header{
  max-width:430px;
  margin:8px auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.header h2{
  margin:0;
  font-size:25px;
  flex:1;
  text-shadow:2px 2px 4px #0008;
}

.badge{
  display:none;
  background:#2ecc71;
  padding:8px 12px;
  border-radius:18px;
  font-weight:bold;
  white-space:nowrap;
}

.icon{
  border:0;
  border-radius:20px;
  background:#34495e;
  color:white;
  padding:9px 12px;
  box-shadow:0 3px 7px #0005;
}

.status{
  display:none;
  max-width:430px;
  margin:8px auto;
  padding:9px 12px;
  border-radius:22px;
  background:white;
  color:#222;
  text-align:center;
  font-weight:bold;
  min-height:40px;
}

.modal{
  position:fixed;
  inset:0;
  background:#000d;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal.hide{
  display:none;
}

.box{
  width:min(88%,340px);
  background:white;
  color:#222;
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:0 15px 40px #0008;
}

.btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:12px;
  margin:6px 0;
  background:#1e90ff;
  color:white;
  font-weight:bold;
}

.green{
  background:#2ecc71;
}

.purple{
  background:#9b59b6;
}

.gray{
  background:#7f8c8d;
}

.red{
  background:#e74c3c;
}

.game{
  display:none;
  max-width:430px;
  margin:auto;
}

.panels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:8px 0;
}

.panel{
  display:flex;
  align-items:center;
  opacity:.45;
  border:3px solid transparent;
  border-radius:8px;
  overflow:hidden;
  transition:.2s;
}

.panel.active{
  opacity:1;
  border-color:#ffd700;
  transform:scale(1.03);
}

.panel.hidden{
  visibility:hidden;
}

.name{
  padding:9px 7px;
  font-weight:bold;
  flex:1;
}

.dice{
  width:58px;
  height:54px;
  border:0;
  background:white;
  color:#111;
  font-size:27px;
  font-weight:900;
  cursor:pointer;
}

.dice.disabled{
  opacity:.55;
  pointer-events:none;
}

.board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  background:#2c3e50;
  padding:6px;
  border-radius:13px;
  aspect-ratio:1;
  box-shadow:0 10px 25px #0006;
}

.cell{
  background:#ecf0f1;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555;
  font-weight:bold;
  position:relative;
}

.blue{
  background:
    linear-gradient(
      135deg,
      #74b9ff,
      #0984e3
    );
}

.redc{
  background:
    linear-gradient(
      135deg,
      #ff7675,
      #d63031
    );
}

.greenc{
  background:
    linear-gradient(
      135deg,
      #55efc4,
      #00b894
    );
}

.yellow{
  background:
    linear-gradient(
      135deg,
      #ffeaa7,
      #fdcb6e
    );
}

.home{
  background:
    linear-gradient(
      135deg,
      #9b59b6,
      #8e44ad
    );
  color:white;
}

.arrow{
  font-size:26px;
  opacity:.35;
}

.pawns{
  position:absolute;
  inset:6px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  pointer-events:none;
  z-index:5;
}

.slot{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:3px;
  pointer-events:auto;
}

.pawn{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:
    1px 2px 5px #0008;
  transition:
    transform .12s;
}

.pawn.movable{
  cursor:pointer;
  animation:pulse .75s infinite;
  box-shadow:
    0 0 0 3px #fff8,
    0 0 12px white;
}

@keyframes pulse{
  50%{
    transform:scale(1.3);
  }
}

.chat{
  display:none;
  background:#0003;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
}

.messages{
  height:74px;
  overflow:auto;
  background:#ffffff12;
  border-radius:7px;
  padding:6px;
  font-size:12px;
}

.chatrow{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.chatrow input{
  flex:1;
  border:0;
  border-radius:6px;
  padding:9px;
}

.chatrow button{
  border:0;
  border-radius:6px;
  padding:8px 11px;
  background:#e67e22;
  color:white;
  font-weight:bold;
}

#mic.live{
  background:#c0392b;
  animation:pulse .8s infinite;
}
</style>
</head>

<body>

<!-- ================= SETUP ================= -->

<div id="setup" class="modal">

  <div id="main" class="box">
    <h1>🎲 Ludo Twist</h1>

    <button
      class="btn"
      onclick="showMenu('local')">
      Play Local (Offline)
    </button>

    <button
      class="btn green"
      onclick="showMenu('online')">
      Play Online Multiplayer
    </button>
  </div>

  <div
    id="local"
    class="box"
    style="display:none">

    <h2>Local Mode</h2>

    <button
      class="btn"
      onclick="startLocal(1)">
      1 Player vs Bot
    </button>

    <button
      class="btn"
      onclick="startLocal(2)">
      2 Players
    </button>

    <button
      class="btn"
      onclick="startLocal(3)">
      3 Players
    </button>

    <button
      class="btn"
      onclick="startLocal(4)">
      4 Players
    </button>

    <button
      class="btn gray"
      onclick="showMenu('main')">
      Back
    </button>
  </div>

  <div
    id="online"
    class="box"
    style="display:none">

    <h2>Online Match</h2>

    <button
      class="btn green"
      onclick="startOnline(2)">
      Public 2 Player
    </button>

    <button
      class="btn green"
      onclick="startOnline(3)">
      Public 3 Player
    </button>

    <button
      class="btn green"
      onclick="startOnline(4)">
      Public 4 Player
    </button>

    <button
      class="btn purple"
      onclick="showMenu('private')">
      Private Room
    </button>

    <button
      class="btn gray"
      onclick="showMenu('main')">
      Back
    </button>
  </div>

  <div
    id="private"
    class="box"
    style="display:none">

    <h2>Private Room</h2>

    <button
      class="btn green"
      onclick="createPrivate(2)">
      Create 2P
    </button>

    <button
      class="btn green"
      onclick="createPrivate(3)">
      Create 3P
    </button>

    <button
      class="btn green"
      onclick="createPrivate(4)">
      Create 4P
    </button>

    <p>— OR —</p>

    <input
      id="roomCode"
      placeholder="ROOM CODE"
      style="
        width:100%;
        padding:10px;
        text-align:center;
        text-transform:uppercase;
      "
    >

    <button
      class="btn purple"
      onclick="joinPrivate()">
      Join Room
    </button>

    <button
      class="btn gray"
      onclick="showMenu('online')">
      Back
    </button>

  </div>

</div>

<!-- ================= SETTINGS ================= -->

<div
  id="settings"
  class="modal hide">

  <div class="box">

    <h2>Settings</h2>

    <button
      id="soundButton"
      class="btn"
      onclick="toggleSound()">
      🔊 Sound: ON
    </button>

    <button
      class="btn red"
      onclick="toggleModal('settings')">
      Close
    </button>

  </div>
</div>

<!-- ================= HELP ================= -->

<div
  id="help"
  class="modal hide">

  <div class="box">

    <h2>How to Play</h2>

    <p>
      Roll the dice on your turn.
      A 4 or 8 gives an extra roll.
      Tap a glowing pawn to move it.
    </p>

    <p>
      Pawns move one square at a time
      with a sound effect.
    </p>

    <button
      class="btn red"
      onclick="toggleModal('help')">
      Close
    </button>

  </div>
</div>

<!-- ================= HEADER ================= -->

<div class="header">

  <h2>🎲 Ludo Twist</h2>

  <span
    id="badge"
    class="badge">
  </span>

  <button
    class="icon"
    onclick="toggleModal('settings')">
    ⚙️
  </button>

  <button
    class="icon"
    onclick="toggleModal('help')">
    ❓
  </button>

</div>

<div
  id="status"
  class="status">
</div>

<!-- ================= GAME ================= -->

<div
  id="game"
  class="game">

  <div
    id="panels"
    class="panels">
  </div>

  <div
    id="board"
    class="board">

    <div
      id="pawns"
      class="pawns">
    </div>

  </div>

  <!-- ================= CHAT ================= -->

  <div
    id="chat"
    class="chat">

    <div
      id="messages"
      class="messages">
    </div>

    <div class="chatrow">

      <input
        id="chatInput"
        placeholder="Type message..."
        onkeydown="
          if(event.key==='Enter')sendChat()
        "
      >

      <button
        onclick="sendChat()">
        Send
      </button>

      <button
        id="mic"
        onclick="toggleMic()">
        🎤
      </button>

    </div>

  </div>

</div>

<script>
"use strict";

const socket = io();

/* =====================================================
   GAME DATA
===================================================== */

const PATHS = [

  [
    10,15,20,21,22,
    23,24,19,14,9,
    4,3,2,1,0,
    5,6,7,8,13,
    18,17,16,11,12
  ],

  [
    2,1,0,5,10,
    15,20,21,22,23,
    24,19,14,9,4,
    3,8,13,18,17,
    16,11,6,7,12
  ],

  [
    14,9,4,3,2,
    1,0,5,10,15,
    20,21,22,23,24,
    19,18,17,16,11,
    6,7,8,13,12
  ],

  [
    22,23,24,19,14,
    9,4,3,2,1,
    0,5,10,15,20,
    21,16,11,6,7,
    8,13,18,17,12
  ]

];

const COLORS = [
  "#1e90ff",
  "#ff4757",
  "#2ed573",
  "#ffa502"
];

const NAMES = [
  "Blue",
  "Red",
  "Green",
  "Yellow"
];

const SAFE = [
  2,
  10,
  12,
  14,
  22
];

const DICE_VALUES = [
  1,1,
  2,2,
  3,3,
  4,8
];

/* =====================================================
   GAME VARIABLES
===================================================== */

let players = [];

let activePlayer = 0;

let rolls = [];

let canRoll = true;

let animating = false;

let online = false;

let myPlayerId = null;

let soundEnabled = true;

let audioContext = null;

let botTimer = null;

let gameVersion = 0;

let winRank = 1;

/* =====================================================
   PLAYER
===================================================== */

function createPlayer(id, bot=false){

  return {
    id:id,
    name:NAMES[id],
    color:COLORS[id],
    bot:bot,

    pawns:[
      0,0,0,0
    ],

    hasWon:false,
    rank:0
  };
}

/* =====================================================
   MENU
===================================================== */

function showMenu(id){

  [
    "main",
    "local",
    "online",
    "private"
  ].forEach(x => {

    document.getElementById(x).style.display =
      x === id ? "block" : "none";

  });
}

function toggleModal(id){

  document
    .getElementById(id)
    .classList.toggle("hide");
}

function toggleSound(){

  soundEnabled = !soundEnabled;

  document.getElementById(
    "soundButton"
  ).textContent =
    soundEnabled
      ? "🔊 Sound: ON"
      : "🔇 Sound: OFF";
}

/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

  }catch(e){

    console.log("Audio unavailable");

  }
}

function sound(
  frequency,
  duration=.07,
  type="square",
  volume=.06
){

  if(!soundEnabled)return;

  try{

    initAudio();

    if(!audioContext)return;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
      frequency;

    gain.gain.value = volume;

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + duration
    );

    oscillator.stop(
      audioContext.currentTime + duration
    );

  }catch(e){}
}

function diceSound(){

  sound(
    650,
    .08,
    "triangle",
    .06
  );

  setTimeout(
    () =>
      sound(
        430,
        .07,
        "triangle",
        .05
      ),
    70
  );
}

function pawnSound(step){

  sound(
    280 + step * 20,
    .065,
    "square",
    .065
  );
}

function captureSound(){

  sound(
    760,
    .12,
    "sawtooth",
    .07
  );
}

function winSound(){

  sound(
    700,
    .12,
    "triangle",
    .07
  );

  setTimeout(
    () =>
      sound(
        950,
        .2,
        "triangle",
        .08
      ),
    120
  );
}

/* =====================================================
   STATUS
===================================================== */

function setStatus(text,color){

  const element =
    document.getElementById("status");

  element.style.display = "block";

  element.textContent = text;

  if(color){
    element.style.color = color;
  }
}

/* =====================================================
   START LOCAL
===================================================== */

function startLocal(number){

  online = false;

  myPlayerId = 0;

  const list =
    number === 1

      ? [
          createPlayer(0,false),
          createPlayer(2,true)
        ]

      : Array.from(
          {length:number},
          (_,i) => createPlayer(i,false)
        );

  startGame(list);

  document.getElementById(
    "badge"
  ).textContent =
    "You are Blue";

  document.getElementById(
    "chat"
  ).style.display = "none";
}

/* =====================================================
   START ONLINE
===================================================== */

function startOnline(number){

  online = true;

  initAudio();

  document
    .getElementById("setup")
    .classList.add("hide");

  setStatus(
    "Searching for players..."
  );

  socket.emit(
    "joinGame",
    number
  );
}

/* =====================================================
   PRIVATE
===================================================== */

function createPrivate(number){

  online = true;

  initAudio();

  document
    .getElementById("setup")
    .classList.add("hide");

  setStatus(
    "Creating private room..."
  );

  socket.emit(
    "createPrivateGame",
    number
  );
}

function joinPrivate(){

  const code =
    document
      .getElementById("roomCode")
      .value
      .trim()
      .toUpperCase();

  if(!code){

    alert("Enter room code!");

    return;
  }

  online = true;

  initAudio();

  document
    .getElementById("setup")
    .classList.add("hide");

  setStatus(
    "Joining room..."
  );

  socket.emit(
    "joinPrivateGame",
    code
  );
}

/* =====================================================
   START GAME
===================================================== */

function startGame(list){

  gameVersion++;

  clearTimeout(botTimer);

  players = list;

  activePlayer = 0;

  rolls = [];

  canRoll = true;

  animating = false;

  winRank = 1;

  document
    .getElementById("setup")
    .classList.add("hide");

  document
    .getElementById("game")
    .style.display = "block";

  document
    .getElementById("badge")
    .style.display = "inline-block";

  setupPanels();

  setupBoard();

  render();

  updateStatus();

  initAudio();

  if(!online){

    botThink();

  }

}

/* =====================================================
   PANELS
===================================================== */

function setupPanels(){

  const container =
    document.getElementById(
      "panels"
    );

  container.innerHTML = "";

  for(let i=0;i<4;i++){

    const player =
      players.find(
        p => p.id === i
      );

    const panel =
      document.createElement("div");

    panel.className =
      "panel " +
      (player ? "" : "hidden");

    panel.id =
      "panel-" + i;

    if(player){

      panel.innerHTML = `
        <div class="name">
          ${player.name}
          ${player.bot ? " 🤖" : ""}
        </div>

        <button
          id="dice-${i}"
          class="dice disabled"
          onclick="rollDice(${i})">
          🎲
        </button>
      `;

    }

    container.appendChild(panel);

  }
}

/* =====================================================
   BOARD
===================================================== */

function setupBoard(){

  const board =
    document.getElementById(
      "board"
    );

  board
    .querySelectorAll(".cell")
    .forEach(
      x => x.remove()
    );

  const arrows = {
    10:"↓",
    22:"→",
    14:"↑",
    2:"←",
    11:"→",
    17:"↑",
    13:"←",
    7:"↓"
  };

  for(let i=0;i<25;i++){

    const cell =
      document.createElement("div");

    cell.className = "cell";

    if(i === 12){

      cell.classList.add("home");

      cell.textContent = "HOME";

    }

    else if(i === 10){

      cell.classList.add("blue");

    }

    else if(i === 2){

      cell.classList.add("redc");

    }

    else if(i === 14){

      cell.classList.add("greenc");

    }

    else if(i === 22){

      cell.classList.add("yellow");

    }

    if(
      arrows[i] &&
      i !== 12
    ){

      const arrow =
        document.createElement("span");

      arrow.className = "arrow";

      arrow.textContent =
        arrows[i];

      cell.appendChild(arrow);

    }

    board.insertBefore(
      cell,
      document.getElementById("pawns")
    );

  }

  const layer =
    document.getElementById(
      "pawns"
    );

  layer.innerHTML = "";

  for(let i=0;i<25;i++){

    const slot =
      document.createElement("div");

    slot.className = "slot";

    slot.id =
      "slot-" + i;

    layer.appendChild(slot);

  }
}

/* =====================================================
   VALID MOVE
===================================================== */

function validMove(
  player,
  pawnIndex,
  dice
){

  if(
    !player ||
    player.hasWon
  ){
    return false;
  }

  const current =
    player.pawns[pawnIndex];

  return (
    Number.isInteger(current) &&
    current + dice <= 24
  );
}

/* =====================================================
   RENDER
===================================================== */

function render(){

  for(let i=0;i<25;i++){

    const slot =
      document.getElementById(
        "slot-" + i
      );

    if(slot){
      slot.innerHTML = "";
    }

  }

  const current =
    players[activePlayer];

  players.forEach(player => {

    player.pawns.forEach(
      (step,pawnIndex) => {

        const cell =
          player.path[step];

        const slot =
          document.getElementById(
            "slot-" + cell
          );

        if(!slot)return;

        const pawn =
          document.createElement("div");

        pawn.className = "pawn";

        pawn.style.background =
          player.color;

        const myTurn =
          current &&
          current.id === player.id &&
          (
            (
              online &&
              myPlayerId === player.id
            ) ||
            (
              !online &&
              !player.bot
            )
          );

        const movable =
          myTurn &&
          !animating &&
          rolls.length > 0 &&
          validMove(
            player,
            pawnIndex,
            rolls[0]
          );

        if(movable){

          pawn.classList.add(
            "movable"
          );

          pawn.onclick = () =>
            requestMove(
              player.id,
              pawnIndex
            );

        }

        slot.appendChild(
          pawn
        );

      }
    );

  });

  updateDiceUI();
}

/* =====================================================
   DICE UI
===================================================== */

function updateDiceUI(){

  const current =
    players[activePlayer];

  for(let i=0;i<4;i++){

    const player =
      players.find(
        p => p.id === i
      );

    if(!player)continue;

    const panel =
      document.getElementById(
        "panel-" + i
      );

    const dice =
      document.getElementById(
        "dice-" + i
      );

    if(!panel || !dice)continue;

    panel.classList.toggle(
      "active",
      current &&
      current.id === i &&
      !player.hasWon
    );

    if(player.hasWon){

      dice.textContent =
        player.rank === 1
          ? "🥇"
          : "👑";

      dice.classList.add(
        "disabled"
      );

      continue;
    }

    dice.textContent = "🎲";

    dice.classList.add(
      "disabled"
    );

    const isMine =
      online
        ? current &&
          current.id === myPlayerId
        : current &&
          !current.bot;

    if(
      current &&
      current.id === i &&
      isMine &&
      canRoll &&
      !animating
    ){

      dice.classList.remove(
        "disabled"
      );

    }

  }
}

/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

  const player =
    players[activePlayer];

  if(!player)return;

  if(animating)return;

  if(rolls.length){

    setStatus(
      `${player.name}${
        player.bot ? " 🤖" : ""
      }: ${rolls.join(", ")} — ${
        canRoll
          ? "roll again or move"
          : "tap a glowing pawn"
      }`,
      player.color
    );

  }else{

    const mine =
      online
        ? player.id === myPlayerId
        : !player.bot;

    setStatus(
      mine
        ? "Your turn — roll the dice"
        : `${player.name}${
            player.bot ? " 🤖" : ""
          } is thinking...`,
      player.color
    );

  }
}

/* =====================================================
   ROLL
===================================================== */

function rollDice(playerId){

  const player =
    players[activePlayer];

  if(!player)return;

  if(
    player.id !== playerId ||
    player.hasWon ||
    animating ||
    !canRoll
  ){
    return;
  }

  if(
    online &&
    playerId !== myPlayerId
  ){
    return;
  }

  if(
    !online &&
    !player.bot
  ){
    // Human offline player is allowed.
  }

  canRoll = false;

  render();

  if(online){

    socket.emit(
      "requestRoll"
    );

    return;
  }

  const value =
    DICE_VALUES[
      Math.floor(
        Math.random() *
        DICE_VALUES.length
      )
    ];

  diceSound();

  applyRoll(
    playerId,
    value
  );
}

/* =====================================================
   APPLY ROLL
===================================================== */

function applyRoll(
  playerId,
  value
){

  const player =
    players[activePlayer];

  if(
    !player ||
    player.id !== playerId ||
    animating
  ){
    return;
  }

  rolls.push(value);

  canRoll =
    value === 4 ||
    value === 8;

  render();

  /*
   * Check whether ANY pawn can use
   * the current roll.
   */

  const hasMove =
    rolls.some(
      r =>
        player.pawns.some(
          (_,index) =>
            validMove(
              player,
              index,
              r
            )
        )
    );

  if(!hasMove){

    const blocked =
      rolls.shift();

    if(canRoll){

      setStatus(
        `${player.name}: ${blocked} blocked — extra roll!`,
        player.color
      );

      render();

      if(
        !online &&
        player.bot
      ){

        botTimer =
          setTimeout(
            botThink,
            600
          );

      }else{

        updateStatus();

      }

    }else{

      setStatus(
        `${player.name}: ${blocked} blocked — turn over`,
        player.color
      );

      render();

      setTimeout(
        () => finishTurn(player),
        700
      );

    }

    return;
  }

  render();

  updateStatus();

  if(!online){

    botThink();

  }

}

/* =====================================================
   REQUEST MOVE
===================================================== */

function requestMove(
  playerId,
  pawnIndex
){

  const player =
    players[activePlayer];

  if(!player)return;

  if(
    player.id !== playerId ||
    animating ||
    rolls.length === 0
  ){
    return;
  }

  if(
    !validMove(
      player,
      pawnIndex,
      rolls[0]
    )
  ){
    return;
  }

  if(
    online &&
    playerId !== myPlayerId
  ){
    return;
  }

  if(online){

    socket.emit(
      "requestMove",
      {
        pawnIndex
      }
    );

  }else{

    movePawn(
      playerId,
      pawnIndex
    );

  }
}

/* =====================================================
   MOVE PAWN
===================================================== */

function movePawn(
  playerId,
  pawnIndex
){

  const player =
    players[activePlayer];

  if(
    !player ||
    player.id !== playerId ||
    animating ||
    rolls.length === 0
  ){
    return;
  }

  const dice =
    rolls.shift();

  if(
    !validMove(
      player,
      pawnIndex,
      dice
    )
  ){

    rolls.unshift(dice);

    return;
  }

  animating = true;

  canRoll = false;

  const version =
    gameVersion;

  let moved = 0;

  setStatus(
    `${player.name} is moving...`,
    player.color
  );

  function step(){

    if(
      version !== gameVersion
    ){
      return;
    }

    if(moved < dice){

      player.pawns[pawnIndex]++;

      moved++;

      pawnSound(moved);

      render();

      setTimeout(
        step,
        160
      );

      return;
    }

    finishMovement(
      player
    );
  }

  step();
}

/* =====================================================
   FINISH MOVEMENT
===================================================== */

function finishMovement(player){

  const pawnIndex =
    findMovedPawn(player);

  /*
   * Find capture based on all pawns.
   */

  let captured = false;

  player.pawns.forEach(
    step => {

      const target =
        player.path[step];

      if(
        step < 24 &&
        !SAFE.includes(target)
      ){

        players.forEach(
          opponent => {

            if(
              opponent.id === player.id ||
              opponent.hasWon
            ){
              return;
            }

            opponent.pawns.forEach(
              (otherStep,index) => {

                if(
                  otherStep < 24 &&
                  opponent.path[otherStep] === target
                ){

                  opponent.pawns[index] = 0;

                  captured = true;

                }

              }
            );

          }
        );

      }

    }
  );

  if(captured){

    captureSound();

    canRoll = true;

  }

  /*
   * Check player completed all pawns.
   */

  if(
    player.pawns.every(
      x => x === 24
    ) &&
    !player.hasWon
  ){

    player.hasWon = true;

    player.rank = winRank++;

    winSound();

  }

  animating = false;

  render();

  /*
   * IMPORTANT TURN LOGIC
   */

  if(
    player.hasWon
  ){

    setTimeout(
      () => finishTurn(player),
      700
    );

    return;
  }

  /*
   * If another roll is already
   * waiting, keep the same turn.
   */

  if(rolls.length > 0){

    updateStatus();

    if(!online){
      botThink();
    }

    return;
  }

  /*
   * Capture or HOME gives extra turn.
   */

  if(captured){

    canRoll = true;

    updateStatus();

    if(!online){
      botThink();
    }

    return;
  }

  /*
   * Normal move ends turn.
   */

  finishTurn(player);
}

/* =====================================================
   FINISH TURN
===================================================== */

function finishTurn(player){

  if(animating)return;

  clearTimeout(botTimer);

  rolls = [];

  canRoll = true;

  animating = false;

  const remaining =
    players.filter(
      p => !p.hasWon
    );

  if(
    remaining.length <= 1
  ){

    render();

    setStatus(
      "🏆 Game finished!"
    );

    syncState();

    return;
  }

  /*
   * Move to next player.
   */

  let safety = 0;

  do{

    activePlayer =
      (activePlayer + 1) %
      players.length;

    safety++;

  }while(
    players[activePlayer].hasWon &&
    safety < players.length + 2
  );

  render();

  updateStatus();

  syncState();

  /*
   * Start bot automatically.
   */

  botThink();
}

/* =====================================================
   BOT
===================================================== */

function botThink(){

  if(online)return;

  clearTimeout(botTimer);

  const player =
    players[activePlayer];

  if(
    !player ||
    !player.bot ||
    player.hasWon ||
    animating
  ){
    return;
  }

  const version =
    gameVersion;

  botTimer =
    setTimeout(
      () => {

        if(
          version !== gameVersion ||
          players[activePlayer] !== player ||
          animating
        ){
          return;
        }

        /*
         * MOST IMPORTANT BOT FIX:
         *
         * If the bot already has a dice result,
         * it MUST try to move a pawn first.
         */

        if(rolls.length > 0){

          const dice =
            rolls[0];

          const possible = [];

          player.pawns.forEach(
            (_,index) => {

              if(
                validMove(
                  player,
                  index,
                  dice
                )
              ){

                possible.push(index);

              }

            }
          );

          if(possible.length > 0){

            const index =
              possible[
                Math.floor(
                  Math.random() *
                  possible.length
                )
              ];

            movePawn(
              player.id,
              index
            );

            return;
          }

          /*
           * No pawn can use this roll.
           */

          rolls.shift();

          if(canRoll){

            canRoll = true;

            render();

            botThink();

          }else{

            finishTurn(player);

          }

          return;
        }

        /*
         * No roll waiting.
         * Bot rolls.
         */

        if(canRoll){

          rollDice(
            player.id
          );

        }

      },
      650
    );
}

/* =====================================================
   STATE
===================================================== */

function snapshot(){

  return {

    activeIndex:
      activePlayer,

    rolls:
      [...rolls],

    canRoll:
      canRoll,

    players:
      players.map(
        p => ({
          id:p.id,
          pawns:[...p.pawns],
          hasWon:p.hasWon,
          rank:p.rank
        })
      )

  };
}

function syncState(){

  if(!online)return;

  socket.emit(
    "syncState",
    snapshot()
  );
}

/* =====================================================

socket.on(

/* =====================================================
   ONLINE MOVE
===================================================== */

socket.on(
  "executeMove",
  data => {

    if(!online)return;

    const player =
      players[activePlayer];

    if(
      !player ||
      player.id !== data.playerId
    ){
      return;
    }

    movePawn(
      data.playerId,
      data.pawnIndex
    );

  }
);

/* =====================================================
   FORCE SYNC
===================================================== */

socket.on(
  "forceSync",
  state => {

    if(!online)return;

    if(
      !state ||
      !Array.isArray(
        state.players
      )
    ){
      return;
    }

    activePlayer =
      state.activeIndex;

    rolls =
      state.rolls || [];

    canRoll =
      Boolean(
        state.canRoll
      );

    state.players.forEach(
      serverPlayer => {

        const local =
          players.find(
            p =>
              p.id ===
              serverPlayer.id
          );

        if(local){

          local.pawns =
            serverPlayer.pawns;

          local.hasWon =
            serverPlayer.hasWon;

          local.rank =
            serverPlayer.rank;

        }

      }
    );

    animating = false;

    render();

    updateStatus();

  }
);

/* =====================================================
   MICROPHONE / WEBRTC
===================================================== */

let microphoneStream = null;

const voicePeers = {};

async function toggleMic(){

  const button =
    document.getElementById(
      "mic"
    );

  /*
   * TURN OFF
   */

  if(microphoneStream){

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    microphoneStream = null;

    Object
      .values(voicePeers)
      .forEach(
        pc =>
          pc.close()
      );

    Object
      .keys(voicePeers)
      .forEach(
        id =>
          delete voicePeers[id]
      );

    button.classList.remove(
      "live"
    );

    button.textContent =
      "🎤";

    return;
  }

  /*
   * TURN ON
   */

  try{

    microphoneStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }

        });

    button.classList.add(
      "live"
    );

    button.textContent =
      "🔴";

    if(online){

      socket.emit(
        "voiceJoin"
      );

    }

  }catch(error){

    alert(
      "Microphone permission was denied. " +
      "Use the HTTPS Render address and allow microphone permission."
    );

    console.log(error);

  }
}

/* =====================================================
   CREATE WEBRTC PEER
===================================================== */

async function createVoicePeer(
  peerId,
  makeOffer
){

  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });

  voicePeers[peerId] =
    pc;

  /*
   * Add microphone track.
   */

  if(microphoneStream){

    microphoneStream
      .getTracks()
      .forEach(
        track =>
          pc.addTrack(
            track,
            microphoneStream
          )
      );

  }

  /*
   * ICE candidates.
   */

  pc.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        socket.emit(
          "voiceSignal",
          {
            to:peerId,

            data:{
              candidate:
                event.candidate
            }
          }
        );

      }

    };

  /*
   * Incoming audio.
   */

  pc.ontrack =
    event => {

      let audio =
        document.getElementById(
          "audio-" + peerId
        );

      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.id =
          "audio-" + peerId;

        audio.autoplay = true;

        audio.playsInline = true;

        document.body.appendChild(
          audio
        );

      }

      audio.srcObject =
        event.streams[0];

      audio.play().catch(
        () => {}
      );

    };

  pc.onconnectionstatechange =
    () => {

      if(
        [
          "failed",
          "closed",
          "disconnected"
        ].includes(
          pc.connectionState
        )
      ){

        pc.close();

        delete voicePeers[
          peerId
        ];

      }

    };

  /*
   * Create offer.
   */

  if(makeOffer){

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    socket.emit(
      "voiceSignal",
      {
        to:peerId,

        data:{
          description:
            pc.localDescription
        }
      }
    );

  }

}

/* =====================================================
   VOICE PEERS
===================================================== */

socket.on(
  "voicePeers",
  async ids => {

    if(!microphoneStream)return;

    for(
      const id of ids
    ){

      if(
        id === socket.id ||
        voicePeers[id]
      ){
        continue;
      }

      await createVoicePeer(
        id,
        true
      );

    }

  }
);

/* =====================================================
   VOICE SIGNAL
===================================================== */

socket.on(
  "voiceSignal",
  async message => {

    let pc =
      voicePeers[
        message.from
      ];

    if(!pc){

      await createVoicePeer(
        message.from,
        false
      );

      pc =
        voicePeers[
          message.from
        ];

    }

    try{

      const data =
        message.data;

      if(
        data.description
      ){

        if(
          data.description.type ===
          "offer"
        ){

          await pc.setRemoteDescription(
            data.description
          );

          const answer =
            await pc.createAnswer();

          await pc.setLocalDescription(
            answer
          );

          socket.emit(
            "voiceSignal",
            {
              to:message.from,

              data:{
                description:
                  pc.localDescription
              }
            }
          );

        }

        else if(
          data.description.type ===
          "answer"
        ){

          await pc.setRemoteDescription(
            data.description
          );

        }

      }

      if(
        data.candidate
      ){

        await pc.addIceCandidate(
          data.candidate
        );

      }

    }catch(error){

      console.log(
        "Voice error:",
        error
      );

    }

  }
);
