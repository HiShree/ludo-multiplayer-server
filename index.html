<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Ludo Twist - Multiplayer Fixed</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 10px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

.header {
    width: 100%;
    max-width: 430px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
}

.header h2 {
    margin: 0;
}

.header-right {
    display: flex;
    gap: 6px;
    align-items: center;
}

button {
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
}

.icon-btn {
    width: 42px;
    height: 38px;
    border-radius: 20px;
    background: #34495e;
    color: white;
    font-size: 18px;
}

#identity {
    display: none;
    background: #2ecc71;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

#status {
    width: 100%;
    max-width: 430px;
    min-height: 34px;
    display: none;
    margin: 5px 0;
    padding: 8px 12px;
    background: rgba(255,255,255,.95);
    color: #222;
    border-radius: 20px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

.screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.85);
    padding: 15px;
}

.box {
    width: 90%;
    max-width: 340px;
    background: white;
    color: #222;
    padding: 22px;
    border-radius: 16px;
    text-align: center;
}

.box h1,
.box h2 {
    margin-top: 0;
}

.menu-btn {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border-radius: 9px;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.blue {
    background: #1e90ff;
}

.green {
    background: #2ecc71;
}

.purple {
    background: #9b59b6;
}

.red {
    background: #e74c3c;
}

.gray {
    background: #7f8c8d;
}

.orange {
    background: #e67e22;
}

#localMenu,
#onlineMenu,
#privateMenu {
    display: none;
}

.room-input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    text-align: center;
    font-weight: bold;
    text-transform: uppercase;
}

.game {
    width: 100%;
    max-width: 430px;
    display: none;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin: 5px 0 8px;
}

.player-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    border-radius: 9px;
    border: 3px solid transparent;
    opacity: .5;
    transition: .15s;
    overflow: hidden;
}

.player-panel.active {
    opacity: 1;
    border-color: #ffd700;
    transform: scale(1.02);
}

.player-info {
    flex: 1;
    height: 100%;
    padding-left: 7px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: bold;
}

.pawn-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid white;
}

.dice {
    width: 52px;
    height: 48px;
    background: white;
    color: #111;
    font-size: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.dice.disabled {
    opacity: .5;
    pointer-events: none;
}

.board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    padding: 6px;
    background: #263238;
    border-radius: 13px;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);
    gap: 3px;
    box-shadow: 0 10px 25px rgba(0,0,0,.4);
}

.cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ecf0f1;
    border-radius: 5px;
}

.start-blue {
    background: #0984e3;
}

.start-red {
    background: #d63031;
}

.start-green {
    background: #00b894;
}

.start-yellow {
    background: #fdcb6e;
}

.home {
    background: #8e44ad;
    color: white;
    font-weight: bold;
    font-size: 12px;
}

.arrow {
    position: absolute;
    color: rgba(0,0,0,.35);
    font-size: 23px;
    font-weight: bold;
    pointer-events: none;
}

.pawn-layer {
    position: absolute;
    inset: 6px;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    grid-template-rows: repeat(5,1fr);
    pointer-events: none;
    z-index: 10;
}

.pawn-slot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    align-content: center;
    gap: 2px;
    pointer-events: auto;
}

.pawn {
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.9);
    box-shadow: 2px 3px 5px rgba(0,0,0,.45);
    transition: transform .08s linear;
}

.pawn.clickable {
    cursor: pointer;
    animation: glow .8s infinite;
}

@keyframes glow {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}

.communication {
    width: 100%;
    max-width: 430px;
    margin-top: 8px;
    padding: 8px;
    display: none;
    background: rgba(0,0,0,.25);
    border-radius: 10px;
}

.chat {
    height: 70px;
    overflow-y: auto;
    padding: 5px;
    background: rgba(255,255,255,.1);
    border-radius: 6px;
    font-size: 12px;
}

.chat-row {
    display: flex;
    gap: 4px;
    margin-top: 5px;
}

.chat-row input {
    min-width: 0;
    flex: 1;
    border: 0;
    border-radius: 5px;
    padding: 8px;
}

.chat-row button {
    padding: 7px 9px;
    border-radius: 5px;
    color: white;
    background: #e67e22;
    font-weight: bold;
}

.mic-live {
    background: #c0392b !important;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="setupScreen" class="screen">

    <div id="mainMenu" class="box">
        <h1>🎲 Ludo Twist</h1>

        <button class="menu-btn blue"
                onclick="showLocalMenu()">
            Play Local
        </button>

        <button class="menu-btn green"
                onclick="showOnlineMenu()">
            Online Multiplayer
        </button>
    </div>

    <div id="localMenu" class="box">
        <h2>Local Game</h2>

        <button class="menu-btn blue"
                onclick="startLocal(1)">
            1 Player vs Bot
        </button>

        <button class="menu-btn blue"
                onclick="startLocal(2)">
            2 Players
        </button>

        <button class="menu-btn blue"
                onclick="startLocal(3)">
            3 Players
        </button>

        <button class="menu-btn blue"
                onclick="startLocal(4)">
            4 Players
        </button>

        <button class="menu-btn gray"
                onclick="backMain()">
            Back
        </button>
    </div>

    <div id="onlineMenu" class="box">
        <h2>Online Game</h2>

        <button class="menu-btn green"
                onclick="startOnline(2)">
            Public 2 Player
        </button>

        <button class="menu-btn green"
                onclick="startOnline(3)">
            Public 3 Player
        </button>

        <button class="menu-btn green"
                onclick="startOnline(4)">
            Public 4 Player
        </button>

        <hr>

        <button class="menu-btn purple"
                onclick="showPrivateMenu()">
            Private Room
        </button>

        <button class="menu-btn gray"
                onclick="backMain()">
            Back
        </button>
    </div>

    <div id="privateMenu" class="box">
        <h2>Private Room</h2>

        <button class="menu-btn green"
                onclick="createPrivate(2)">
            Create 2 Player Room
        </button>

        <button class="menu-btn green"
                onclick="createPrivate(3)">
            Create 3 Player Room
        </button>

        <button class="menu-btn green"
                onclick="createPrivate(4)">
            Create 4 Player Room
        </button>

        <p><b>OR</b></p>

        <input
            id="roomCode"
            class="room-input"
            maxlength="8"
            placeholder="ROOM CODE">

        <button class="menu-btn purple"
                onclick="joinPrivate()">
            Join Room
        </button>

        <button class="menu-btn gray"
                onclick="showOnlineMenu()">
            Back
        </button>
    </div>

</div>

<!-- ================= SETTINGS ================= -->

<div id="settingsScreen" class="screen hidden">
    <div class="box">
        <h2>⚙️ Settings</h2>

        <button id="soundButton"
                class="menu-btn blue"
                onclick="toggleSound()">
            🔊 Sound ON
        </button>

        <button class="menu-btn red"
                onclick="closeSettings()">
            Close
        </button>
    </div>
</div>

<!-- ================= HELP ================= -->

<div id="helpScreen" class="screen hidden">
    <div class="box">
        <h2>❓ How To Play</h2>

        <p>
            Roll the glowing dice on your turn.
        </p>

        <p>
            Tap a glowing pawn to move it.
        </p>

        <p>
            Rolling <b>4</b> or <b>8</b> gives an extra turn.
        </p>

        <p>
            Capture an opponent to get an extra turn.
        </p>

        <button class="menu-btn red"
                onclick="closeHelp()">
            Close
        </button>
    </div>
</div>

<!-- ================= HEADER ================= -->

<div class="header">

    <h2>🎲 Ludo Twist</h2>

    <span id="identity"></span>

    <div class="header-right">

        <button class="icon-btn"
                onclick="toggleSettings()">
            ⚙️
        </button>

        <button class="icon-btn"
                onclick="toggleHelp()">
            ❓
        </button>

    </div>
</div>

<div id="status"></div>

<!-- ================= GAME ================= -->

<div id="game" class="game">

    <div id="players" class="players"></div>

    <div id="board" class="board">
        <div id="pawnLayer" class="pawn-layer"></div>
    </div>

</div>

<!-- ================= CHAT / MIC ================= -->

<div id="communication" class="communication">

    <div id="chat"
         class="chat"></div>

    <div class="chat-row">

        <input
            id="chatInput"
            type="text"
            placeholder="Type message..."
            onkeydown="if(event.key==='Enter') sendChat()">

        <button onclick="sendChat()">
            Send
        </button>

        <button id="micButton"
                onclick="toggleMic()">
            🎤
        </button>

    </div>

</div>

<script>

/* =========================================================
   SOCKET
========================================================= */

const socket = io({
    transports: ["websocket", "polling"]
});


/* =========================================================
   CONSTANTS
========================================================= */

const TOTAL_SPACES = 25;
const HOME_SPACE = 12;

const ROLLS = [1,1,2,2,3,3,4,8];

const START_CELLS = {
    0: 10,
    1: 2,
    2: 14,
    3: 22
};

const COLORS = {
    0: "#0984e3",
    1: "#d63031",
    2: "#00b894",
    3: "#fdcb6e"
};

const NAMES = {
    0: "Blue",
    1: "Red",
    2: "Green",
    3: "Yellow"
};

const ARROWS = {
    10: "↓",
    22: "→",
    14: "↑",
    2: "←",
    11: "→",
    17: "↑",
    13: "←",
    7: "↓"
};


/* =========================================================
   PLAYER PATHS
========================================================= */

const PATHS = [

    [
        10,15,20,21,22,
        23,24,19,14,9,
        4,3,2,1,0,
        5,6,7,8,13,
        18,17,16,11,12
    ],

    [
        2,1,0,5,10,
        15,20,21,22,23,
        24,19,14,9,4,
        3,8,13,18,17,
        16,11,6,7,12
    ],

    [
        14,9,4,3,2,
        1,0,5,10,15,
        20,21,22,23,24,
        19,18,17,16,11,
        6,7,8,13,12
    ],

    [
        22,23,24,19,14,
        9,4,3,2,1,
        0,5,10,15,20,
        21,16,11,6,7,
        8,13,18,17,12
    ]

];


/* =========================================================
   GAME STATE
========================================================= */

let isOnline = false;

let myPlayerId = null;

let activePlayers = [];

let activeIndex = 0;

let activeRolls = [];

let canRoll = true;

let isAnimating = false;

let soundEnabled = true;

let winRank = 1;


/*
IMPORTANT:
These variables stop duplicate socket events
from moving the game twice.
*/

let processedRollEvents = new Set();

let processedMoveEvents = new Set();

let lastMoveTime = 0;


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

function ensureAudio() {

    if (!audioCtx) {

        audioCtx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }

    if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(()=>{});
    }

}


/*
One sound is generated for every actual pawn step.
Therefore the sound happens exactly when the pawn moves.
*/

function playStepSound() {

    if (!soundEnabled) return;

    ensureAudio();

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(420, now);

    osc.frequency.exponentialRampToValueAtTime(
        700,
        now + 0.055
    );

    gain.gain.setValueAtTime(.16, now);

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + .075
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start(now);

    osc.stop(now + .08);
}


function playDiceSound() {

    if (!soundEnabled) return;

    ensureAudio();

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(180, now);

    osc.frequency.exponentialRampToValueAtTime(
        500,
        now + .08
    );

    gain.gain.setValueAtTime(.1, now);

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + .12
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start(now);

    osc.stop(now + .13);
}


/* =========================================================
   MENU
========================================================= */

function showLocalMenu() {

    mainMenu.style.display = "none";

    localMenu.style.display = "block";

}


function showOnlineMenu() {

    mainMenu.style.display = "none";

    localMenu.style.display = "none";

    privateMenu.style.display = "none";

    onlineMenu.style.display = "block";

}


function showPrivateMenu() {

    onlineMenu.style.display = "none";

    privateMenu.style.display = "block";

}


function backMain() {

    localMenu.style.display = "none";

    onlineMenu.style.display = "none";

    privateMenu.style.display = "none";

    mainMenu.style.display = "block";

}


/* =========================================================
   SETTINGS
========================================================= */

function toggleSettings() {

    settingsScreen.classList.toggle("hidden");

}

function closeSettings() {

    settingsScreen.classList.add("hidden");

}

function toggleHelp() {

    helpScreen.classList.toggle("hidden");

}

function closeHelp() {

    helpScreen.classList.add("hidden");

}

function toggleSound() {

    soundEnabled = !soundEnabled;

    soundButton.innerText =
        soundEnabled
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";

}


/* =========================================================
   LOCAL GAME
========================================================= */

function startLocal(number) {

    ensureAudio();

    isOnline = false;

    myPlayerId = 0;

    setupScreen.style.display = "none";

    game.style.display = "block";

    status.style.display = "block";

    communication.style.display = "block";

    activePlayers = [];

    for (let i = 0; i < number; i++) {

        activePlayers.push(
            createPlayer(i, false)
        );

    }

    if (number === 1) {

        activePlayers = [
            createPlayer(0, false),
            createPlayer(2, true)
        ];

    }

    activeIndex = 0;

    activeRolls = [];

    canRoll = true;

    isAnimating = false;

    winRank = 1;

    identity.style.display = "block";

    identity.innerText = "You are Blue";

    buildBoard();

    render();

    processTurn();

}


/* =========================================================
   ONLINE GAME
========================================================= */

function startOnline(number) {

    ensureAudio();

    isOnline = true;

    setupScreen.style.display = "none";

    status.style.display = "block";

    status.innerText = "Connecting to matchmaking...";

    socket.emit("joinGame", number);

}


function createPrivate(number) {

    ensureAudio();

    isOnline = true;

    setupScreen.style.display = "none";

    status.style.display = "block";

    status.innerText = "Creating private room...";

    socket.emit(
        "createPrivateGame",
        number
    );

}


function joinPrivate() {

    const code =
        roomCode.value.trim().toUpperCase();

    if (!code) {

        alert("Enter room code.");

        return;

    }

    ensureAudio();

    isOnline = true;

    setupScreen.style.display = "none";

    status.style.display = "block";

    status.innerText = "Joining room...";

    socket.emit(
        "joinPrivateGame",
        code
    );

}


/* =========================================================
   PLAYER OBJECT
========================================================= */

function createPlayer(id, bot) {

    return {

        id: id,

        name: bot
            ? NAMES[id] + " (Bot)"
            : NAMES[id],

        color: COLORS[id],

        path: PATHS[id],

        pawns: [0,0,0,0],

        hasKilled: false,

        hasWon: false,

        winRank: 0,

        isBot: bot

    };

}


/* =========================================================
   SOCKET - PLAYER ASSIGNMENT
========================================================= */

socket.on("assignPlayer", id => {

    myPlayerId = Number(id);

    identity.style.display = "block";

    identity.innerText =
        "You are " + NAMES[myPlayerId];

    communication.style.display = "block";

});


/* =========================================================
   SOCKET - GAME START
========================================================= */

socket.on("gameStart", ids => {

    /*
    Never overwrite our player object with stale data.
    */

    activePlayers =
        ids.map(id =>
            createPlayer(Number(id), false)
        );

    activeIndex = 0;

    activeRolls = [];

    canRoll = true;

    isAnimating = false;

    winRank = 1;

    game.style.display = "block";

    status.style.display = "block";

    communication.style.display = "block";

    buildBoard();

    render();

    processTurn();

});


/* =========================================================
   SOCKET - SYSTEM MESSAGE
========================================================= */

socket.on("systemMessage", msg => {

    status.innerText = msg;

});


socket.on("privateRoomCreated", code => {

    status.innerText =
        "Room Code: " + code;

});


socket.on("roomError", msg => {

    alert(msg);

    setupScreen.style.display = "flex";

});


/* =========================================================
   BOARD
========================================================= */

function buildBoard() {

    board.innerHTML = "";

    for (let i = 0; i < TOTAL_SPACES; i++) {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        if (i === HOME_SPACE) {

            cell.classList.add("home");

            cell.innerText = "HOME";

        }

        if (i === 10)
            cell.classList.add("start-blue");

        if (i === 2)
            cell.classList.add("start-red");

        if (i === 14)
            cell.classList.add("start-green");

        if (i === 22)
            cell.classList.add("start-yellow");

        if (ARROWS[i] && i !== HOME_SPACE) {

            const arrow =
                document.createElement("div");

            arrow.className = "arrow";

            arrow.innerText = ARROWS[i];

            cell.appendChild(arrow);

        }

        board.appendChild(cell);

    }

    const layer =
        document.createElement("div");

    layer.id = "pawnLayer";

    layer.className = "pawn-layer";

    board.appendChild(layer);

}


/* =========================================================
   PLAYER PANELS
========================================================= */

function buildPanels() {

    players.innerHTML = "";

    activePlayers.forEach(player => {

        const panel =
            document.createElement("div");

        panel.className = "player-panel";

        panel.id =
            "panel-" + player.id;

        panel.innerHTML = `
            <div class="player-info">
                <div class="pawn-icon"
                     style="background:${player.color}">
                </div>

                <span>
                    ${player.name}
                </span>
            </div>

            <button
                class="dice disabled"
                id="dice-${player.id}">
                🎲
            </button>
        `;

        const dice =
            panel.querySelector(".dice");

        dice.addEventListener(
            "click",
            () => requestRoll(player.id)
        );

        players.appendChild(panel);

    });

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    buildPanels();

    const layer =
        document.getElementById("pawnLayer");

    if (!layer) return;

    layer.innerHTML = "";

    for (let i = 0; i < TOTAL_SPACES; i++) {

        const slot =
            document.createElement("div");

        slot.className = "pawn-slot";

        slot.id =
            "pawn-slot-" + i;

        layer.appendChild(slot);

    }

    activePlayers.forEach(player => {

        player.pawns.forEach(
            (step, pawnIndex) => {

                const grid =
                    player.path[step];

                const slot =
                    document.getElementById(
                        "pawn-slot-" + grid
                    );

                if (!slot) return;

                const pawn =
                    document.createElement("div");

                pawn.className = "pawn";

                pawn.style.background =
                    player.color;

                const current =
                    activePlayers[activeIndex];

                const isMyTurn =
                    current &&
                    current.id === myPlayerId;

                const canMove =
                    isMyTurn &&
                    player.id === current.id &&
                    activeRolls.length > 0 &&
                    !isAnimating &&
                    canMovePawn(
                        player,
                        step,
                        activeRolls[0]
                    );

                if (canMove) {

                    pawn.classList.add("clickable");

                    pawn.addEventListener(
                        "click",
                        e => {

                            e.stopPropagation();

                            requestMove(
                                player.id,
                                pawnIndex
                            );

                        }
                    );

                }

                slot.appendChild(pawn);

            }
        );

    });

    updatePanels();

}


/* =========================================================
   PANEL UPDATE
========================================================= */

function updatePanels() {

    activePlayers.forEach(player => {

        const panel =
            document.getElementById(
                "panel-" + player.id
            );

        const dice =
            document.getElementById(
                "dice-" + player.id
            );

        if (!panel || !dice) return;

        panel.classList.remove("active");

        dice.classList.add("disabled");

        if (player.hasWon) {

            dice.innerText =
                player.winRank === 1
                ? "🥇"
                : "👑";

            return;

        }

        dice.innerText =
            activeRolls.length > 0
            ? activeRolls[0]
            : "🎲";

        const current =
            activePlayers[activeIndex];

        if (!current) return;

        if (current.id === player.id) {

            panel.classList.add("active");

            const myTurn =
                !isOnline ||
                player.id === myPlayerId;

            if (
                myTurn &&
                canRoll &&
                !isAnimating &&
                activeRolls.length === 0
            ) {

                dice.classList.remove("disabled");

            }

        }

    });

}


/* =========================================================
   MOVE VALIDATION
========================================================= */

function canMovePawn(player, step, roll) {

    if (player.hasKilled) {

        return step + roll <= 24;

    }

    return step + roll <= 15;

}


/* =========================================================
   REQUEST ROLL
========================================================= */

function requestRoll(playerId) {

    if (isAnimating) return;

    const current =
        activePlayers[activeIndex];

    if (!current) return;

    if (current.id !== playerId) return;

    if (isOnline && playerId !== myPlayerId)
        return;

    if (!canRoll) return;

    /*
    Do not allow another roll while a roll
    is already waiting for a pawn.
    */

    if (activeRolls.length > 0)
        return;

    canRoll = false;

    updatePanels();

    const roll =
        ROLLS[
            Math.floor(
                Math.random() * ROLLS.length
            )
        ];

    if (isOnline) {

        socket.emit(
            "requestRoll",
            {
                playerId: myPlayerId,
                rollValue: roll
            }
        );

    } else {

        handleRoll(
            playerId,
            roll
        );

    }

}


/* =========================================================
   INCOMING ROLL
========================================================= */

socket.on("executeRoll", data => {

    handleRoll(
        Number(data.playerId),
        Number(data.rollValue)
    );

});


function handleRoll(playerId, roll) {

    const current =
        activePlayers[activeIndex];

    if (!current) return;

    /*
    Critical multiplayer protection:
    a roll is accepted only from the player
    whose turn it currently is.
    */

    if (current.id !== playerId)
        return;

    /*
    Never accept a second roll while one
    is waiting to be played.
    */

    if (activeRolls.length > 0)
        return;

    activeRolls.push(roll);

    playDiceSound();

    /*
    4 and 8 grant another roll,
    but the pawn must still be moved first.
    */

    canRoll =
        roll === 4 ||
        roll === 8;

    processTurn();

}


/* =========================================================
   PROCESS TURN
========================================================= */

function processTurn(message = "") {

    const current =
        activePlayers[activeIndex];

    if (!current) return;

    /*
    If the roll cannot be used,
    remove it and end the turn.
    */

    while (activeRolls.length > 0) {

        const roll =
            activeRolls[0];

        const valid =
            current.pawns.some(
                step =>
                    canMovePawn(
                        current,
                        step,
                        roll
                    )
            );

        if (valid) break;

        activeRolls.shift();

        canRoll = false;

        message +=
            ` ${roll} blocked.`;

    }

    if (
        activeRolls.length === 0 &&
        !canRoll
    ) {

        finishTurnAfterDelay(
            message || "Turn over!"
        );

        return;

    }

    render();

    const myTurn =
        !isOnline ||
        current.id === myPlayerId;

    if (activeRolls.length > 0) {

        status.innerText =
            message +
            (
                myTurn
                ? " Tap a glowing pawn."
                : ` ${current.name} is moving...`
            );

    } else {

        status.innerText =
            message +
            (
                myTurn
                ? " Your turn — roll!"
                : ` ${current.name}'s turn...`
            );

    }

    /*
    BOT
    */

    if (
        !isOnline &&
        current.isBot &&
        !isAnimating
    ) {

        botTurn();

    }

}


/* =========================================================
   BOT
========================================================= */

function botTurn() {

    const current =
        activePlayers[activeIndex];

    if (!current || !current.isBot)
        return;

    if (
        canRoll &&
        activeRolls.length === 0
    ) {

        setTimeout(() => {

            const roll =
                ROLLS[
                    Math.floor(
                        Math.random() *
                        ROLLS.length
                    )
                ];

            handleRoll(
                current.id,
                roll
            );

        }, 600);

        return;

    }

    if (activeRolls.length > 0) {

        const roll =
            activeRolls[0];

        const possible = [];

        current.pawns.forEach(
            (step, index) => {

                if (
                    canMovePawn(
                        current,
                        step,
                        roll
                    )
                ) {

                    possible.push(index);

                }

            }
        );

        if (possible.length > 0) {

            const pawnIndex =
                possible[
                    Math.floor(
                        Math.random() *
                        possible.length
                    )
                ];

            setTimeout(() => {

                executeMove(
                    current.id,
                    pawnIndex
                );

            }, 500);

        }

    }

}


/* =========================================================
   REQUEST MOVE
========================================================= */

function requestMove(playerId, pawnIndex) {

    if (isAnimating) return;

    const current =
        activePlayers[activeIndex];

    if (!current) return;

    if (current.id !== playerId)
        return;

    if (isOnline &&
        playerId !== myPlayerId)
        return;

    if (activeRolls.length === 0)
        return;

    const roll =
        activeRolls[0];

    const player =
        activePlayers.find(
            p => p.id === playerId
        );

    if (!player) return;

    if (
        !canMovePawn(
            player,
            player.pawns[pawnIndex],
            roll
        )
    ) return;

    /*
    Immediately lock the UI.
    */

    isAnimating = true;

    render();

    if (isOnline) {

        socket.emit(
            "requestMove",
            {
                playerId: myPlayerId,
                pawnIndex: pawnIndex
            }
        );

    } else {

        executeMove(
            playerId,
            pawnIndex
        );

    }

}


/* =========================================================
   INCOMING MOVE
========================================================= */

socket.on("executeMove", data => {

    const playerId =
        Number(data.playerId);

    const pawnIndex =
        Number(data.pawnIndex);

    /*
    Critical:
    Ignore a second executeMove while
    the first one is still animating.
    */

    if (isAnimating)
        return;

    executeMove(
        playerId,
        pawnIndex
    );

});


/* =========================================================
   EXECUTE MOVE
========================================================= */

function executeMove(
    playerId,
    pawnIndex
) {

    const current =
        activePlayers[activeIndex];

    if (!current) return;

    if (current.id !== playerId)
        return;

    if (activeRolls.length === 0)
        return;

    const player =
        activePlayers.find(
            p => p.id === playerId
        );

    if (!player) return;

    if (
        pawnIndex < 0 ||
        pawnIndex >= player.pawns.length
    ) return;

    const roll =
        activeRolls.shift();

    if (
        !canMovePawn(
            player,
            player.pawns[pawnIndex],
            roll
        )
    ) {

        isAnimating = false;

        processTurn();

        return;

    }

    isAnimating = true;

    render();

    animatePawn(
        player,
        pawnIndex,
        roll
    );

}


/* =========================================================
   PAWN ANIMATION
========================================================= */

function animatePawn(
    player,
    pawnIndex,
    amount
) {

    let steps = 0;

    function nextStep() {

        if (steps >= amount) {

            finishMove(
                player,
                pawnIndex
            );

            return;

        }

        if (player.pawns[pawnIndex] >= 24) {

            finishMove(
                player,
                pawnIndex
            );

            return;

        }

        player.pawns[pawnIndex]++;

        steps++;

        /*
        Sound is called immediately after
        the pawn's logical position changes.
        This keeps movement and sound together.
        */

        playStepSound();

        render();

        setTimeout(
            nextStep,
            120
        );

    }

    nextStep();

}


/* =========================================================
   FINISH MOVE
========================================================= */

function finishMove(
    player,
    pawnIndex
) {

    const grid =
        player.path[
            player.pawns[pawnIndex]
        ];

    let extraTurn = false;

    /*
    HOME
    */

    if (player.pawns[pawnIndex] === 24) {

        if (
            player.pawns.every(
                p => p === 24
            )
        ) {

            player.hasWon = true;

            player.winRank = winRank++;

            extraTurn = false;

            isAnimating = false;

            activeRolls = [];

            canRoll = false;

            render();

            status.innerText =
                `${player.name} finished!`;

            setTimeout(
                advanceTurn,
                1200
            );

            return;

        }

        extraTurn = true;

        status.innerText =
            "Pawn reached HOME! Extra turn!";

    }


    /*
    CAPTURE
    */

    const safe =
        [2,10,14,22,12]
        .includes(grid);

    let captured = [];

    if (!safe) {

        activePlayers.forEach(
            opponent => {

                if (
                    opponent.id === player.id ||
                    opponent.hasWon
                ) return;

                opponent.pawns.forEach(
                    (step, index) => {

                        if (
                            step < 24 &&
                            opponent.path[step] === grid
                        ) {

                            captured.push({
                                player:
                                    opponent,
                                index:
                                    index
                            });

                        }

                    }
                );

            }
        );

    }


    if (captured.length > 0) {

        player.hasKilled = true;

        extraTurn = true;

        /*
        Send captured pawns back.
        */

        captured.forEach(
            target => {

                target.player.pawns[
                    target.index
                ] = 0;

            }
        );

        status.innerText =
            "Captured! Extra turn!";

    }


    isAnimating = false;

    /*
    If the roll was 4 or 8,
    or capture/home gave an extra turn,
    allow another roll.
    */

    if (extraTurn || canRoll) {

        canRoll = true;

    } else {

        canRoll = false;

    }

    render();

    /*
    If there are no remaining rolls,
    determine whether to continue
    or advance.
    */

    if (activeRolls.length === 0) {

        if (canRoll) {

            processTurn();

        } else {

            finishTurnAfterDelay(
                status.innerText
            );

        }

    } else {

        processTurn();

    }

}


/* =========================================================
   TURN ADVANCEMENT
========================================================= */

function finishTurnAfterDelay(message) {

    if (isAnimating)
        return;

    isAnimating = true;

    status.innerText =
        message || "Turn over!";

    /*
    Only the current online player
    advances the turn.

    This is very important.
    Without this, every client can advance
    the turn independently and turns appear
    to jump/hang.
    */

    const current =
        activePlayers[activeIndex];

    const mayAdvance =
        !isOnline ||
        (
            current &&
            current.id === myPlayerId
        );

    setTimeout(() => {

        if (mayAdvance) {

            advanceTurn();

        }

    }, 900);

}


function advanceTurn() {

    if (!activePlayers.length)
        return;

    activeRolls = [];

    canRoll = true;

    isAnimating = false;

    let attempts = 0;

    do {

        activeIndex =
            (
                activeIndex + 1
            ) %
            activePlayers.length;

        attempts++;

        if (attempts >
            activePlayers.length)
            break;

    } while (
        activePlayers[activeIndex].hasWon
    );

    render();

    processTurn();

    /*
    Tell other clients what the current
    state is.

    */

    if (isOnline) {

        sendSync();

    }

}


/* =========================================================
   SYNC
========================================================= */

function sendSync() {

    if (!isOnline)
        return;

    socket.emit(
        "syncState",
        {
            activeIndex:
                activeIndex,

            activeRolls:
                [...activeRolls],

            canRoll:
                canRoll,

            players:
                activePlayers.map(
                    p => ({
                        id: p.id,
                        pawns: [...p.pawns],
                        hasKilled:
                            p.hasKilled,
                        hasWon:
                            p.hasWon,
                        winRank:
                            p.winRank
                    })
                )
        }
    );

}


/* =========================================================
   SERVER FORCE SYNC
========================================================= */

socket.on("forceSync", state => {

    if (!isOnline)
        return;

    if (!state)
        return;

    /*
    Ignore synchronization while a pawn is
    physically animating.

    Otherwise the server packet can overwrite
    the pawn halfway through the animation.
    */

    if (isAnimating)
        return;

    if (
        typeof state.activeIndex !== "number"
    ) return;

    if (!Array.isArray(state.players))
        return;

    activeIndex =
        state.activeIndex;

    activeRolls =
        Array.isArray(state.activeRolls)
        ? [...state.activeRolls]
        : [];

    canRoll =
        !!state.canRoll;

    state.players.forEach(
        serverPlayer => {

            const local =
                activePlayers.find(
                    p =>
                        p.id ===
                        serverPlayer.id
                );

            if (!local) return;

            if (
                Array.isArray(
                    serverPlayer.pawns
                )
            ) {

                local.pawns =
                    [...serverPlayer.pawns];

            }

            local.hasKilled =
                !!serverPlayer.hasKilled;

            local.hasWon =
                !!serverPlayer.hasWon;

            local.winRank =
                serverPlayer.winRank || 0;

        }
    );

    render();

    processTurn();

});


/* =========================================================
   CHAT
========================================================= */

function sendChat() {

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    const player =
        activePlayers.find(
            p => p.id === myPlayerId
        );

    const name =
        player
        ? player.name
        : "Player";

    if (isOnline) {

        socket.emit(
            "sendChatMessage",
            {
                name: name,
                text: text
            }
        );

    } else {

        appendChat(
            name,
            text
        );

    }

    input.value = "";

}


socket.on(
    "receiveChatMessage",
    data => {

        appendChat(
            data.name,
            data.text
        );

    }
);


function appendChat(name,text) {

    const box =
        document.getElementById(
            "chat"
        );

    const div =
        document.createElement("div");

    /*
    textContent prevents chat HTML
    from being interpreted as HTML.
    */

    const bold =
        document.createElement("b");

    bold.textContent =
        name + ": ";

    div.appendChild(bold);

    div.appendChild(
        document.createTextNode(text)
    );

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;

}


/* =========================================================
   MICROPHONE
========================================================= */

/*
Instead of MediaRecorder WebM chunks,
we send small PCM audio packets.

A MediaRecorder chunk is often NOT a
standalone decodable audio file. That was
one reason the previous microphone system
could appear to work locally but fail
during multiplayer playback.
*/

let micStream = null;

let micSource = null;

let micProcessor = null;

let micGain = null;

let micActive = false;


async function toggleMic() {

    if (micActive) {

        stopMic();

        return;

    }

    if (!isOnline) {

        alert(
            "Microphone voice chat is available in online multiplayer."
        );

        return;

    }

    try {

        micStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

        ensureAudio();

        micSource =
            audioCtx.createMediaStreamSource(
                micStream
            );

        /*
        ScriptProcessor is widely supported
        on mobile browsers.
        */

        micProcessor =
            audioCtx.createScriptProcessor(
                4096,
                1,
                1
            );

        micGain =
            audioCtx.createGain();

        micGain.gain.value = 0;

        micSource.connect(
            micProcessor
        );

        micProcessor.connect(
            micGain
        );

        micGain.connect(
            audioCtx.destination
        );

        micProcessor.onaudioprocess =
            event => {

                if (!micActive)
                    return;

                const input =
                    event.inputBuffer
                        .getChannelData(0);

                /*
                Convert Float32 audio to
                16-bit PCM.
                */

                const pcm =
                    new Int16Array(
                        input.length
                    );

                for (
                    let i = 0;
                    i < input.length;
                    i++
                ) {

                    let value =
                        Math.max(
                            -1,
                            Math.min(
                                1,
                                input[i]
                            )
                        );

                    pcm[i] =
                        value < 0
                        ? value * 32768
                        : value * 32767;

                }

                socket.emit(
                    "voicePCM",
                    pcm.buffer
                );

            };

        micActive = true;

        micButton.classList.add(
            "mic-live"
        );

        micButton.innerText =
            "🔴 Live";

    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        alert(
            "Microphone permission was denied or unavailable."
        );

    }

}


function stopMic() {

    micActive = false;

    if (micProcessor) {

        micProcessor.disconnect();

        micProcessor.onaudioprocess =
            null;

        micProcessor = null;

    }

    if (micSource) {

        micSource.disconnect();

        micSource = null;

    }

    if (micGain) {

        micGain.disconnect();

        micGain = null;

    }

    if (micStream) {

        micStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        micStream = null;

    }

    micButton.classList.remove(
        "mic-live"
    );

    micButton.innerText =
        "🎤";

}


/* =========================================================
   RECEIVE VOICE
========================================================= */

let voiceQueue = [];

let voicePlaying = false;


/*
Create a separate playback context.
*/

let voiceCtx = null;


socket.on(
    "voicePCM",
    arrayBuffer => {

        playPCM(
            arrayBuffer
        );

    }
);


function playPCM(buffer) {

    try {

        if (!voiceCtx) {

            voiceCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            voiceCtx.state ===
            "suspended"
        ) {

            voiceCtx.resume();

        }

        /*
        Server sends 16-bit PCM.
        */

        const int16 =
            new Int16Array(buffer);

        const audioBuffer =
            voiceCtx.createBuffer(
                1,
                int16.length,
                44100
            );

        const channel =
            audioBuffer.getChannelData(0);

        for (
            let i = 0;
            i < int16.length;
            i++
        ) {

            channel[i] =
                int16[i] / 32768;

        }

        voiceQueue.push(
            audioBuffer
        );

        playVoiceQueue();

    } catch (error) {

        console.log(
            "Voice playback error",
            error
        );

    }

}


function playVoiceQueue() {

    if (voicePlaying)
        return;

    if (!voiceQueue.length)
        return;

    voicePlaying = true;

    const buffer =
        voiceQueue.shift();

    const source =
        voiceCtx.createBufferSource();

    source.buffer =
        buffer;

    const gain =
        voiceCtx.createGain();

    gain.gain.value =
        1.0;

    source.connect(gain);

    gain.connect(
        voiceCtx.destination
    );

    source.onended = () => {

        voicePlaying = false;

        playVoiceQueue();

    };

    source.start();

}


/* =========================================================
   CONNECTION STATUS
========================================================= */

socket.on(
    "connect",
    () => {

        console.log(
            "Socket connected:",

socket.on(
    "disconnect",
    () => {

        status.innerText =
            "Connection lost. Reconnecting...";

        /*
        Stop local microphone when the
        connection disappears.
        */

        if (micActive)
            stopMic();

    }
);
