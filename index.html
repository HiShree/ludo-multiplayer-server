<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ludo Twist</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:10px;
    min-height:100vh;
    font-family:Arial,Segoe UI,sans-serif;
    background:linear-gradient(135deg,#163b73,#2859a0);
    color:white;
    overflow-x:hidden;
}

.header{
    width:100%;
    max-width:430px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.header h2{
    margin:8px 0;
    font-size:25px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:6px;
}

.badge{
    display:none;
    background:#2ecc71;
    padding:7px 11px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

.icon-btn{
    border:0;
    border-radius:50%;
    width:42px;
    height:42px;
    font-size:20px;
    cursor:pointer;
    background:#34495e;
    color:white;
}

#status{
    display:none;
    width:100%;
    max-width:430px;
    margin:7px auto;
    padding:9px;
    border-radius:20px;
    background:white;
    color:#222;
    text-align:center;
    font-weight:bold;
    min-height:38px;
}

/* ================= MENU ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    padding:15px;
}

.menu{
    width:100%;
    max-width:350px;
    background:white;
    color:#222;
    padding:22px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.menu h1{
    margin-top:0;
}

.menu h2{
    margin-top:0;
}

.menu button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:0;
    border-radius:9px;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.blueBtn{background:#1e90ff;}
.greenBtn{background:#2ecc71;}
.purpleBtn{background:#9b59b6;}
.redBtn{background:#e74c3c;}
.grayBtn{background:#7f8c8d;}

#local-menu,
#online-menu,
#private-menu,
#help-screen,
#settings-screen{
    display:none;
}

#room-code-input{
    width:100%;
    padding:12px;
    border:1px solid #bbb;
    border-radius:7px;
    text-align:center;
    font-size:16px;
    text-transform:uppercase;
    margin:5px 0;
}

/* ================= GAME ================= */

#game{
    display:none;
    width:100%;
    max-width:430px;
    margin:auto;
}

.player-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:8px 0;
}

.player-panel{
    display:flex;
    height:50px;
    border:3px solid transparent;
    border-radius:8px;
    overflow:hidden;
    opacity:.5;
    transition:.2s;
}

.player-panel.active{
    opacity:1;
    border-color:#ffd700;
    transform:scale(1.03);
}

.player-side{
    width:48px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.player-circle{
    width:25px;
    height:25px;
    border-radius:50%;
    border:2px solid white;
}

.dice{
    flex:1;
    border:0;
    background:white;
    color:#111;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
}

.dice.disabled{
    opacity:.55;
    cursor:not-allowed;
}

.blue-bg{background:#0984e3;}
.red-bg{background:#d63031;}
.green-bg{background:#00b894;}
.yellow-bg{background:#fdcb6e;}

.blue-pawn{background:#1e90ff;}
.red-pawn{background:#ff4757;}
.green-pawn{background:#2ed573;}
.yellow-pawn{background:#ffa502;}

/* ================= BOARD ================= */

.board{
    width:100%;
    aspect-ratio:1/1;
    position:relative;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:4px;
    padding:6px;
    background:#263746;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.45);
}

.cell{
    min-width:0;
    min-height:0;
    background:#ecf0f1;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color:#333;
}

.start-blue{
    background:linear-gradient(135deg,#74b9ff,#0984e3);
}

.start-red{
    background:linear-gradient(135deg,#ff7675,#d63031);
}

.start-green{
    background:linear-gradient(135deg,#55efc4,#00b894);
}

.start-yellow{
    background:linear-gradient(135deg,#ffeaa7,#fdcb6e);
}

.home{
    background:linear-gradient(135deg,#9b59b6,#8e44ad);
    color:white;
    font-weight:bold;
    font-size:15px;
}

.arrow{
    position:absolute;
    font-size:26px;
    opacity:.28;
    pointer-events:none;
}

/*
 IMPORTANT:
 Pawn layer is above the cells.
 Each slot exactly matches one board cell.
*/
#pawn-layer{
    position:absolute;
    left:6px;
    right:6px;
    top:6px;
    bottom:6px;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);

    gap:4px;

    z-index:50;
    pointer-events:none;
}

.pawn-slot{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    align-content:center;
    gap:2px;
    pointer-events:none;
}

.pawn{
    width:20px;
    height:20px;
    border-radius:50%;

    border:2px solid white;

    box-shadow:
        0 2px 5px rgba(0,0,0,.55),
        inset 0 1px 2px rgba(255,255,255,.5);

    pointer-events:auto;

    cursor:pointer;

    position:relative;
    z-index:100;

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.pawn:active{
    transform:scale(1.25);
}

.pawn.can-move{
    animation:pawnPulse .8s infinite;
    box-shadow:
        0 0 0 3px white,
        0 0 14px 5px rgba(255,255,255,.9);
}

@keyframes pawnPulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.18);
    }
    100%{
        transform:scale(1);
    }
}

/* Four pawns on same square */
.pawn-slot .pawn:nth-child(1){
    transform:translate(-10px,-8px);
}

.pawn-slot .pawn:nth-child(2){
    transform:translate(10px,-8px);
}

.pawn-slot .pawn:nth-child(3){
    transform:translate(-10px,8px);
}

.pawn-slot .pawn:nth-child(4){
    transform:translate(10px,8px);
}

.pawn-slot .pawn.can-move:nth-child(1){
    animation:pawnPulse1 .8s infinite;
}

.pawn-slot .pawn.can-move:nth-child(2){
    animation:pawnPulse2 .8s infinite;
}

.pawn-slot .pawn.can-move:nth-child(3){
    animation:pawnPulse3 .8s infinite;
}

.pawn-slot .pawn.can-move:nth-child(4){
    animation:pawnPulse4 .8s infinite;
}

@keyframes pawnPulse1{
    0%,100%{transform:translate(-10px,-8px) scale(1)}
    50%{transform:translate(-10px,-8px) scale(1.2)}
}

@keyframes pawnPulse2{
    0%,100%{transform:translate(10px,-8px) scale(1)}
    50%{transform:translate(10px,-8px) scale(1.2)}
}

@keyframes pawnPulse3{
    0%,100%{transform:translate(-10px,8px) scale(1)}
    50%{transform:translate(-10px,8px) scale(1.2)}
}

@keyframes pawnPulse4{
    0%,100%{transform:translate(10px,8px) scale(1)}
    50%{transform:translate(10px,8px) scale(1.2)}
}

/* ================= CHAT ================= */

#communication{
    display:none;
    width:100%;
    max-width:430px;
    margin:10px auto;
    background:rgba(0,0,0,.25);
    border-radius:12px;
    padding:10px;
}

#chat{
    height:90px;
    overflow-y:auto;
    background:rgba(255,255,255,.1);
    border-radius:7px;
    padding:7px;
    font-size:13px;
}

.chat-row{
    display:flex;
    gap:5px;
    margin-top:7px;
}

#chat-input{
    flex:1;
    min-width:0;
    padding:11px;
    border:0;
    border-radius:7px;
    font-size:14px;
}

.chat-row button{
    border:0;
    border-radius:7px;
    background:#e67e22;
    color:white;
    font-weight:bold;
    padding:10px;
}

.mic-active{
    background:#c0392b !important;
}

/* ================= MOBILE ================= */

@media(max-width:360px){

    body{
        padding:6px;
    }

    .header h2{
        font-size:21px;
    }

    .badge{
        font-size:11px;
    }

    .pawn{
        width:17px;
        height:17px;
    }

    .dice{
        font-size:23px;
    }
}
</style>
</head>

<body>

<!-- ================= MAIN MENU ================= -->

<div id="setup-screen" class="overlay">

    <div id="main-menu" class="menu">
        <h1>🎲 Ludo Twist</h1>

        <button class="blueBtn" onclick="showLocalMenu()">
            Play Local (Offline)
        </button>

        <button class="greenBtn" onclick="showOnlineMenu()">
            Play Online Multiplayer
        </button>
    </div>

    <div id="local-menu" class="menu">

        <h2>Local Mode</h2>

        <button class="blueBtn" onclick="startLocalGame(1)">
            1 Player vs Bot
        </button>

        <button class="blueBtn" onclick="startLocalGame(2)">
            2 Players
        </button>

        <button class="blueBtn" onclick="startLocalGame(3)">
            3 Players
        </button>

        <button class="blueBtn" onclick="startLocalGame(4)">
            4 Players
        </button>

        <button class="grayBtn" onclick="backToMain()">
            Back
        </button>
    </div>

    <div id="online-menu" class="menu">

        <h2>Online Multiplayer</h2>

        <button class="greenBtn" onclick="startOnlineGame(2)">
            Public 2 Player
        </button>

        <button class="greenBtn" onclick="startOnlineGame(3)">
            Public 3 Player
        </button>

        <button class="greenBtn" onclick="startOnlineGame(4)">
            Public 4 Player
        </button>

        <hr>

        <button class="purpleBtn" onclick="showPrivateMenu()">
            Private Room
        </button>

        <button class="grayBtn" onclick="backToMain()">
            Back
        </button>
    </div>

    <div id="private-menu" class="menu">

        <h2>Private Room</h2>

        <button class="greenBtn"
                onclick="createPrivateGame(2)">
            Create 2 Player
        </button>

        <button class="greenBtn"
                onclick="createPrivateGame(3)">
            Create 3 Player
        </button>

        <button class="greenBtn"
                onclick="createPrivateGame(4)">
            Create 4 Player
        </button>

        <p><b>OR</b></p>

        <input
            id="room-code-input"
            placeholder="ROOM CODE"
            maxlength="10">

        <button class="purpleBtn"
                onclick="joinPrivateGame()">
            Join Room
        </button>

        <button class="grayBtn"
                onclick="showOnlineMenu()">
            Back
        </button>
    </div>

</div>

<!-- ================= SETTINGS ================= -->

<div id="settings-screen" class="overlay">

    <div class="menu">

        <h2>⚙️ Settings</h2>

        <button
            id="sound-button"
            class="blueBtn"
            onclick="toggleSound()">
            🔊 Sound: ON
        </button>

        <button
            class="redBtn"
            onclick="toggleSettings()">
            Close
        </button>

    </div>
</div>

<!-- ================= HELP ================= -->

<div id="help-screen" class="overlay">

    <div class="menu">

        <h2>❓ How To Play</h2>

        <p>
            Roll the dice when it is your turn.
        </p>

        <p>
            Tap a glowing pawn to move it.
        </p>

        <p>
            Rolling <b>4 or 8</b> gives an extra turn.
        </p>

        <button
            class="redBtn"
            onclick="toggleHelp()">
            Close
        </button>

    </div>
</div>

<!-- ================= HEADER ================= -->

<div class="header">

    <h2>🎲 Ludo Twist</h2>

    <div class="header-right">

        <div id="identity"
             class="badge">
        </div>

        <button class="icon-btn"
                onclick="toggleSettings()">
            ⚙️
        </button>

        <button class="icon-btn"
                onclick="toggleHelp()">
            ❓
        </button>

    </div>
</div>

<div id="status">
    Waiting...
</div>

<!-- ================= GAME ================= -->

<div id="game">

    <div class="player-row">

        <div class="player-panel"
             id="panel-1">

            <div class="player-side red-bg">
                <div class="player-circle red-pawn"></div>
            </div>

            <button
                id="dice-1"
                class="dice disabled"
                onclick="requestRoll(1)">
                🎲
            </button>

        </div>

        <div class="player-panel"
             id="panel-2">

            <div class="player-side green-bg">
                <div class="player-circle green-pawn"></div>
            </div>

            <button
                id="dice-2"
                class="dice disabled"
                onclick="requestRoll(2)">
                🎲
            </button>

        </div>

    </div>

    <!-- BOARD -->

    <div id="board" class="board">

        <!-- Cells are generated by JavaScript -->

        <div id="pawn-layer">
            <!-- Pawn slots generated here -->
        </div>

    </div>

    <div class="player-row">

        <div class="player-panel"
             id="panel-0">

            <div class="player-side blue-bg">
                <div class="player-circle blue-pawn"></div>
            </div>

            <button
                id="dice-0"
                class="dice disabled"
                onclick="requestRoll(0)">
                🎲
            </button>

        </div>

        <div class="player-panel"
             id="panel-3">

            <div class="player-side yellow-bg">
                <div class="player-circle yellow-pawn"></div>
            </div>

            <button
                id="dice-3"
                class="dice disabled"
                onclick="requestRoll(3)">
                🎲
            </button>

        </div>

    </div>

</div>

<!-- ================= CHAT ================= -->

<div id="communication">

    <div id="chat"></div>

    <div class="chat-row">

        <input
            id="chat-input"
            placeholder="Type message..."
            onkeydown="if(event.key==='Enter')sendChat()">

        <button onclick="sendChat()">
            Send
        </button>

        <button
            id="mic"
            onclick="toggleMic()">
            🎤
        </button>

    </div>

</div>


<script>

/* =========================================================
   SOCKET
========================================================= */

const socket = io();

let isOnline = false;
let myPlayerId = null;


/* =========================================================
   GAME CONSTANTS
========================================================= */

const TOTAL_SPACES = 25;
const HOME_SPACE = 12;


/*
    Every player has their own path.

    Step 0 = starting square
    Step 24 = HOME
*/

const PLAYER_DATA = [

    {
        id:0,
        name:"Blue",
        color:"#1e90ff",
        pawns:[0,0,0,0],
        hasWon:false,
        winRank:0,
        hasKilled:false,
        isBot:false,

        path:[
            10,15,20,21,22,
            23,24,19,14,9,
            4,3,2,1,0,
            5,6,7,8,13,
            18,17,16,11,12
        ]
    },

    {
        id:1,
        name:"Red",
        color:"#ff4757",
        pawns:[0,0,0,0],
        hasWon:false,
        winRank:0,
        hasKilled:false,
        isBot:false,

        path:[
            2,1,0,5,10,
            15,20,21,22,23,
            24,19,14,9,4,
            3,8,13,18,17,
            16,11,6,7,12
        ]
    },

    {
        id:2,
        name:"Green",
        color:"#2ed573",
        pawns:[0,0,0,0],
        hasWon:false,
        winRank:0,
        hasKilled:false,
        isBot:false,

        path:[
            14,9,4,3,2,
            1,0,5,10,15,
            20,21,22,23,24,
            19,18,17,16,11,
            6,7,8,13,12
        ]
    },

    {
        id:3,
        name:"Yellow",
        color:"#ffa502",
        pawns:[0,0,0,0],
        hasWon:false,
        winRank:0,
        hasKilled:false,
        isBot:false,

        path:[
            22,23,24,19,14,
            9,4,3,2,1,
            0,5,10,15,20,
            21,16,11,6,7,
            8,13,18,17,12
        ]
    }

];

let players = [];

let activePlayerIndex = 0;

let activeRoll = null;

let canRoll = true;

let isAnimating = false;

let rank = 1;

let soundEnabled = true;

let audioCtx = null;


/* =========================================================
   MENU
========================================================= */

function showLocalMenu(){

    document.getElementById("main-menu").style.display="none";

    document.getElementById("local-menu").style.display="block";
}

function showOnlineMenu(){

    document.getElementById("main-menu").style.display="none";

    document.getElementById("local-menu").style.display="none";

    document.getElementById("private-menu").style.display="none";

    document.getElementById("online-menu").style.display="block";
}

function showPrivateMenu(){

    document.getElementById("online-menu").style.display="none";

    document.getElementById("private-menu").style.display="block";
}

function backToMain(){

    document.getElementById("local-menu").style.display="none";

    document.getElementById("online-menu").style.display="none";

    document.getElementById("private-menu").style.display="none";

    document.getElementById("main-menu").style.display="block";
}


/* =========================================================
   SETTINGS / HELP
========================================================= */

function toggleSettings(){

    const x=document.getElementById("settings-screen");

    x.style.display =
        x.style.display==="flex"
        ? "none"
        : "flex";
}

function toggleHelp(){

    const x=document.getElementById("help-screen");

    x.style.display =
        x.style.display==="flex"
        ? "none"
        : "flex";
}

function toggleSound(){

    soundEnabled=!soundEnabled;

    document.getElementById("sound-button").innerText =
        soundEnabled
        ? "🔊 Sound: ON"
        : "🔇 Sound: OFF";
}


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();

    }
}

function moveSound(){

    if(!soundEnabled) return;

    initAudio();

    const osc=audioCtx.createOscillator();

    const gain=audioCtx.createGain();

    osc.type="triangle";

    osc.frequency.value=380;

    gain.gain.setValueAtTime(
        .18,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .01,
        audioCtx.currentTime+.09
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+.09
    );
}


/* =========================================================
   START LOCAL
========================================================= */

function startLocalGame(number){

    initAudio();

    isOnline=false;

    myPlayerId=0;

    players =
        JSON.parse(
            JSON.stringify(PLAYER_DATA)
        );

    if(number===1){

        players=[
            players[0],
            players[2]
        ];

        players[1].name="Green (Bot)";
        players[1].isBot=true;

    }else{

        players=players.slice(0,number);

    }

    activePlayerIndex=0;

    activeRoll=null;

    canRoll=true;

    isAnimating=false;

    rank=1;

    document.getElementById("setup-screen").style.display="none";

    document.getElementById("game").style.display="block";

    document.getElementById("status").style.display="block";

    document.getElementById("communication").style.display="block";

    document.getElementById("identity").style.display="block";

    document.getElementById("identity").innerText="You are Blue";

    setupBoard();

    setupPanels();

    render();

    updateTurn();

}


/* =========================================================
   START ONLINE
========================================================= */

function startOnlineGame(number){

    initAudio();

    isOnline=true;

    document.getElementById("setup-screen").style.display="none";

    document.getElementById("status").style.display="block";

    socket.emit("joinGame",number);

}

function createPrivateGame(number){

    initAudio();

    isOnline=true;

    document.getElementById("setup-screen").style.display="none";

    document.getElementById("status").style.display="block";

    socket.emit(
        "createPrivateGame",
        number
    );

}

function joinPrivateGame(){

    const code =
        document
        .getElementById("room-code-input")
        .value
        .trim()
        .toUpperCase();

    if(!code){

        alert("Enter room code");

        return;
    }

    initAudio();

    isOnline=true;

    document.getElementById("setup-screen").style.display="none";

    document.getElementById("status").style.display="block";

    socket.emit(
        "joinPrivateGame",
        code
    );
}


/* =========================================================
   SOCKET PLAYER ASSIGNMENT
========================================================= */

socket.on("assignPlayer",function(id){

    myPlayerId=id;

    const p=PLAYER_DATA.find(
        x=>x.id===id
    );

    document.getElementById("identity").style.display="block";

    document.getElementById("identity").innerText=
        "You are "+(p?p.name:"Player");

    document.getElementById("communication").style.display="block";

});


/* =========================================================
   GAME START
========================================================= */

socket.on("gameStart",function(ids){

    players =
        ids.map(id =>
            JSON.parse(
                JSON.stringify(
                    PLAYER_DATA[id]
                )
            )
        );

    activePlayerIndex=0;

    activeRoll=null;

    canRoll=true;

    isAnimating=false;

    rank=1;

    document.getElementById("game").style.display="block";

    document.getElementById("communication").style.display="block";

    setupBoard();

    setupPanels();

    render();

    updateTurn();

});


/* =========================================================
   BOARD
========================================================= */

function setupBoard(){

    const board=
        document.getElementById("board");

    /*
        Remove only cells.
        DO NOT remove pawn-layer.
    */

    board
        .querySelectorAll(".cell")
        .forEach(x=>x.remove());

    const pawnLayer=
        document.getElementById("pawn-layer");

    /*
        Put cells before pawn layer.
    */

    for(let i=0;i<TOTAL_SPACES;i++){

        const cell=
            document.createElement("div");

        cell.className="cell";

        if(i===HOME_SPACE){

            cell.classList.add("home");

            cell.innerText="HOME";

        }

        else if(i===10){

            cell.classList.add("start-blue");

        }

        else if(i===2){

            cell.classList.add("start-red");

        }

        else if(i===14){

            cell.classList.add("start-green");

        }

        else if(i===22){

            cell.classList.add("start-yellow");

        }


        const arrows={
            10:"↓",
            22:"→",
            14:"↑",
            2:"←",
            11:"→",
            17:"↑",
            13:"←",
            7:"↓"
        };

        if(arrows[i] && i!==HOME_SPACE){

            const arrow=
                document.createElement("div");

            arrow.className="arrow";

            arrow.innerText=arrows[i];

            cell.appendChild(arrow);

        }

        board.insertBefore(
            cell,
            pawnLayer
        );

    }


    /*
        Create EXACTLY 25 pawn slots.
    */

    pawnLayer.innerHTML="";

    for(let i=0;i<TOTAL_SPACES;i++){

        const slot=
            document.createElement("div");

        slot.className="pawn-slot";

        slot.id="pawn-slot-"+i;

        pawnLayer.appendChild(slot);

    }

}


/* =========================================================
   PANELS
========================================================= */

function setupPanels(){

    for(let i=0;i<4;i++){

        const panel=
            document.getElementById(
                "panel-"+i
            );

        const player=
            players.find(
                p=>p.id===i
            );

        if(player){

            panel.style.display="flex";

        }else{

            panel.style.display="none";

        }

    }

}


/* =========================================================
   RENDER PAWNS
========================================================= */

function render(){

    /*
        Safety check.
    */

    if(!document.getElementById("pawn-slot-0")){

        setupBoard();

    }


    /*
        CLEAR ALL PAWNS.
    */

    for(let i=0;i<TOTAL_SPACES;i++){

        const slot=
            document.getElementById(
                "pawn-slot-"+i
            );

        if(slot){

            slot.innerHTML="";

        }

    }


    /*
        CREATE EVERY PAWN.
    */

    players.forEach(player=>{

        player.pawns.forEach(
            (step,pawnIndex)=>{

                /*
                    IMPORTANT:
                    Never allow an invalid path index.
                */

                if(step<0) step=0;

                if(step>=player.path.length){

                    step=player.path.length-1;

                }


                const gridIndex=
                    player.path[step];


                const slot=
                    document.getElementById(
                        "pawn-slot-"+gridIndex
                    );


                if(!slot){

                    console.error(
                        "Pawn slot missing:",
                        gridIndex
                    );

                    return;

                }


                const pawn=
                    document.createElement("div");

                pawn.className="pawn";


                /*
                    Color.
                */

                pawn.style.backgroundColor=
                    player.color;


                /*
                    Check whether this pawn
                    can currently move.
                */

                const current=
                    players[activePlayerIndex];


                const isCurrent=
                    current &&
                    current.id===player.id;


                const isMine=
                    isOnline
                    ? player.id===myPlayerId
                    : !player.isBot;


                let movable=false;


                if(
                    isCurrent &&
                    isMine &&
                    activeRoll!==null &&
                    !isAnimating
                ){

                    const future=
                        step+activeRoll;

                    if(future<=24){

                        movable=true;

                    }

                }


                if(movable){

                    pawn.classList.add(
                        "can-move"
                    );

                }


                /*
                    CLICK HANDLER.
                */

                pawn.addEventListener(
                    "click",
                    function(e){

                        e.preventDefault();

                        e.stopPropagation();

                        if(!movable){

                            return;

                        }

                        movePawn(
                            player.id,
                            pawnIndex
                        );

                    }
                );


                /*
                    Helpful accessibility label.
                */

                pawn.title=
                    player.name+
                    " pawn "+
                    (pawnIndex+1);


                slot.appendChild(pawn);

            }
        );

    });


    updateTurn();

}


/* =========================================================
   TURN UI
========================================================= */

function updateTurn(){

    if(players.length===0){

        return;

    }

    const current=
        players[activePlayerIndex];

    if(!current){

        return;

    }


    /*
        Panels.
    */

    for(let i=0;i<4;i++){

        const panel=
            document.getElementById(
                "panel-"+i
            );

        const dice=
            document.getElementById(
                "dice-"+i
            );

        if(!panel || !dice) continue;


        panel.classList.remove("active");

        dice.classList.add("disabled");

        const p=
            players.find(
                x=>x.id===i
            );

        if(!p) continue;


        if(p.hasWon){

            dice.innerText="👑";

            continue;

        }


        dice.innerText=
            activeRoll===null
            ? "🎲"
            : activeRoll;


        if(p.id===current.id){

            panel.classList.add("active");


            const mine=
                isOnline
                ? p.id===myPlayerId
                : !p.isBot;


            if(
                mine &&
                canRoll &&
                !isAnimating
            ){

                dice.classList.remove(
                    "disabled"
                );

            }

        }

    }


    /*
        Status.
    */

    const status=
        document.getElementById("status");


    if(isAnimating){

        status.innerText=
            "Moving pawn...";

        return;

    }


    const mine=
        isOnline
        ? current.id===myPlayerId
        : !current.isBot;


    if(activeRoll!==null){

        status.innerText=
            mine
            ? "🎯 Tap a glowing pawn to move!"
            : current.name+
              " is moving...";

    }else{

        status.innerText=
            mine
            ? "🎲 Your turn! Roll the dice."
            : current.name+
              "'s turn...";

    }

}


/* =========================================================
   ROLL
========================================================= */

function requestRoll(playerId){

    const current=
        players[activePlayerIndex];

    if(!current) return;

    if(playerId!==current.id) return;

    if(isAnimating) return;

    if(!canRoll) return;


    const mine=
        isOnline
        ? playerId===myPlayerId
        : !current.isBot;


    if(!mine) return;


    initAudio();


    canRoll=false;


    const rollValues=[
        1,1,
        2,2,
        3,3,
        4,4,
        8,8
    ];


    const roll=
        rollValues[
            Math.floor(
                Math.random()*rollValues.length
            )
        ];


    if(isOnline){

        socket.emit(
            "requestRoll",
            {
                playerId:playerId,
                rollValue:roll
            }
        );

    }else{

        receiveRoll(
            playerId,
            roll
        );

    }

}


/* =========================================================
   RECEIVE ROLL
========================================================= */

socket.on(
    "executeRoll",
    function(data){

        receiveRoll(
            data.playerId,
            data.rollValue
        );

    }
);


function receiveRoll(
    playerId,
    value
){

    const current=
        players[activePlayerIndex];

    if(!current) return;

    if(playerId!==current.id){

        return;

    }


    activeRoll=value;


    const dice=
        document.getElementById(
            "dice-"+playerId
        );

    if(dice){

        dice.innerText=value;

    }


    /*
        4 or 8 gives another roll,
        but the player still gets to move first.
    */

    canRoll=
        value===4 ||
        value===8;


    render();


    /*
        Check if there is a pawn
        that can actually move.
    */

    const valid=
        current.pawns.some(
            step =>
                step+value<=24
        );


    if(!valid){

        activeRoll=null;

        canRoll=false;

        render();


        setTimeout(
            nextTurn,
            900
        );

        return;

    }


    /*
        BOT.
    */

    if(!isOnline &&
       current.isBot){

        setTimeout(
            botMove,
            700
        );

    }

}


/* =========================================================
   MOVE PAWN
========================================================= */

function movePawn(
    playerId,
    pawnIndex
){

    if(isAnimating) return;


    const current=
        players[activePlayerIndex];

    if(!current) return;

    if(current.id!==playerId) return;

    if(activeRoll===null) return;


    const player=
        players.find(
            p=>p.id===playerId
        );

    if(!player) return;


    const mine=
        isOnline
        ? player.id===myPlayerId
        : !player.isBot;


    if(!mine) return;


    /*
        IMPORTANT:
        Lock immediately.
    */

    isAnimating=true;

    const roll=activeRoll;

    activeRoll=null;


    if(isOnline){

        socket.emit(
            "requestMove",
            {
                playerId:playerId,
                pawnIndex:pawnIndex
            }
        );

    }


    animatePawn(
        player,
        pawnIndex,
        roll
    );

}


/* =========================================================
   RECEIVE ONLINE MOVE
========================================================= */

socket.on(
    "executeMove",
    function(data){

        /*
            Do not execute the move twice
            on the player who already sent it.
        */

        if(!isOnline) return;

        if(
            data.playerId===myPlayerId &&
            isAnimating
        ){

            /*
                The local player already sent
                the request, so continue using
                the local animation.
            */

            return;

        }

        const player=
            players.find(
                p=>p.id===data.playerId
            );

        if(!player) return;


        const roll=
            activeRoll;


        if(roll===null){

            /*
                Online clients normally receive
                the roll first.
            */

            return;

        }


        isAnimating=true;

        activeRoll=null;


        animatePawn(
            player,
            data.pawnIndex,
            roll
        );

    }
);


/* =========================================================
   ANIMATE PAWN
========================================================= */

function animatePawn(
    player,
    pawnIndex,
    steps
){

    let moved=0;


    function stepAnimation(){

        if(moved<steps){

            if(
                player.pawns[pawnIndex]
                >=24
            ){

                finishMove();

                return;

            }


            player.pawns[pawnIndex]++;

            moved++;


            /*
                SOUND IS PLAYED EXACTLY
                WHEN PAWN TAKES A STEP.
            */

            moveSound();


            render();


            /*
                Same timing for sound and
                visual movement.
            */

            setTimeout(
                stepAnimation,
                180
            );

        }else{

            finishMove();

        }

    }


    stepAnimation();


    function finishMove(){

        /*
            Capture.
        */

        const finalStep=
            player.pawns[pawnIndex];

        const finalCell=
            player.path[finalStep];


        let captured=false;


        if(
            ![2,10,14,22,12]
            .includes(finalCell)
        ){

            players.forEach(
                opponent=>{

                    if(
                        opponent.id===
                        player.id
                    ) return;


                    opponent.pawns.forEach(
                        (opStep,index)=>{

                            if(
                                opStep<24 &&
                                opponent.path[opStep]
                                ===finalCell
                            ){

                                opponent.pawns[index]=0;

                                captured=true;

                            }

                        }
                    );

                }
            );

        }


        /*
            Check win.
        */

        if(
            player.pawns.every(
                x=>x===24
            )
        ){

            player.hasWon=true;

            player.winRank=rank++;

        }


        isAnimating=false;


        /*
            Extra turn:
            - rolling 4
            - rolling 8
            - capture
            - pawn reaches home
        */

        const extra=
            steps===4 ||
            steps===8 ||
            captured ||
            finalStep===24;


        if(extra){

            canRoll=true;

        }else{

            canRoll=false;

        }


        if(
            player.hasWon
        ){

            setTimeout(
                nextTurn,
                800
            );

        }

        else if(extra){

            render();

        }

        else{

            setTimeout(
                nextTurn,
                700
            );

        }


        if(isOnline){

            sendSync();

        }

    }

}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

    activeRoll=null;

    canRoll=true;

    isAnimating=false;


    /*
        Find next player who hasn't won.
    */

    let attempts=0;

    do{

        activePlayerIndex=
            (
                activePlayerIndex+1
            )%players.length;

        attempts++;

    }while(
        players[activePlayerIndex].hasWon &&
        attempts<players.length+1
    );


    /*
        If everyone except one has won,
        keep the last player active.
    */

    render();


    if(
        !isOnline &&
        players[activePlayerIndex].isBot
    ){

        setTimeout(
            botRoll,
            800
        );

    }


    if(isOnline){

        sendSync();

    }

}


/* =========================================================
   BOT
========================================================= */

function botRoll(){

    const bot=
        players[activePlayerIndex];

    if(!bot || !bot.isBot) return;

    if(isAnimating) return;

    if(activeRoll!==null) return;


    canRoll=true;

    requestBotRoll();

}

function requestBotRoll(){

    const bot=
        players[activePlayerIndex];

    if(!bot) return;


    const values=[
        1,1,
        2,2,
        3,3,
        4,4,
        8,8
    ];


    const roll=
        values[
            Math.floor(
                Math.random()*values.length
            )
        ];


    canRoll=false;

    receiveRoll(
        bot.id,
        roll
    );

}


function botMove(){

    const bot=
        players[activePlayerIndex];

    if(!bot || !bot.isBot) return;

    if(activeRoll===null) return;

    if(isAnimating) return;


    const valid=[];


    bot.pawns.forEach(
        (step,index)=>{

            if(
                step+activeRoll<=24
            ){

                valid.push(index);

            }

        }
    );


    if(valid.length===0){

        activeRoll=null;

        canRoll=false;

        setTimeout(
            nextTurn,
            600
        );

        return;

    }


    const selected=
        valid[
            Math.floor(
                Math.random()*valid.length
            )
        ];


    movePawn(
        bot.id,
        selected
    );

}


/* =========================================================
   SYNC
========================================================= */

function sendSync(){

    if(!isOnline) return;


    socket.emit(
        "syncState",
        {
            activeIndex:
                activePlayerIndex,

            activeRoll:
                activeRoll,

            canRoll:
                canRoll,

            players:
                players.map(
                    p=>({
                        id:p.id,
                        pawns:p.pawns,
                        hasWon:p.hasWon,
                        winRank:p.winRank
                    })
                )
        }
    );

}


/*
    IMPORTANT:
    Compatible with older server versions
    that use activeRolls.
*/

socket.on(
    "forceSync",
    function(state){

        if(!isOnline) return;


        if(
            typeof state.activeIndex==="number"
        ){

            activePlayerIndex=
                state.activeIndex;

        }


        if(
            typeof state.activeRoll==="number"
        ){

            activeRoll=
                state.activeRoll;

        }

        else if(
            Array.isArray(state.activeRolls) &&
            state.activeRolls.length
        ){

            activeRoll=
                state.activeRolls[0];

        }

        else{

            activeRoll=null;

        }


        if(
            typeof state.canRoll==="boolean"
        ){

            canRoll=state.canRoll;

        }


        if(Array.isArray(state.players)){

            state.players.forEach(
                serverPlayer=>{

                    const local=
                        players.find(
                            p=>p.id===serverPlayer.id
                        );

                    if(!local) return;


                    if(
                        Array.isArray(
                            serverPlayer.pawns
                        )
                    ){

                        local.pawns=
                            serverPlayer.pawns.slice();

                    }


                    local.hasWon=
                        !!serverPlayer.hasWon;

                }
            );

        }


        isAnimating=false;

        render();

    }
);


/* =========================================================
   CHAT
========================================================= */

function sendChat(){

    const input=
        document.getElementById(
            "chat-input"
        );

    const text=
        input.value.trim();

    if(!text) return;


    const player=
        players.find(
            p=>p.id===myPlayerId
        );


    const name=
        player
        ? player.name
        : "Player";


    if(isOnline){

        socket.emit(
            "sendChatMessage",
            {
                name:name,
                text:text
            }
        );

    }else{

        addChat(
            name,
            text
        );

    }


    input.value="";

}


socket.on(
    "receiveChatMessage",
    function(data){

        addChat(
            data.name,
            data.text
        );

    }
);


function addChat(name,text){

    const chat=
        document.getElementById("chat");

    const line=
        document.createElement("div");

    /*
        textContent prevents HTML injection.
    */

    const bold=
        document.createElement("b");

    bold.textContent=
        name+": ";

    line.appendChild(bold);

    line.appendChild(
        document.createTextNode(text)
    );

    chat.appendChild(line);

    chat.scrollTop=
        chat.scrollHeight;

}


/* =========================================================
   MICROPHONE
========================================================= */

let micStream=null;
let micRecorder=null;
let micActive=false;

async function toggleMic(){

    const button=
        document.getElementById("mic");


    if(micActive){

        if(micRecorder){

            micRecorder.stop();

        }

        if(micStream){

            micStream
                .getTracks()
                .forEach(
                    t=>t.stop()
                );

        }

        micActive=false;

        button.classList.remove(
            "mic-active"
        );

        button.innerText="🎤";

        return;

    }


    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

        alert(
            "Microphone is not supported by this browser."
        );

        return;

    }


    try{

        micStream=
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


        const options=
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
            ? {
                mimeType:
                "audio/webm;codecs=opus"
              }
            : {};


        micRecorder=
            new MediaRecorder(
                micStream,
                options
            );


        micRecorder.ondataavailable=
            async function(event){

                if(
                    !event.data ||
                    event.data.size===0
                ){

                    return;

                }


                if(!isOnline) return;


                const buffer=
                    await event.data.arrayBuffer();


                socket.emit(
                    "voiceData",
                    buffer
                );

            };


        micRecorder.start(250);


        micActive=true;

        button.classList.add(
            "mic-active"
        );

        button.innerText="🔴";


    }catch(error){

        console.error(error);

        alert(
            "Microphone permission was denied or unavailable."
        );

    }

}


/* =========================================================
   VOICE RECEIVE
========================================================= */

let voiceAudioContext=null;

socket.on(
    "voiceData",
    async function(data){

        try{

            if(!voiceAudioContext){

                voiceAudioContext=
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }


            if(
                voiceAudioContext.state===
                "suspended"
            ){

                await voiceAudioContext.resume();

            }


            let buffer;


            if(data instanceof ArrayBuffer){

                buffer=data;

            }

            else if(data && data.buffer){

                buffer=data.buffer;

            }

            else{

                return;

            }


            const decoded=
                await voiceAudioContext
                .decodeAudioData(
                    buffer.slice(0)
                );


            const source=
                voiceAudioContext
                .createBufferSource();


            source.buffer=decoded;

            source.connect(
                voiceAudioContext.destination
            );

            source.start();

        }catch(error){

            console.log(
                "Voice playback error:",
                error
            );

        }

    }
);


/* =========================================================
   SERVER MESSAGES
========================================================= */

socket.on(
    "systemMessage",
    function(message){

        document.getElementById(
            "status"
        ).innerText=message;

    }
);


socket.on(

        /*

        setupBoard();
